/* Rounds display in bracket-logical order (earliest stage → final) no matter what order
   the organizer created them in — ranked by keyword in the round's name, most-specific
   stage names checked first since e.g. "semifinal"/"cuartos de final" both contain the
   substring "final" too. Unrecognized names rank first (0) and keep their relative
   creation order via the index tiebreak, so a stable custom name like "Grupo A" doesn't
   get shuffled around by the sort. */
function bracketRoundRank(name){
  var n = String(name || "").toLowerCase();
  if (n.indexOf("semifinal") !== -1) return 90;
  if (n.indexOf("cuartos") !== -1) return 80;
  if (n.indexOf("octavos") !== -1) return 70;
  if (n.indexOf("dieciseisavos") !== -1) return 60;
  if (n.indexOf("treintaidosavos") !== -1) return 50;
  if (n.indexOf("final") !== -1) return 100;
  return 0;
}
function sortedRounds(){
  return STATE.bracket.map(function(r, i){ return { r:r, i:i }; })
    .sort(function(x, y){
      var d = bracketRoundRank(x.r.name) - bracketRoundRank(y.r.name);
      return d !== 0 ? d : x.i - y.i;
    })
    .map(function(o){ return o.r; });
}

function generateRoundRobin(pairs){
  var ids = pairs.map(function(p){ return p.id; });
  if (ids.length % 2 !== 0) ids.push(null);
  var n = ids.length;
  if (n < 2) return [];
  var rounds = []; var arr = ids.slice();
  for (var r=0;r<n-1;r++){
    var roundPairs = [];
    for (var i=0;i<n/2;i++){
      var a = arr[i], b = arr[n-1-i];
      if (a!==null && b!==null) roundPairs.push([a,b]);
    }
    rounds.push(roundPairs);
    var fixed = arr[0]; var rest = arr.slice(1); rest.unshift(rest.pop());
    arr = [fixed].concat(rest);
  }
  return rounds;
}
function matchPoints(setsA, setsB){
  var diff = Math.abs(setsA - setsB);
  var winPts = diff >= 2 ? 3 : 2;
  var losePts = diff >= 2 ? 0 : 1;
  return setsA > setsB ? [winPts, losePts] : [losePts, winPts];
}
function parseGamesFromMarcador(marcador){
  if (!marcador) return null;
  var gA = 0, gB = 0, found = false;
  String(marcador).split(",").forEach(function(part){
    var m = part.trim().match(/(\d+)\s*-\s*(\d+)/);
    if (m){ gA += parseInt(m[1],10); gB += parseInt(m[2],10); found = true; }
  });
  return found ? { gA:gA, gB:gB } : null;
}
function headToHeadResult(aId, bId){
  var m = STATE.matches.filter(function(x){
    return x.played && ((x.pairA===aId && x.pairB===bId) || (x.pairA===bId && x.pairB===aId));
  })[0];
  if (!m) return 0;
  var aIsA = m.pairA === aId;
  var aSets = aIsA ? m.setsA : m.setsB;
  var bSets = aIsA ? m.setsB : m.setsA;
  if (aSets > bSets) return 1;
  if (bSets > aSets) return -1;
  return 0;
}
function computeStandings(){
  var table = {};
  STATE.pairs.filter(function(p){ return p.confirmed; }).forEach(function(p){
    table[p.id] = { id:p.id, label:p.j1+" / "+p.j2, pj:0, pg:0, pp:0, sf:0, sc:0, gf:0, gc:0, pts:0 };
  });
  STATE.matches.forEach(function(m){
    if (!m.played) return;
    var a = table[m.pairA], b = table[m.pairB];
    if (!a || !b) return;
    a.pj++; b.pj++; a.sf+=m.setsA; a.sc+=m.setsB; b.sf+=m.setsB; b.sc+=m.setsA;
    if (m.setsA > m.setsB){ a.pg++; b.pp++; } else { b.pg++; a.pp++; }
    var pts = matchPoints(m.setsA, m.setsB);
    a.pts += pts[0]; b.pts += pts[1];
    var games = parseGamesFromMarcador(m.marcador);
    if (games){ a.gf += games.gA; a.gc += games.gB; b.gf += games.gB; b.gc += games.gA; }
  });
  var rows = Object.keys(table).map(function(k){ var r=table[k]; r.dif=r.sf-r.sc; r.gdif=r.gf-r.gc; return r; });
  rows.sort(function(x,y){
    if (y.pts!==x.pts) return y.pts-x.pts;
    var h2h = headToHeadResult(x.id, y.id);
    if (h2h !== 0) return -h2h;
    if (y.dif!==x.dif) return y.dif-x.dif;
    if (y.gdif!==x.gdif) return y.gdif-x.gdif;
    return x.label.localeCompare(y.label);
  });
  return rows;
}

function renderMatchesByJornada(){
  var byJ = {};

/* ============================================================
   Scroll-driven fx engine
   Everything here is a pure function of the CURRENT scroll position,
   recomputed every frame while scrolling (rAF-throttled) — nothing is
   triggered once and left alone. Scroll up and every effect runs in
   reverse, exactly in step. Two kinds of elements are handled:
     .fx-reveal    — fades/rises/settles into place as it enters the
                     lower part of the viewport (optionally combined
                     with a per-element drift via data-speed)
     .fx-parallax  — pure differential drift, no fade, keyed off how
                     far the element's center sits from the viewport's
                     center (data-speed sets amplitude + direction)
     .hero         — scale/fade/drift as the user scrolls past it,
                     applied via the --hero-p custom property
   None of this checks prefers-reduced-motion: it's deliberately kept
   subtle (small amplitudes, no autoplay, nothing that moves without
   the visitor's own scroll input) so it plays the same for everyone. */
var fx = { hero:null, reveals:[], parallax:[], navLinks:[], navSections:[] };
var fxTicking = false;

function fxClamp01(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }

/* elements later in the same list/grid need a touch more scroll before they
   settle, so groups cascade in rather than popping in as one flat block —
   computed once per collectFx() call, not on every scroll frame */
function fxSiblingDelay(el){
  var group = el.parentElement;
  if (!group) return 0;
  var i = 0;
  for (var c = group.firstElementChild; c; c = c.nextElementSibling){
    if (c === el) return Math.min(i * 0.04, 0.16);
    if (c.classList && c.classList.contains("fx-reveal")) i++;
  }
  return 0;
}

function collectFx(){
  fx.hero = document.querySelector(".hero");
  fx.reveals = Array.prototype.slice.call(document.querySelectorAll(".fx-reveal"));
  fx.parallax = Array.prototype.slice.call(document.querySelectorAll(".fx-parallax"));
  fx.reveals.forEach(function(el){
    el.dataset.fxDelay = fxSiblingDelay(el);
  });
  fx.navLinks = Array.prototype.slice.call(document.querySelectorAll(".header-nav a"));
  fx.navSections = NAV_LINKS.map(function(l){ return { id:l[0], el:document.querySelector(l[0]) }; });
  heroDotsSetup();
  applyHeroNumHot();
  applyFx();
}

function applyFx(){
  var vh = window.innerHeight;
  /* mobile: same transformations, turned down — not a different, cut-down experience,
     just gentler amplitude so nothing feels janky on a small, often-scrolled-fast screen */
  var amp = window.innerWidth < 640 ? 0.55 : 1;
  document.documentElement.style.setProperty("--hero-amp", amp);

  var hp = 0;
  if (fx.hero){
    var heroTop = fx.hero.getBoundingClientRect().top;
    var heroH = fx.hero.offsetHeight || 1;
    hp = fxClamp01(-heroTop / (heroH * 0.9));
    document.documentElement.style.setProperty("--hero-p", hp.toFixed(4));
  }

  var revealStart = vh * 0.88, revealEnd = vh * 0.72;
  fx.reveals.forEach(function(el){
    var r = el.getBoundingClientRect();
    var delay = parseFloat(el.dataset.fxDelay) || 0;
    var p = fxClamp01((revealStart - r.top) / (revealStart - revealEnd) - delay);
    var speed = parseFloat(el.getAttribute("data-speed")) || 0;
    var drift = 0;
    if (speed){
      var center = r.top + r.height / 2;
      drift = ((vh / 2 - center) / vh) * speed * amp;
    }
    var tiltX = parseFloat(el.dataset.tiltX) || 0;
    var tiltY = parseFloat(el.dataset.tiltY) || 0;
    el.style.opacity = p;
    el.style.transform = "perspective(900px) translateY(" + ((1 - p) * 26 * amp + drift).toFixed(1) + "px) scale(" + (0.97 + p * 0.03).toFixed(3) + ")"
      + (tiltX || tiltY ? " rotateX(" + tiltX + "deg) rotateY(" + tiltY + "deg)" : "");
  });

  fx.parallax.forEach(function(el){
    var r = el.getBoundingClientRect();
    var speed = parseFloat(el.getAttribute("data-speed")) || 20;
    var d = ((vh / 2 - (r.top + r.height / 2)) / vh) * speed * amp;
    el.style.transform = "translateY(" + d.toFixed(1) + "px)";
  });

  var activeHref = null;
  fx.navSections.forEach(function(s){
    if (s.el && s.el.getBoundingClientRect().top <= 140) activeHref = s.id;
  });
  fx.navLinks.forEach(function(a){
    a.classList.toggle("active", a.getAttribute("href") === activeHref);
  });

  updateBackToTop();
  updateHeaderScrolled();
}

/* subtle cursor-reactive tilt on formato/rule cards — delegated on document so it
   keeps working after every mount() re-render without rebinding per card. The tilt
   angle is stashed on the element's dataset and folded into the same inline transform
   applyFx() already drives for every .fx-reveal element (that transform is set on
   every scroll frame and would otherwise stomp any transform set here separately).
   pointerleave doesn't bubble, but a capture-phase listener still sees it on the way
   down to the target, which is the standard trick for delegating enter/leave events. */
var tiltTicking = false;
function fxTiltApply(){ applyFx(); tiltTicking = false; }
function fxTiltMove(e){
  var card = e.target.closest && e.target.closest(".formato-card, .rule-card");
  if (!card) return;
  var r = card.getBoundingClientRect();
  var px = (e.clientX - r.left) / r.width - 0.5;
  var py = (e.clientY - r.top) / r.height - 0.5;
  card.dataset.tiltX = (py * -6).toFixed(2);
  card.dataset.tiltY = (px * 6).toFixed(2);
  if (!tiltTicking){ tiltTicking = true; requestAnimationFrame(fxTiltApply); }
}
function fxTiltLeave(e){
  var card = e.target.closest && e.target.closest(".formato-card, .rule-card");
  if (!card) return;
  card.dataset.tiltX = "0";
  card.dataset.tiltY = "0";
  if (!tiltTicking){ tiltTicking = true; requestAnimationFrame(fxTiltApply); }
}
document.addEventListener("pointermove", fxTiltMove);
document.addEventListener("pointerleave", fxTiltLeave, true);

/* custom cursor — the dot tracks the real pointer 1:1 (no rAF throttle: any lag here is
   immediately obvious, unlike the scroll effects), while the "clickable" state is
   delegated so it keeps working after every mount() re-render without rebinding. */
var cursorDotEl = document.getElementById("cursor-dot");
var CURSOR_CLICKABLE = "a, button, input, select, textarea, label";
if (cursorDotEl){
  document.addEventListener("pointermove", function(e){
    if (e.pointerType && e.pointerType !== "mouse") return;
    cursorDotEl.style.transform = "translate(" + e.clientX + "px," + e.clientY + "px)";
  });
  document.addEventListener("pointerover", function(e){
    if (e.target.closest && e.target.closest(CURSOR_CLICKABLE)) cursorDotEl.classList.add("is-active");
  });
  document.addEventListener("pointerout", function(e){
    var leavingClickable = e.target.closest && e.target.closest(CURSOR_CLICKABLE);
    var enteringClickable = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest(CURSOR_CLICKABLE);
    if (leavingClickable && !enteringClickable) cursorDotEl.classList.remove("is-active");
  });
}

/* ============================================================
   Hero cursor-interactive dots — canvas overlay on top of the CSS halftone pattern.
   Dots within HERO_DOT_HOVER_R of the cursor swell up, sampled on the fly and
   phase-locked to the CSS layer's own (still auto-drifting) background-position so the
   bigger dots look like the same dots growing, not new ones appearing on top. A wide
   radius + gentle falloff + soft-followed cursor position + low opacity keep the growth
   reading as a smooth, spread-out swell rather than dots fusing into a solid blob.
   The hero/canvas nodes are recreated on every mount() (they live inside #app), so
   heroDotsSetup() re-grabs them each time; only the rAF loop itself is started once. */
var heroDots = { canvas:null, ctx:null, heroEl:null, w:0, h:0, dpr:1, mouseX:-9999, mouseY:-9999, smoothX:-9999, smoothY:-9999, inHero:false, raf:null };
var HERO_DOT_SPACING = 16;
var HERO_DOT_HOVER_R = 150;

function heroDotsSetup(){
  var hero = document.querySelector(".hero");
  if (!hero) return;
  var canvas = hero.querySelector(".hero-dots-canvas");
  if (!canvas) return;
  var isNewCanvas = canvas !== heroDots.canvas;
  heroDots.heroEl = hero;
  heroDots.canvas = canvas;
  heroDots.ctx = canvas.getContext("2d");
  /* mount() replaces the hero/canvas DOM nodes on every re-render; a brand-new canvas
     always needs its backing buffer (re)sized even if its CSS dimensions happen to
     match the previous one's — a fresh <canvas> starts at the browser's 300x150
     default until we set .width/.height ourselves, regardless of how big it looks. */
  heroDotsResize(isNewCanvas);
  if (!heroDots.raf) heroDots.raf = requestAnimationFrame(heroDotsLoop);
}

function heroDotsResize(force){
  var hero = heroDots.heroEl, canvas = heroDots.canvas;
  if (!hero || !canvas) return;
  var r = hero.getBoundingClientRect();
  var w = Math.round(r.width), h = Math.round(r.height);
  if (!force && w === heroDots.w && h === heroDots.h) return;
  heroDots.w = w;
  heroDots.h = h;
  heroDots.dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = w * heroDots.dpr;
  canvas.height = h * heroDots.dpr;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  heroDots.ctx.setTransform(heroDots.dpr, 0, 0, heroDots.dpr, 0, 0);
}

function heroDotsDraw(){
  var ctx = heroDots.ctx;
  if (!ctx) return;
  ctx.clearRect(0, 0, heroDots.w, heroDots.h);
  if (!heroDots.inHero) return;

  /* soft-follow: the swell trails the actual cursor slightly instead of snapping to it
     every frame, which is what reads as fluid rather than mechanical */
  if (heroDots.smoothX < -900){ heroDots.smoothX = heroDots.mouseX; heroDots.smoothY = heroDots.mouseY; }
  heroDots.smoothX += (heroDots.mouseX - heroDots.smoothX) * 0.1;
  heroDots.smoothY += (heroDots.mouseY - heroDots.smoothY) * 0.1;
  var mx = heroDots.smoothX, my = heroDots.smoothY;

  var bgPos = getComputedStyle(heroDots.heroEl).backgroundPosition.split(",")[0].trim().split(/\s+/);
  var phaseX = ((parseFloat(bgPos[0]) || 0) % HERO_DOT_SPACING + HERO_DOT_SPACING) % HERO_DOT_SPACING;
  var phaseY = ((parseFloat(bgPos[1]) || 0) % HERO_DOT_SPACING + HERO_DOT_SPACING) % HERO_DOT_SPACING;
  var startX = Math.floor((mx - HERO_DOT_HOVER_R - phaseX) / HERO_DOT_SPACING) * HERO_DOT_SPACING + phaseX;
  var startY = Math.floor((my - HERO_DOT_HOVER_R - phaseY) / HERO_DOT_SPACING) * HERO_DOT_SPACING + phaseY;
  ctx.fillStyle = "rgba(232,225,204,.5)";
  for (var y = startY; y <= my + HERO_DOT_HOVER_R; y += HERO_DOT_SPACING){
    for (var x = startX; x <= mx + HERO_DOT_HOVER_R; x += HERO_DOT_SPACING){
      var d = Math.hypot(x - mx, y - my);
      if (d > HERO_DOT_HOVER_R) continue;
      /* plain smoothstep — no extra bias — so the size increase is spread gently across
         the whole radius instead of concentrated (and visually fused) near the centre */
      var t = 1 - d / HERO_DOT_HOVER_R;
      t = t * t * (3 - 2 * t);
      var r = 1.5 + t * 1.8;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function heroDotsLoop(){
  heroDotsResize();
  heroDotsDraw();
  heroDots.raf = document.hidden ? null : requestAnimationFrame(heroDotsLoop);
}
document.addEventListener("visibilitychange", function(){
  if (!document.hidden && heroDots.canvas && !heroDots.raf) heroDots.raf = requestAnimationFrame(heroDotsLoop);
});
document.addEventListener("pointermove", function(e){
  if (e.pointerType && e.pointerType !== "mouse") return;
  if (!heroDots.heroEl) return;
  var r = heroDots.heroEl.getBoundingClientRect();
  heroDots.inHero = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  heroDots.mouseX = e.clientX - r.left;
  heroDots.mouseY = e.clientY - r.top;
});
window.addEventListener("resize", heroDotsResize);

/* the ghost "8" itself: no dots, just the same big translucent numeral as before,
   scaling up smoothly (CSS transition, not a per-frame loop) while the cursor sits over
   it. mount() replaces the element on every re-render (e.g. a Firestore snapshot while
   the visitor is mid-hover), which would silently drop the "is-hot" class along with the
   old node — lastPointerX/Y + applyHeroNumHot() re-derive and reapply it right after
   every mount, in collectFx(), so a background data refresh never resets the hover. */
var lastPointerX = -9999, lastPointerY = -9999;
function applyHeroNumHot(){
  var el = document.querySelector(".hero-num");
  if (!el) return;
  var r = el.getBoundingClientRect();
  var margin = 24;
  var hot = lastPointerX >= r.left - margin && lastPointerX <= r.right + margin && lastPointerY >= r.top - margin && lastPointerY <= r.bottom + margin;
  el.classList.toggle("is-hot", hot);
}
document.addEventListener("pointermove", function(e){
  if (e.pointerType && e.pointerType !== "mouse") return;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;
  applyHeroNumHot();
});

function onScrollFx(){
  if (fxTicking) return;
  fxTicking = true;
  requestAnimationFrame(function(){ applyFx(); fxTicking = false; });
}
window.addEventListener("scroll", onScrollFx, { passive:true });
window.addEventListener("resize", onScrollFx);

function isValidContact(v){
  var emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  var phoneRe = /^(\+?\d{1,3}[\s-]?)?\d{9}$/;
  var digitsOnly = v.replace(/[\s-]/g, "");
  return emailRe.test(v.trim()) || phoneRe.test(digitsOnly);
}
function wireInscripcionForm(){
  var form = document.getElementById("inscripcion-form");
  if (!form) return;
  form.addEventListener("submit", function(e){
    e.preventDefault();
    var j1 = valOf("insc-j1"), j2 = valOf("insc-j2"), contacto = valOf("insc-contacto");
    var errEl = document.getElementById("insc-error");
    var msg = "";
    if (!j1 || j1.length < 2) msg = "Escribe el nombre del Jugador 1.";
    else if (!j2 || j2.length < 2) msg = "Escribe el nombre del Jugador 2.";
    else if (!contacto) msg = "Escribe un teléfono o email de contacto.";
    else if (!isValidContact(contacto)) msg = "Ese contacto no parece un teléfono o email válido. Revísalo.";
    if (msg){
      errEl.style.display = "block";
      errEl.textContent = msg;
      return;
    }
    errEl.style.display = "none";
    var btn = document.getElementById("insc-submit-btn");
    btn.disabled = true; btn.textContent = "Enviando…";
    addDoc(collection(db, "inscripciones"), {
      j1: j1, j2: j2, contacto: contacto, status: "pending", submittedAt: serverTimestamp()
    }).then(function(){
      ui.inscripcionSent = true;
      mount();
    }).catch(function(err){
      btn.disabled = false; btn.textContent = "Enviar solicitud de inscripción";
      errEl.style.display = "block";
      errEl.textContent = "No se pudo enviar. Comprueba tu conexión e inténtalo de nuevo, o escríbenos a " + CONTACT_EMAIL + ".";
    });
  });
}

function addPair(){
  var j1 = valOf("new-pair-j1"), j2 = valOf("new-pair-j2"), contacto = valOf("new-pair-contacto");
  if (!j1 || !j2){ alert("Escribe los nombres de los dos jugadores."); return; }
  STATE.pairs.push({ id: uid("p"), j1:j1, j2:j2, contacto:contacto, confirmed:true });
  saveStateDoc("pairs", { list: STATE.pairs });
}
function deletePair(id){
  if (!confirm("¿Eliminar esta pareja?")) return;
  STATE.pairs = STATE.pairs.filter(function(p){ return p.id!==id; });
  saveStateDoc("pairs", { list: STATE.pairs });
}
function toggleConfirmed(id){
  var p = pairById(id); if (p) p.confirmed = !p.confirmed;
  saveStateDoc("pairs", { list: STATE.pairs });
}
function generateFixture(){
  var confirmedPairs = STATE.pairs.filter(function(p){ return p.confirmed; });
  if (confirmedPairs.length < 2){ alert("Necesitas al menos 2 parejas confirmadas."); return; }
  if (STATE.matches.length && !confirm("Ya existe un calendario. Si lo regeneras se perderán los resultados introducidos. ¿Continuar?")) return;
  var rounds = generateRoundRobin(confirmedPairs);
  var matches = [];
  rounds.forEach(function(roundPairs, idx){
    roundPairs.forEach(function(pair){
      matches.push({ id: uid("m"), jornada: idx+1, pairA: pair[0], pairB: pair[1], setsA:null, setsB:null, marcador:"", played:false });
    });
  });
  STATE.matches = matches;
  saveStateDoc("matches", { list: STATE.matches });
}
function saveMatch(id){
  var m = STATE.matches.filter(function(x){ return x.id===id; })[0];
  if (!m) return;
  var rawA = valOf("match-setsA-"+id), rawB = valOf("match-setsB-"+id), marcador = valOf("match-marcador-"+id);
  if (rawA==="" && rawB===""){ m.setsA=null; m.setsB=null; m.played=false; m.marcador=marcador; }
  else {
    var sa = parseInt(rawA,10), sb = parseInt(rawB,10);
    if (isNaN(sa) || isNaN(sb)){ alert("Introduce los sets ganados por cada pareja (números)."); return; }
    m.setsA=sa; m.setsB=sb; m.played=true; m.marcador=marcador;
  }
  saveStateDoc("matches", { list: STATE.matches });
}
function saveInfo(){
  STATE.info.fechas = valOf("info-fechas"); STATE.info.precio = valOf("info-precio");
  STATE.info.plazo = valOf("info-plazo"); STATE.info.contacto = valOf("info-contacto") || CONTACT_EMAIL;
  saveStateDoc("info", STATE.info);
}
function addRound(){
  var name = valOf("new-round-name");
  if (!name){ alert("Ponle un nombre a la ronda (ej. Cuartos de final)."); return; }
  STATE.bracket.push({ id: uid("r"), name:name, matches:[] });
  saveStateDoc("bracket", { rounds: STATE.bracket });
}
function deleteRound(id){
  if (!confirm("¿Eliminar esta ronda y sus partidos?")) return;
  STATE.bracket = STATE.bracket.filter(function(r){ return r.id!==id; });
  saveStateDoc("bracket", { rounds: STATE.bracket });
}
function bracketSideLabel(roundId, side){
  var tbd = document.getElementById("new-bm-"+side+"-tbd-"+roundId);
  if (tbd && tbd.checked) return "Por definir";
  var j1 = valOf("new-bm-"+side+"1-"+roundId), j2 = valOf("new-bm-"+side+"2-"+roundId);
  if (!j1 || !j2) return null;
  return j1 + " / " + j2;
}
function addBracketMatch(roundId){
  var round = STATE.bracket.filter(function(r){ return r.id===roundId; })[0];
  if (!round) return;
  var a = bracketSideLabel(roundId, "a"), b = bracketSideLabel(roundId, "b");
  if (!a || !b){ alert("Escribe los dos jugadores de cada pareja, o marca \"Por definir\" en la que todavía no se sepa."); return; }
  round.matches.push({ id: uid("bm"), a:a, b:b, resultado:"", ganador:"" });
  saveStateDoc("bracket", { rounds: STATE.bracket });
}
function deleteBracketMatch(roundId, matchId){
  var round = STATE.bracket.filter(function(r){ return r.id===roundId; })[0];
  if (!round) return;
  round.matches = round.matches.filter(function(m){ return m.id!==matchId; });
  saveStateDoc("bracket", { rounds: STATE.bracket });
}
function saveBracketMatch(roundId, matchId){
  var round = STATE.bracket.filter(function(r){ return r.id===roundId; })[0];
  if (!round) return;
  var m = round.matches.filter(function(x){ return x.id===matchId; })[0];
  if (!m) return;
  var sets = [];
  for (var n = 1; n <= 3; n++){
    var a = valOf("bm-"+matchId+"-s"+n+"a"), b = valOf("bm-"+matchId+"-s"+n+"b");
    if (a === "" && b === "") break;
    var ga = parseInt(a, 10), gb = parseInt(b, 10);
    if (a === "" || b === "" || isNaN(ga) || isNaN(gb)){ alert("Revisa el set "+n+": falta el marcador de una de las parejas."); return; }
    sets.push({ a: ga, b: gb });
  }
  m.sets = sets;
  m.resultado = sets.map(function(s){ return s.a + "-" + s.b; }).join(" / ");
  var sel = document.getElementById("bm-ganador-"+matchId);
  m.ganador = sel ? sel.value : "";
  saveStateDoc("bracket", { rounds: STATE.bracket });
}
function addFaq(){

    case "save-info": saveInfo(); break;

});

/* ---------- realtime subscriptions ---------- */
onSnapshot(doc(db,"state","info"), function(snap){
  if (snap.exists()) STATE.info = Object.assign({}, STATE.info, snap.data());
  STATE.loaded.info = true; mount();
}, function(){ STATE.loaded.info = true; mount(); });

onSnapshot(doc(db,"state","pairs"), function(snap){
  STATE.pairs = (snap.exists() && snap.data().list) || [];
  STATE.loaded.pairs = true; mount();
}, function(){ STATE.loaded.pairs = true; mount(); });

onSnapshot(doc(db,"state","matches"), function(snap){
  STATE.matches = (snap.exists() && snap.data().list) || [];
  STATE.loaded.matches = true; mount();
}, function(){ STATE.loaded.matches = true; mount(); });

onSnapshot(doc(db,"state","bracket"), function(snap){
  STATE.bracket = (snap.exists() && snap.data().rounds) || [];
  STATE.loaded.bracket = true; mount();
}, function(){ STATE.loaded.bracket = true; mount(); });

onSnapshot(doc(db,"state","faqs"), function(snap){
  if (snap.exists() && snap.data().list && snap.data().list.length) STATE.faqs = snap.data().list;
  STATE.loaded.faqs = true; mount();
}, function(){ STATE.loaded.faqs = true; mount(); });

onAuthStateChanged(auth, function(user){
  ui.unlocked = !!(user && user.email === ADMIN_EMAIL);
  if (ui.unlocked && !inscripcionesUnsub){
    inscripcionesUnsub = onSnapshot(collection(db, "inscripciones"), function(qs){
      STATE.inscripciones = qs.docs.map(function(d){
        var data = d.data();
        return { id: d.id, j1: data.j1, j2: data.j2, contacto: data.contacto, status: data.status || "pending",
          submittedAtMs: data.submittedAt && data.submittedAt.toMillis ? data.submittedAt.toMillis() : 0 };
      });
      STATE.loaded.inscripciones = true; mount();
    });
  } else if (!ui.unlocked && inscripcionesUnsub){
    inscripcionesUnsub(); inscripcionesUnsub = null;
    STATE.inscripciones = []; STATE.loaded.inscripciones = false;
  }
  mount();
});

/* ---------- back to top ---------- */
var backToTopBtn = document.getElementById("back-to-top");
function updateBackToTop(){
  if (!backToTopBtn) return;
  backToTopBtn.classList.toggle("visible", window.scrollY > 600 && !ui.modalOpen);
}
/* header starts transparent over the hero and becomes a floating pill once scrolled,
   matching caldera.xyz's own nav behavior */
function updateHeaderScrolled(){
  var header = document.querySelector(".site-header");
  if (header) header.classList.toggle("is-scrolled", window.scrollY > 40);
}
if (backToTopBtn){
  backToTopBtn.addEventListener("click", function(){
    window.scrollTo({ top:0, behavior:"smooth" });
  });
}

mount();
</script>
</body>
</html>
