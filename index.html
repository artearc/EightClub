     before the content so the header/score sit legibly on top of it. */
  ctx.save();
  ctx.font = "400 1100px 'Getla','Anton',sans-serif";
  ctx.fillStyle = "rgba(255,255,255,.14)";
  ctx.textBaseline = "middle";
  ctx.textAlign = "center";
  ctx.fillText("8", W - 130, H / 2 + 40);
  ctx.restore();

  /* isotipo + wordmark share one vertical center instead of two different baselines. */
  var headerY = 118;
  var isoH = 58, isoScale = isoH / 819;
  var isoW = 1024 * isoScale;
  var isoLeft = 80;
  ctx.save();
  ctx.translate(isoLeft + isoW / 2, headerY);
  ctx.scale(isoScale, isoScale);
  ctx.translate(-512, -409.5);
  ctx.fillStyle = "rgba(255,255,255,.92)";
  ctx.fill(new Path2D(ISOTIPO_D));
  ctx.restore();

  ctx.fillStyle = "rgba(255,255,255,.92)";
  ctx.font = "700 34px 'DM Sans', sans-serif";
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  ctx.fillText("EIGHT. CLUB", isoLeft + isoW + 24, headerY);
  ctx.textBaseline = "alphabetic";

  if (eyebrow){
    ctx.fillStyle = "rgba(255,255,255,.65)";
    ctx.font = "600 28px 'DM Sans', sans-serif";
    ctx.fillText(eyebrow.toUpperCase(), 80, 280);
  }
}

/* a pair's PIN lives ONLY in pairPins/{pairId} (organizer-only read/write) — the public
   state/pairs list doesn't carry it (older pairs did; runAdminMigrations moves it out
   once the copy is verified). p.pin is just the fallback for a pair not migrated yet. */
function pairPin(p){ return (p && (STATE.pairPins[p.id] || p.pin)) || ""; }
/* the ONE place a PIN is ever written: the pairs list and pairPins/{pairId} go out in a
   single atomic batch — both or neither. `pins` is [{id, pin}]; any of those pairs that
   still had a legacy pin in the list loses it in the same batch (its new PIN is in
   pairPins by then). Built from a new list rather than mutating STATE.pairs first, so a
   failed write leaves nothing half-applied locally. `extra(batch)` lets a caller add its
   own writes to the same batch. */
function commitPairsWithPins(list, pins, extra){
  var pinById = {};
  pins.forEach(function(x){ pinById[x.id] = x.pin; });
  var clean = list.map(function(p){
    if (!(p.id in pinById) || !("pin" in p)) return p;
    var c = Object.assign({}, p); delete c.pin; return c;
  });
  var batch = writeBatch(db);
  batch.set(doc(db, "state", "pairs"), { list: clean });
  pins.forEach(function(x){ batch.set(doc(db, "pairPins", x.id), { pin: x.pin }); });
  if (extra) extra(batch);
  return batch.commit().then(function(){
    STATE.pairs = clean;
    pins.forEach(function(x){ STATE.pairPins[x.id] = x.pin; });
  });
}

/* the standard "reflected bracket" seeding order — for n=8 this gives [1,8,4,5,2,7,3,6],
   read two at a time as match pairs (1v8, 4v5, 2v7, 3v6), which is what keeps seed 1 and
   seed 2 apart until the final assuming both keep winning. Doubling from n=1 each time
   mirrors every seed already placed against "one more than the round's top seed minus
   itself", which is the textbook way to build this without hardcoding a table per size. */
function bracketSeedOrder(n){
  var arr = [1];
  while (arr.length < n){
    var m = arr.length * 2 + 1;
    var next = [];
    arr.forEach(function(s){ next.push(s); next.push(m - s); });
    arr = next;
  }
  return arr;
}
function generateBracketFromStandings(){
  var rows = computeStandings();

  if (STATE.bracket.length && !confirm("Esto añade una ronda nueva con las "+n+" primeras parejas de la clasificación de liga. ¿Continuar?")) return;
  var torneo = valOf("new-bracket-torneo") || distinctTorneos()[0] || "Summer Series";
  var roundNames = { 2:"Final", 4:"Semifinal", 8:"Cuartos de final", 16:"Octavos de final", 32:"Dieciseisavos de final" };
  var order = bracketSeedOrder(n);
  var matches = [];
  for (var i = 0; i < n; i += 2){
    var pairA = rows[order[i] - 1], pairB = rows[order[i+1] - 1];
    var bm = { id: uid("bm"), a: pairA.label, b: pairB.label, resultado:"", ganador:"" };
    var prA = pairById(pairA.id), prB = pairById(pairB.id);
    if (prA && prA.j1Id && prA.j2Id) bm.aIds = [prA.j1Id, prA.j2Id];
    if (prB && prB.j1Id && prB.j2Id) bm.bIds = [prB.j1Id, prB.j2Id];
    matches.push(bm);
  }
  STATE.bracket.push({ id: uid("r"), name: roundNames[n] || (n+" parejas"), matches: matches, torneo: torneo });
  saveStateDoc("bracket", { rounds: STATE.bracket });
}

  var j1 = valOf("new-bm-"+side+"1-"+roundId), j2 = valOf("new-bm-"+side+"2-"+roundId);
  if (!j1 || !j2) return null;
  return j1 + " / " + j2;
}
/* splits a stored "Nombre1 / Nombre2" (or "Por definir") label back into its two
   player fields, so an existing match can be edited the same jugador-by-jugador way
   it was created, instead of as one free-text string */
function splitPairLabel(label){
  if (label === "Por definir") return { j1:"", j2:"", tbd:true };
  var parts = String(label || "").split(" / ");
  return { j1: parts[0] || "", j2: parts[1] || "", tbd:false };
}
function bracketEditSideFields(m, side, label){
  var parts = splitPairLabel(side === "a" ? m.a : m.b);
  var idBase = "bm-edit-"+side+"-"+m.id;
  return '<div class="field"><span>'+escHtml(label)+' · Jugador 1</span><input id="'+idBase+'-j1" type="text" value="'+escHtml(parts.j1)+'"></div>'
    + '<div class="field"><span>'+escHtml(label)+' · Jugador 2</span><input id="'+idBase+'-j2" type="text" value="'+escHtml(parts.j2)+'"></div>'
    + '<label class="bm-tbd-check"><input type="checkbox" id="'+idBase+'-tbd"'+(parts.tbd ? " checked" : "")+'>Por definir</label>';
}
function bracketEditSideLabel(matchId, side){
  var idBase = "bm-edit-"+side+"-"+matchId;
  var tbd = document.getElementById(idBase+"-tbd");
  if (tbd && tbd.checked) return "Por definir";
  var j1 = valOf(idBase+"-j1"), j2 = valOf(idBase+"-j2");
  if (!j1 || !j2) return null;
  return j1 + " / " + j2;
}
function addBracketMatch(roundId){
  var round = STATE.bracket.filter(function(r){ return r.id===roundId; })[0];
  if (!round) return;
  var a = bracketSideLabel(roundId, "a"), b = bracketSideLabel(roundId, "b");
  if (!a || !b){ alert("Escribe los dos jugadores de cada pareja, o marca \"Por definir\" en la que todavía no se sepa."); return; }
  var bm = { id: uid("bm"), a:a, b:b, resultado:"", ganador:"" };
  var aIds = resolveLabelIds(a), bIds = resolveLabelIds(b);
  if (aIds) bm.aIds = aIds;
  if (bIds) bm.bIds = bIds;
  round.matches.push(bm);
  saveStateDoc("bracket", { rounds: STATE.bracket });
}
function deleteBracketMatch(roundId, matchId){
  var round = STATE.bracket.filter(function(r){ return r.id===roundId; })[0];
  if (!round) return;
  round.matches = round.matches.filter(function(m){ return m.id!==matchId; });
  saveStateDoc("bracket", { rounds: STATE.bracket });
}
function saveBracketMatch(roundId, matchId){
  var round = STATE.bracket.filter(function(r){ return r.id===roundId; })[0];
  if (!round) return;
  var m = round.matches.filter(function(x){ return x.id===matchId; })[0];
  if (!m) return;
  var newA = bracketEditSideLabel(matchId, "a"), newB = bracketEditSideLabel(matchId, "b");
  if (!newA || !newB){ alert("Escribe los dos jugadores de cada pareja, o marca \"Por definir\" en la que todavía no se sepa."); return; }
  var sets = [];
  for (var n = 1; n <= 3; n++){
    var a = valOf("bm-"+matchId+"-s"+n+"a"), b = valOf("bm-"+matchId+"-s"+n+"b");
    if (a === "" && b === "") break;
    var ga = parseInt(a, 10), gb = parseInt(b, 10);
    if (a === "" || b === "" || isNaN(ga) || isNaN(gb)){ alert("Revisa el set "+n+": falta el marcador de una de las parejas."); return; }
    sets.push({ a: ga, b: gb });
  }
  var beforeRows = (STATE.loaded.pairs && STATE.loaded.matches) ? computePlayerRanking() : null;
  /* the winner <select>'s value is still the OLD label text (options are rendered from
     the match as it was before this edit) — re-map it onto the new label so renaming a
     pair doesn't silently clear or misattribute an already-recorded win */
  var sel = document.getElementById("bm-ganador-"+matchId);
  var selVal = sel ? sel.value : "";
  var ganador = selVal === "" ? "" : selVal === m.a ? newA : selVal === m.b ? newB : "";
  /* ids follow the text: an unchanged side keeps its ids (and gains them if it can now be
     resolved); a side retyped to someone else gets that pair's ids, or none if it can't
     be tied to exactly one pair */
  [["a", newA], ["b", newB]].forEach(function(x){
    var side = x[0], text = x[1], f = side + "Ids";
    if (text === m[side] && Array.isArray(m[f])) return;
    var ids = resolveLabelIds(text);
    if (ids) m[f] = ids; else delete m[f];
  });
  m.a = newA;
  m.b = newB;
  m.sets = sets;
  m.resultado = sets.map(function(s){ return s.a + "-" + s.b; }).join(" / ");
  m.ganador = ganador;
  announceBracketRankingChange(beforeRows, m);
  saveStateDoc("bracket", { rounds: STATE.bracket });
}

/* ---------- one-time, idempotent data migrations (organizer session only) ----------
   Three steps, strictly one after the other (each run does the first one that still has
   work; the snapshot its write triggers schedules the next):
   1) ids: j1Id/j2Id on pairs that lack them, aIds/bIds on cuadros sides that can be tied
      to exactly one pair (planIdMigration). state/pairs and state/bracket only GAIN
      fields; every existing value is written back exactly as read.
   2) PIN copy: pairPins/{pairId} for every pair whose PIN is still in state/pairs and
      isn't in pairPins yet (or differs — then state/pairs is the one the pair was given).
      Nobody's PIN changes.
   3) PIN removal: for pairs whose pairPins copy is confirmed equal BY A READ FROM THE
      SERVER (not the local cache), the `pin` field is removed from the public state/pairs
      list. That's the only value this ever removes, and only once it's safe elsewhere.
   Never runs on data that failed to load (an empty list there means "unknown", not
   "no pairs"). With nothing left to do it writes nothing. */
var migrationTimer = null, migrationBusy = false;
function scheduleAdminMigrations(){
  if (migrationTimer) return;
  migrationTimer = setTimeout(function(){ migrationTimer = null; runAdminMigrations(); }, 0);
}
function finishMigration(promise){
  migrationBusy = true;
  promise.then(function(msg){
    migrationBusy = false;
    if (msg) setSaveResult(true, "Datos actualizados: " + msg + " ✓");
    scheduleAdminMigrations();
  }, function(err){
    migrationBusy = false;
    setSaveResult(false, "Actualización de datos pendiente (" + (err && err.code || "error") + ") — se reintentará al volver a entrar. No se ha cambiado ningún dato.");
  });
}
function runAdminMigrations(){
  if (!ui.unlocked || migrationBusy) return;
  if (!STATE.loaded.pairs || !STATE.loaded.bracket || STATE.loadFailed.pairs || STATE.loadFailed.bracket) return;
  /* 1) ids */
  var plan = planIdMigration();
  if (plan.pairsChanged || plan.sidesResolved){
    var batch = writeBatch(db);
    if (plan.pairsChanged) batch.set(doc(db, "state", "pairs"), { list: plan.pairs });
    if (plan.sidesResolved) batch.set(doc(db, "state", "bracket"), { rounds: plan.rounds });
    finishMigration(batch.commit().then(function(){
      if (plan.pairsChanged) STATE.pairs = plan.pairs;
      if (plan.sidesResolved) STATE.bracket = plan.rounds;
      return "ids de jugador añadidos a " + plan.pairsChanged + " pareja" + (plan.pairsChanged===1?"":"s")
        + (plan.sidesResolved ? " y a " + plan.sidesResolved + " lado" + (plan.sidesResolved===1?"":"s") + " de cuadros" : "");
    }));
    return;
  }
  if (!STATE.loaded.pairPins) return;
  /* 2) PIN copy */
  var toCopy = STATE.pairs.filter(function(p){ return p.pin && STATE.pairPins[p.id] !== p.pin; });
  if (toCopy.length){
    var pinBatch = writeBatch(db);
    toCopy.forEach(function(p){ pinBatch.set(doc(db, "pairPins", p.id), { pin: p.pin }); });
    finishMigration(pinBatch.commit().then(function(){
      toCopy.forEach(function(p){ STATE.pairPins[p.id] = p.pin; });
      return "PIN copiado a pairPins para " + toCopy.length + " pareja" + (toCopy.length===1?"":"s");
    }));
    return;
  }
  /* 3) PIN removal, only after a server read confirms each copy */
  var toRemove = STATE.pairs.filter(function(p){ return p.pin && STATE.pairPins[p.id] === p.pin; });
  if (!toRemove.length) return;
  finishMigration(Promise.all(toRemove.map(function(p){
    return getDocFromServer(doc(db, "pairPins", p.id)).then(function(snap){
      return { id: p.id, pin: snap.exists() ? snap.data().pin : null };
    });
  })).then(function(checked){
    var verified = {};
    checked.forEach(function(c){ if (c.pin) verified[c.id] = c.pin; });
    var removed = 0;
    var list = STATE.pairs.map(function(p){
      if (!p.pin || verified[p.id] !== p.pin) return p;
      var c = Object.assign({}, p); delete c.pin; removed++; return c;
    });
    if (!removed) return "";
    return setDoc(doc(db, "state", "pairs"), { list: list }).then(function(){
      STATE.pairs = list;
      return "PIN retirado de la lista pública de parejas para " + removed + " pareja" + (removed===1?"":"s") + " (ya solo está en pairPins)";
    });
  }));
}

/* ---------- back to top ---------- */
var backToTopBtn = document.getElementById("back-to-top");
function updateBackToTop(){
  if (!backToTopBtn) return;
  backToTopBtn.classList.toggle("visible", window.scrollY > 600 && !ui.modalOpen);
}
/* header starts transparent over the hero and becomes a floating pill once scrolled,
   matching caldera.xyz's own nav behavior */
function updateHeaderScrolled(){
  var header = document.querySelector(".site-header");
  if (header) header.classList.toggle("is-scrolled", window.scrollY > 40);
}
if (backToTopBtn){
  backToTopBtn.addEventListener("click", function(){
    window.scrollTo({ top:0, behavior:"smooth" });
  });
}

/* lets a shared profile link (#jugador/<slug>) open straight into that profile, and the
   back/forward buttons close it the way the browser's history would suggest they should. */
function syncProfileFromHash(){
  var m = location.hash.match(/^#jugador\/(.+)$/);
  ui.profileSlug = m ? decodeURIComponent(m[1]) : null;
}
syncProfileFromHash();
window.addEventListener("popstate", function(){ syncProfileFromHash(); mount(); });
/* #pantalla (see renderKioskView) is a plain anchor-style hash, not one pushState puts
   there, so it needs its own listener — popstate alone wouldn't fire for a visitor
   typing it into the address bar or opening a link straight to it. */
window.addEventListener("hashchange", mount);

mount();
</script>
