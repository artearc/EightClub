<style>
:root{
  --bg:#f5f7f6;
  --bg-elevated:#ffffff;
  --bg-alt:#eef3f2;
  --ink:#0c1c26;
  --ink-soft:#4c6570;
  --ink-faint:#84979f;
  --teal:#016893;
  --teal-tint:#e2eef2;
  --gold:#ffc114;
  --gold-ink:#3d2e00;
  --border:rgba(12,28,38,0.12);
  --shadow:0 10px 30px rgba(0,23,36,0.09);
  --radius:16px;
  --radius-sm:9px;
  --header-bg:#001724;
  --header-ink:#eef4f6;
  --header-ink-soft:#9bb3bc;
  --font-display:'Big Shoulders Display','Arial Narrow',sans-serif;
  --font-body:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#001724;
    --bg-elevated:#0b2534;
    --bg-alt:#072130;
    --ink:#eef4f6;
    --ink-soft:#a9c0c9;
    --ink-faint:#6f8894;
    --teal:#4fc1e9;
    --teal-tint:rgba(79,193,233,0.14);
    --border:rgba(238,244,246,0.14);
    --shadow:0 10px 30px rgba(0,0,0,0.45);
  }
}
:root[data-theme="dark"]{
  --bg:#001724;
  --bg-elevated:#0b2534;
  --bg-alt:#072130;
  --ink:#eef4f6;
  --ink-soft:#a9c0c9;
  --ink-faint:#6f8894;
  --teal:#4fc1e9;
  --teal-tint:rgba(79,193,233,0.14);
  --border:rgba(238,244,246,0.14);
  --shadow:0 10px 30px rgba(0,0,0,0.45);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.6;-webkit-font-smoothing:antialiased;}
img{display:block;max-width:100%;}
a{color:inherit;text-decoration:none;}
button{font:inherit;color:inherit;}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.02;}
p{margin:0;}
ul{margin:0;padding:0;list-style:none;}
input,textarea,select{font:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

.eyebrow{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.14em;font-size:.74rem;color:var(--teal);margin:0 0 .6rem;font-weight:600;}
.section-title{font-size:clamp(1.7rem,4vw,2.5rem);font-weight:800;margin-bottom:.7rem;}
.section-lead{max-width:60ch;color:var(--ink-soft);font-size:1.02rem;}
.section{padding:5rem 0;}
.section--alt{background:var(--bg-alt);}
.section-inner{max-width:1080px;margin:0 auto;padding:0 1.5rem;}

/* header */
.site-header{position:sticky;top:0;z-index:40;background:rgba(0,23,36,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.08);}
.header-inner{max-width:1080px;margin:0 auto;padding:.7rem 1.5rem;display:flex;align-items:center;gap:1.5rem;}
.header-logo{display:flex;align-items:center;gap:.6rem;flex-shrink:0;}
.header-logo img{height:34px;width:auto;}
.header-nav{display:flex;gap:1.4rem;flex:1;overflow-x:auto;scrollbar-width:none;}
.header-nav::-webkit-scrollbar{display:none;}
.header-nav a{color:var(--header-ink-soft);font-size:.88rem;font-weight:500;white-space:nowrap;padding:.3rem 0;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;}
.header-nav a:hover{color:var(--header-ink);border-color:var(--gold);}
.header-lock{margin-left:auto;flex-shrink:0;display:flex;align-items:center;gap:.4rem;color:var(--header-ink-soft);font-size:.82rem;background:transparent;border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:.4rem .8rem;cursor:pointer;transition:border-color .15s,color .15s;}
.header-lock:hover{border-color:var(--gold);color:var(--header-ink);}
.mobile-menu-btn{display:none;flex-shrink:0;align-items:center;justify-content:center;width:2.3rem;height:2.3rem;background:transparent;border:1px solid rgba(255,255,255,.22);border-radius:8px;color:var(--header-ink);font-size:1.1rem;cursor:pointer;}
.mobile-nav-panel{display:none;}
.mobile-nav-panel.open{display:block;border-top:1px solid rgba(255,255,255,.1);background:var(--header-bg);}
.mobile-nav-panel a{display:block;padding:1rem 1.5rem;color:var(--header-ink);font-size:1.05rem;font-weight:600;border-bottom:1px solid rgba(255,255,255,.08);}
.mobile-nav-panel a:last-child{border-bottom:none;}
.mobile-nav-panel a:active{color:var(--gold);}

/* hero */
.hero{position:relative;background:var(--header-bg);color:var(--header-ink);overflow:hidden;padding:4.5rem 0 4rem;}
.hero-inner{max-width:1080px;margin:0 auto;padding:0 1.5rem;position:relative;z-index:2;}
.hero-num{position:absolute;right:-1.5rem;top:-3.5rem;font-family:var(--font-display);font-weight:900;font-size:min(48vw,26rem);line-height:1;color:var(--gold);opacity:.09;z-index:1;pointer-events:none;user-select:none;}
.hero-eyebrow{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.14em;font-size:.78rem;color:var(--gold);font-weight:600;margin-bottom:1rem;}
.hero-title{font-size:clamp(3.2rem,11vw,6.4rem);font-weight:900;letter-spacing:.005em;}
.hero-subtitle{font-family:var(--font-mono);font-size:clamp(1.05rem,2.4vw,1.3rem);color:var(--header-ink);margin-top:.6rem;font-weight:600;}
.hero-text{max-width:56ch;color:var(--header-ink-soft);font-size:1.06rem;margin-top:1.4rem;}
.hero-actions{display:flex;gap:.9rem;flex-wrap:wrap;margin-top:2.1rem;}
.hero-next{margin-top:2.6rem;font-size:.85rem;color:var(--header-ink-soft);border-top:1px solid rgba(255,255,255,.14);padding-top:1.1rem;max-width:56ch;}
.hero-next strong{color:var(--header-ink);}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.8rem 1.4rem;border-radius:99px;font-weight:700;font-size:.95rem;border:1px solid transparent;cursor:pointer;transition:transform .12s,box-shadow .12s,background .15s,border-color .15s;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--gold);color:var(--gold-ink);}
.btn-primary:hover{box-shadow:0 6px 18px rgba(255,193,20,.35);}
.btn-ghost{background:transparent;color:var(--header-ink);border-color:rgba(255,255,255,.3);}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold);}
.btn-outline{background:transparent;color:var(--teal);border-color:var(--teal);}
.btn-outline:hover{background:var(--teal-tint);}
.btn-danger{background:transparent;color:#c0392b;border:1px solid rgba(192,57,43,.4);}
.btn-danger:hover{background:rgba(192,57,43,.08);}
.btn-sm{padding:.45rem .85rem;font-size:.82rem;}
.btn[disabled]{opacity:.55;cursor:default;}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-top:-2.6rem;position:relative;z-index:3;box-shadow:var(--shadow);}
.stat-tile{background:var(--bg-elevated);padding:1.4rem 1.5rem;}
.stat-tile .label{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.1em;font-size:.7rem;color:var(--ink-faint);margin-bottom:.4rem;}
.stat-tile .value{font-family:var(--font-display);font-size:1.5rem;font-weight:800;color:var(--ink);}

/* formato */
.formato-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1.2rem;margin-top:2rem;}
.formato-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:1.6rem;}
.formato-card .step-num{font-family:var(--font-mono);color:var(--teal);font-weight:700;font-size:.82rem;margin-bottom:.5rem;}
.formato-card h3{font-size:1.3rem;font-weight:800;margin-bottom:.5rem;}
.formato-card p{color:var(--ink-soft);font-size:.95rem;}

/* cards / forms */
.card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:1.8rem;box-shadow:var(--shadow);}
.form-grid{display:grid;gap:1rem;margin-top:1.6rem;max-width:440px;}
.field{display:flex;flex-direction:column;gap:.4rem;font-size:.88rem;color:var(--ink-soft);font-weight:600;}
.field input,.field textarea,.field select{border:1px solid var(--border);border-radius:var(--radius-sm);padding:.7rem .85rem;background:var(--bg);color:var(--ink);font-size:.95rem;}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--teal);}
.form-hint{color:var(--ink-faint);font-size:.82rem;margin-top:1rem;}
.insc-preview{font-family:var(--font-mono);font-size:.8rem;resize:vertical;background:var(--bg-alt);min-height:6.5em;}
.insc-actions{display:flex;gap:.7rem;flex-wrap:wrap;}

/* table */
.table-wrap{overflow-x:auto;margin-top:1.8rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-elevated);}
table.standings{border-collapse:collapse;width:100%;min-width:520px;font-family:var(--font-mono);}
table.standings th,table.standings td{padding:.7rem .9rem;text-align:left;border-bottom:1px solid var(--border);font-size:.88rem;}
table.standings th{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);font-weight:600;font-family:var(--font-mono);}
table.standings td.num{text-align:right;font-variant-numeric:tabular-nums;}
table.standings td.pts{font-weight:700;color:var(--teal);}
table.standings tbody tr:last-child td{border-bottom:none;}

/* jornadas / matches */
.jornadas{margin-top:2.2rem;display:flex;flex-direction:column;gap:1.6rem;}
.jornada h3{font-family:var(--font-mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-faint);font-weight:600;margin-bottom:.7rem;}
.match-list{display:flex;flex-direction:column;gap:.5rem;}
.match-row{display:grid;grid-template-columns:1fr auto 1fr auto;align-items:center;gap:.7rem;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.75rem 1rem;font-size:.92rem;}
.match-row .vs{font-family:var(--font-mono);color:var(--ink-faint);font-size:.75rem;text-align:center;}
.match-row .winner{font-weight:700;}
.match-row .score{font-family:var(--font-mono);font-weight:700;color:var(--teal);font-variant-numeric:tabular-nums;}
.match-row .marcador-detalle{font-family:var(--font-mono);color:var(--ink-faint);font-size:.78rem;margin-left:.4rem;}
.badge{font-family:var(--font-mono);font-size:.72rem;padding:.25rem .6rem;border-radius:99px;text-transform:uppercase;letter-spacing:.06em;}
.badge--pending{background:var(--teal-tint);color:var(--teal);}

/* bracket */
.bracket{display:flex;gap:2rem;overflow-x:auto;margin-top:2.2rem;padding-bottom:.6rem;}
.bracket-round{flex:0 0 auto;min-width:240px;display:flex;flex-direction:column;gap:1rem;}
.bracket-round h3{font-family:var(--font-mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-faint);font-weight:600;padding-bottom:.5rem;border-bottom:2px solid var(--gold);}
.bracket-match{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.75rem .9rem;}
.bracket-match div{padding:.25rem 0;font-size:.9rem;}
.bracket-match .winner{font-weight:700;color:var(--teal);}
.bracket-score{font-family:var(--font-mono);font-size:.78rem;color:var(--ink-faint)!important;border-top:1px dashed var(--border);margin-top:.3rem;padding-top:.4rem!important;}

/* empty state */
.empty-state{margin-top:2rem;border:1px dashed var(--border);border-radius:var(--radius);padding:2.4rem 1.8rem;text-align:center;color:var(--ink-soft);}
.empty-state .big{font-family:var(--font-display);font-size:1.7rem;color:var(--ink);font-weight:800;margin-bottom:.5rem;}
.empty-state p{max-width:44ch;margin:0 auto;font-size:.94rem;}

/* footer */
.site-footer{background:var(--header-bg);color:var(--header-ink-soft);padding:3rem 0 2.2rem;}
.footer-inner{max-width:1080px;margin:0 auto;padding:0 1.5rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:1.6rem;align-items:flex-start;}
.footer-inner img{height:30px;width:auto;}
.footer-note{font-size:.85rem;max-width:34ch;}
.footer-note strong{color:var(--header-ink);}
.footer-copy{font-size:.78rem;color:var(--ink-faint);margin-top:1.6rem;text-align:center;}

/* organizer */
.modal-overlay{position:fixed;inset:0;background:rgba(0,10,17,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:1.2rem;}
.modal-panel{background:var(--bg-elevated);border-radius:var(--radius);max-width:640px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 30px 70px rgba(0,0,0,.4);}
.modal-panel--login{max-width:380px;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:1.3rem 1.6rem;border-bottom:1px solid var(--border);}
.modal-header h2{font-size:1.3rem;}
.modal-close{background:transparent;border:none;font-size:1.3rem;cursor:pointer;color:var(--ink-faint);line-height:1;padding:.2rem;}
.modal-body{padding:1.6rem;}
.login-body{padding:2rem 1.8rem 2.2rem;text-align:center;}
.login-body p{color:var(--ink-soft);font-size:.9rem;margin-bottom:1.3rem;}
.login-error{color:#c0392b;font-size:.84rem;margin-top:.6rem;}
.tabs{display:flex;gap:.4rem;border-bottom:1px solid var(--border);padding:0 1.6rem;overflow-x:auto;}
.tab-btn{padding:.85rem .3rem;font-size:.86rem;font-weight:600;color:var(--ink-faint);border-bottom:2px solid transparent;white-space:nowrap;background:transparent;border-left:none;border-right:none;border-top:none;cursor:pointer;}
.tab-btn.active{color:var(--teal);border-color:var(--teal);}
.org-list{display:flex;flex-direction:column;gap:.6rem;margin:1rem 0 1.4rem;}
.org-row{display:flex;align-items:center;gap:.6rem;background:var(--bg-alt);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.6rem .8rem;font-size:.88rem;flex-wrap:wrap;}
.org-row .grow{flex:1;min-width:120px;}
.org-row small{display:block;color:var(--ink-faint);font-size:.76rem;}
.org-inline-form{display:flex;gap:.5rem;flex-wrap:wrap;align-items:flex-end;margin-top:1rem;padding-top:1rem;border-top:1px dashed var(--border);}
.org-inline-form .field{min-width:130px;flex:1;}
.save-status{font-size:.82rem;color:var(--ink-faint);margin-top:1rem;min-height:1.2em;}
.save-status.ok{color:#1f7a4d;}
.save-status.err{color:#c0392b;}
.match-edit-row{display:grid;grid-template-columns:1fr auto auto auto auto;gap:.5rem;align-items:center;background:var(--bg-alt);border-radius:var(--radius-sm);padding:.6rem .7rem;font-size:.85rem;margin-bottom:.5rem;}
.match-edit-row input{width:3.4rem;text-align:center;padding:.4rem;border:1px solid var(--border);border-radius:6px;background:var(--bg-elevated);}
.match-edit-row input.marcador-input{width:8rem;}
.round-block{border:1px solid var(--border);border-radius:var(--radius-sm);padding:1rem;margin-bottom:1rem;}
.round-block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.7rem;}
.round-block-head h4{font-size:1rem;}

@media (max-width:760px){
  .header-nav{display:none;}
  .mobile-menu-btn{display:flex;}
}
@media (max-width:640px){
  .section{padding:3.4rem 0;}
  .header-inner{gap:.6rem;}
  .header-logo img{height:26px;}
  .header-lock span.lock-label{display:none;}
  .insc-actions{flex-direction:column;align-items:stretch;}
  .match-row{grid-template-columns:1fr;text-align:left;gap:.2rem;}
  .match-row .vs{display:none;}
  .match-edit-row{grid-template-columns:1fr 1fr;}
}
.status-banner{background:var(--teal-tint);color:var(--teal);border-radius:var(--radius-sm);padding:.8rem 1rem;font-size:.85rem;margin-top:1.6rem;}
.status-banner.err{background:rgba(192,57,43,.1);color:#c0392b;}
.insc-success{border:1px solid var(--border);border-radius:var(--radius);padding:1.6rem;text-align:center;}
.insc-success .big{font-family:var(--font-display);font-size:1.5rem;font-weight:800;margin-bottom:.5rem;}
.insc-success p{color:var(--ink-soft);font-size:.92rem;}
.req-row{display:flex;align-items:center;gap:.7rem;background:var(--bg-alt);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.7rem .9rem;font-size:.88rem;flex-wrap:wrap;margin-bottom:.6rem;}
.req-row .grow{flex:1;min-width:140px;}
.req-row small{display:block;color:var(--ink-faint);font-size:.76rem;}
.status-pill{font-family:var(--font-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;padding:.2rem .55rem;border-radius:99px;}
.status-pill.pending{background:var(--teal-tint);color:var(--teal);}
.status-pill.accepted{background:rgba(31,122,77,.12);color:#1f7a4d;}
.status-pill.rejected{background:rgba(192,57,43,.1);color:#c0392b;}
.loading-note{color:var(--ink-faint);font-size:.9rem;margin-top:1.6rem;}
.rules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.2rem;margin-top:1.8rem;}
.rule-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem 1.6rem;}
.rule-card h3{font-size:1.05rem;font-weight:800;margin-bottom:1rem;}
.rule-list{display:flex;flex-direction:column;gap:.65rem;font-size:.92rem;color:var(--ink-soft);list-style:none;padding:0;margin:0;}
.rule-list li{display:flex;justify-content:space-between;align-items:center;gap:.6rem;}
.rule-list li strong{color:var(--teal);font-family:var(--font-mono);font-weight:700;white-space:nowrap;}
.rule-list--ordered li{justify-content:flex-start;}
.rule-list--ordered li::before{content:counter(rule-item);counter-increment:rule-item;flex-shrink:0;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--teal-tint);color:var(--teal);font-family:var(--font-mono);font-weight:700;font-size:.78rem;display:flex;align-items:center;justify-content:center;}
.rule-list--ordered{counter-reset:rule-item;}
.rule-list--bullets li{position:relative;padding-left:1.1rem;justify-content:flex-start;}
.rule-list--bullets li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--gold);}
.contact-actions{display:flex;gap:.9rem;flex-wrap:wrap;margin-top:1.4rem;}
table.standings{min-width:640px;}
</style>

/* ---------- helpers ---------- */
function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,9); }
function valOf(id){ var el = document.getElementById(id); return el ? el.value.trim() : ""; }
function escHtml(s){
  return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function pairById(id){ for (var i=0;i<STATE.pairs.length;i++){ if (STATE.pairs[i].id===id) return STATE.pairs[i]; } return null; }
function pairLabel(id){ var p = pairById(id); return p ? (p.j1+" / "+p.j2) : "Pareja eliminada"; }

function generateRoundRobin(pairs){
  var ids = pairs.map(function(p){ return p.id; });
  if (ids.length % 2 !== 0) ids.push(null);
  var n = ids.length;
  if (n < 2) return [];
  var rounds = []; var arr = ids.slice();
  for (var r=0;r<n-1;r++){
    var roundPairs = [];
    for (var i=0;i<n/2;i++){
      var a = arr[i], b = arr[n-1-i];
      if (a!==null && b!==null) roundPairs.push([a,b]);
    }
    rounds.push(roundPairs);
    var fixed = arr[0]; var rest = arr.slice(1); rest.unshift(rest.pop());
    arr = [fixed].concat(rest);
  }
  return rounds;
}
function matchPoints(setsA, setsB){
  var diff = Math.abs(setsA - setsB);
  var winPts = diff >= 2 ? 3 : 2;
  var losePts = diff >= 2 ? 0 : 1;
  return setsA > setsB ? [winPts, losePts] : [losePts, winPts];
}
function parseGamesFromMarcador(marcador){
  if (!marcador) return null;
  var gA = 0, gB = 0, found = false;
  String(marcador).split(",").forEach(function(part){
    var m = part.trim().match(/(\d+)\s*-\s*(\d+)/);
    if (m){ gA += parseInt(m[1],10); gB += parseInt(m[2],10); found = true; }
  });
  return found ? { gA:gA, gB:gB } : null;
}
function headToHeadResult(aId, bId){
  var m = STATE.matches.filter(function(x){
    return x.played && ((x.pairA===aId && x.pairB===bId) || (x.pairA===bId && x.pairB===aId));
  })[0];
  if (!m) return 0;
  var aIsA = m.pairA === aId;
  var aSets = aIsA ? m.setsA : m.setsB;
  var bSets = aIsA ? m.setsB : m.setsA;
  if (aSets > bSets) return 1;
  if (bSets > aSets) return -1;
  return 0;
}
function computeStandings(){
  var table = {};
  STATE.pairs.filter(function(p){ return p.confirmed; }).forEach(function(p){
    table[p.id] = { id:p.id, label:p.j1+" / "+p.j2, pj:0, pg:0, pp:0, sf:0, sc:0, gf:0, gc:0, pts:0 };
  });
  STATE.matches.forEach(function(m){
    if (!m.played) return;
    var a = table[m.pairA], b = table[m.pairB];
    if (!a || !b) return;
    a.pj++; b.pj++; a.sf+=m.setsA; a.sc+=m.setsB; b.sf+=m.setsB; b.sc+=m.setsA;
    if (m.setsA > m.setsB){ a.pg++; b.pp++; } else { b.pg++; a.pp++; }
    var pts = matchPoints(m.setsA, m.setsB);
    a.pts += pts[0]; b.pts += pts[1];
    var games = parseGamesFromMarcador(m.marcador);
    if (games){ a.gf += games.gA; a.gc += games.gB; b.gf += games.gB; b.gc += games.gA; }
  });
  var rows = Object.keys(table).map(function(k){ var r=table[k]; r.dif=r.sf-r.sc; r.gdif=r.gf-r.gc; return r; });
  rows.sort(function(x,y){
    if (y.pts!==x.pts) return y.pts-x.pts;
    var h2h = headToHeadResult(x.id, y.id);
    if (h2h !== 0) return -h2h;
    if (y.dif!==x.dif) return y.dif-x.dif;
    if (y.gdif!==x.gdif) return y.gdif-x.gdif;
    return x.label.localeCompare(y.label);
  });
  return rows;
}

function emptyState(big, text){
  return '<div class="empty-state"><div class="big">'+escHtml(big)+'</div><p>'+escHtml(text)+'</p></div>';
}
function labeledInput(id,label,placeholder,value){
  return '<label class="field"><span>'+escHtml(label)+'</span><input id="'+id+'" type="text" placeholder="'+escHtml(placeholder||"")+'" value="'+escHtml(value||"")+'" autocomplete="off"></label>';

function renderLiga(){
  if (!STATE.loaded.pairs || !STATE.loaded.matches){
    return '<section id="liga" class="section"><div class="section-inner"><p class="eyebrow">Liga</p><h2 class="section-title">Clasificación</h2><p class="loading-note">Cargando…</p></div></section>';
  }
  var confirmedPairs = STATE.pairs.filter(function(p){ return p.confirmed; });
  var body;
  if (confirmedPairs.length < 2){
    body = emptyState("Aún no hay parejas confirmadas", "En cuanto se confirmen al menos dos parejas, aquí aparecerá la clasificación de la liga.");
  } else if (!STATE.matches.length){
    body = emptyState("Calendario pendiente de publicar", "Hay "+confirmedPairs.length+" pareja"+(confirmedPairs.length===1?"":"s")+" confirmada"+(confirmedPairs.length===1?"":"s")+". El calendario de la fase de liga se publicará en breve.");
  } else {
    body = renderStandingsTable(computeStandings()) + renderMatchesByJornada();
  }
  return '<section id="liga" class="section"><div class="section-inner">'
    + '<p class="eyebrow">Liga</p><h2 class="section-title">Clasificación</h2>'
    + '<p class="section-lead">Todas las parejas confirmadas se enfrentan entre sí una vez. Los puntos y los criterios de desempate están detallados en <a href="#formato">Formato</a>.</p>'
    + body + '</div></section>';
}
function renderStandingsTable(rows){
  var body = rows.map(function(r, idx){
    return '<tr><td class="num">'+(idx+1)+'</td><td>'+escHtml(r.label)+'</td><td class="num">'+r.pj+'</td><td class="num">'+r.pg+'</td><td class="num">'+r.pp+'</td><td class="num">'+r.sf+'-'+r.sc+'</td><td class="num">'+(r.dif>0?"+":"")+r.dif+'</td><td class="num">'+(r.gdif>0?"+":"")+r.gdif+'</td><td class="num pts">'+r.pts+'</td></tr>';
  }).join("");
  return '<div class="table-wrap"><table class="standings"><thead><tr><th>#</th><th>Pareja</th><th>PJ</th><th>PG</th><th>PP</th><th>Sets</th><th>Dif sets</th><th>Dif juegos</th><th>Pts</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}
function renderMatchesByJornada(){
  var byJ = {};
  STATE.matches.forEach(function(m){ (byJ[m.jornada]=byJ[m.jornada]||[]).push(m); });
  var jornadas = Object.keys(byJ).map(Number).sort(function(a,b){return a-b;});
  return '<div class="jornadas">' + jornadas.map(function(j){
    return '<div class="jornada"><h3>Jornada '+j+'</h3><ul class="match-list">' + byJ[j].map(renderMatchRow).join("") + '</ul></div>';
  }).join("") + '</div>';
}
function renderMatchRow(m){
  var labelA = pairLabel(m.pairA), labelB = pairLabel(m.pairB), scoreHtml;
  if (m.played){
    scoreHtml = '<span class="score">'+m.setsA+'-'+m.setsB+'</span>' + (m.marcador ? '<span class="marcador-detalle">'+escHtml(m.marcador)+'</span>' : "");
  } else {
    scoreHtml = '<span class="badge badge--pending">Pendiente</span>';
  }
  return '<li class="match-row">'
    + '<span class="'+(m.played && m.setsA>m.setsB ? "winner":"")+'">'+escHtml(labelA)+'</span>'
    + '<span class="vs">vs</span>'
    + '<span class="'+(m.played && m.setsB>m.setsA ? "winner":"")+'">'+escHtml(labelB)+'</span>'
    + scoreHtml + '</li>';
}
function renderCuadros(){
  if (!STATE.loaded.bracket){
    return '<section id="cuadros" class="section section--alt"><div class="section-inner"><p class="eyebrow">Cuadros</p><h2 class="section-title">Fase eliminatoria</h2><p class="loading-note">Cargando…</p></div></section>';

    body = emptyState("Cuadros pendientes de publicar", "Los cuadros eliminatorios se publicarán al terminar la fase de liga.");

      return '<div class="bracket-round"><h3>'+escHtml(r.name)+'</h3>'
        + r.matches.map(function(m){
            return '<div class="bracket-match">'
              + '<div class="'+(m.ganador && m.ganador===m.a ? "winner":"")+'">'+escHtml(m.a)+'</div>'
              + '<div class="'+(m.ganador && m.ganador===m.b ? "winner":"")+'">'+escHtml(m.b)+'</div>'
              + (m.resultado ? '<div class="bracket-score">'+escHtml(m.resultado)+'</div>' : "")
              + '</div>';

        + '</div>';
    }).join("") + '</div>';
  }
  return '<section id="cuadros" class="section section--alt"><div class="section-inner">'
    + '<p class="eyebrow">Cuadros</p><h2 class="section-title">Fase eliminatoria</h2>'
    + '<p class="section-lead">Tras la fase de liga, las parejas pasan a los cuadros eliminatorios hasta la final.</p>'
    + body + '</div></section>';
}

function renderOrganizer(){
  if (!ui.modalOpen) return "";

    return '<div class="modal-overlay"><div class="modal-panel modal-panel--login">'
      + '<div class="modal-header"><h2>Acceso organizador</h2><button class="modal-close" data-action="close-organizer" type="button">✕</button></div>'

    + '<div class="tabs">' + tabs.map(function(t){ return '<button class="tab-btn'+(ui.tab===t[0]?" active":"")+'" data-action="set-tab" data-tab="'+t[0]+'" type="button">'+t[1]+'</button>'; }).join("") + '</div>'

    + (ui.tab==="solicitudes" ? renderOrgSolicitudesTab() : "")

    + (ui.tab==="cuadros" ? renderOrgCuadrosTab() : "")

    + '</div></div></div>';

function renderOrgInfoTab(){
  var i = STATE.info;
  return '<div><div class="form-grid" style="max-width:none;">'
    + labeledInput("info-fechas","Fechas",null,i.fechas) + labeledInput("info-precio","Precio de inscripción",null,i.precio)
    + labeledInput("info-plazo","Plazo de inscripción",null,i.plazo) + labeledInput("info-contacto","Email de contacto",null,i.contacto)
    + '</div><button class="btn btn-primary btn-sm" style="margin-top:1.2rem;" data-action="save-info" type="button">Guardar información</button></div>';
}
function renderOrgSolicitudesTab(){
  if (!STATE.loaded.inscripciones){
    return '<p class="loading-note">Cargando solicitudes…</p>';
  }
  if (!STATE.inscripciones.length){
    return '<p style="color:var(--ink-faint);font-size:.9rem;">Todavía no ha llegado ninguna solicitud de inscripción.</p>';
  }
  var sorted = STATE.inscripciones.slice().sort(function(a,b){
    if (a.status==="pending" && b.status!=="pending") return -1;
    if (b.status==="pending" && a.status!=="pending") return 1;
    return (b.submittedAtMs||0) - (a.submittedAtMs||0);
  });
  var rows = sorted.map(function(r){
    var actions = r.status==="pending"
      ? '<button class="btn btn-outline btn-sm" data-action="accept-request" data-id="'+r.id+'" type="button">Aceptar</button><button class="btn btn-danger btn-sm" data-action="reject-request" data-id="'+r.id+'" type="button">Rechazar</button>'
      : '';
    return '<div class="req-row"><span class="grow"><strong>'+escHtml(r.j1)+' / '+escHtml(r.j2)+'</strong><small>'+escHtml(r.contacto||"sin contacto")+'</small></span>'
      + '<span class="status-pill '+r.status+'">'+(r.status==="pending"?"Pendiente":r.status==="accepted"?"Aceptada":"Rechazada")+'</span>'
      + actions + '</div>';
  }).join("");
  return '<div>' + rows + '</div>';
}
function renderOrgParejasTab(){
  var rows = STATE.pairs.map(function(p){
    return '<div class="org-row"><span class="grow"><strong>'+escHtml(p.j1)+' / '+escHtml(p.j2)+'</strong><small>'+escHtml(p.contacto||"sin contacto")+'</small></span>'
      + '<button class="btn btn-sm '+(p.confirmed?"btn-outline":"btn-ghost")+'" style="'+(p.confirmed?"":"border-color:var(--border);color:var(--ink-faint);")+'" data-action="toggle-confirmed" data-id="'+p.id+'" type="button">'+(p.confirmed?"Confirmada":"Marcar confirmada")+'</button>'
      + '<button class="btn btn-danger btn-sm" data-action="delete-pair" data-id="'+p.id+'" type="button">Eliminar</button></div>';
  }).join("");
  return '<div>' + (rows ? '<div class="org-list">'+rows+'</div>' : '<p style="color:var(--ink-faint);font-size:.9rem;">Todavía no has añadido ninguna pareja.</p>')
    + '<div class="org-inline-form">'
    +   '<div class="field"><span>Jugador 1</span><input id="new-pair-j1" type="text"></div>'
    +   '<div class="field"><span>Jugador 2</span><input id="new-pair-j2" type="text"></div>'
    +   '<div class="field"><span>Contacto</span><input id="new-pair-contacto" type="text"></div>'
    +   '<button class="btn btn-primary btn-sm" data-action="add-pair" type="button">Añadir pareja</button>'
    + '</div></div>';
}
function renderOrgLigaTab(){
  var confirmedPairs = STATE.pairs.filter(function(p){ return p.confirmed; });
  var head = '<p style="color:var(--ink-soft);font-size:.9rem;">'+confirmedPairs.length+' pareja'+(confirmedPairs.length===1?"":"s")+' confirmada'+(confirmedPairs.length===1?"":"s")+'.</p>'
    + '<button class="btn btn-outline btn-sm" style="margin-top:.7rem;" data-action="generate-fixture" type="button">'+(STATE.matches.length?"Regenerar calendario":"Generar calendario de liga")+'</button>'
    + '<p style="color:var(--ink-faint);font-size:.82rem;margin-top:.8rem;">Escribe el marcador set a set (ej. "6-4, 6-3") en cada partido: además de mostrarse en la web, se usa para calcular la diferencia de juegos del desempate.</p>';
  if (!STATE.matches.length) return '<div>' + head + '</div>';
  var byJ = {};
  STATE.matches.forEach(function(m){ (byJ[m.jornada]=byJ[m.jornada]||[]).push(m); });
  var jornadas = Object.keys(byJ).map(Number).sort(function(a,b){return a-b;});
  var list = jornadas.map(function(j){
    return '<div style="margin-top:1rem;"><h4 style="font-family:var(--font-mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);margin-bottom:.5rem;">Jornada '+j+'</h4>'
      + byJ[j].map(function(m){
          return '<div class="match-edit-row">'
            + '<span>'+escHtml(pairLabel(m.pairA))+' vs '+escHtml(pairLabel(m.pairB))+'</span>'
            + '<input id="match-setsA-'+m.id+'" type="text" inputmode="numeric" placeholder="A" value="'+(m.setsA===null?"":m.setsA)+'">'
            + '<input id="match-setsB-'+m.id+'" type="text" inputmode="numeric" placeholder="B" value="'+(m.setsB===null?"":m.setsB)+'">'
            + '<input id="match-marcador-'+m.id+'" class="marcador-input" type="text" placeholder="6-4, 6-3" value="'+escHtml(m.marcador)+'">'
            + '<button class="btn btn-primary btn-sm" data-action="save-match" data-id="'+m.id+'" type="button">Guardar</button></div>';
        }).join("")
      + '</div>';
  }).join("");
  return '<div>' + head + list + '</div>';
}
function renderOrgCuadrosTab(){
  var rounds = STATE.bracket.map(function(r){
    var matches = r.matches.map(function(m){
      var options = ['<option value=""'+(m.ganador===""?" selected":"")+'>Pendiente</option>',
        '<option value="'+escHtml(m.a)+'"'+(m.ganador===m.a?" selected":"")+'>'+escHtml(m.a)+'</option>',
        '<option value="'+escHtml(m.b)+'"'+(m.ganador===m.b?" selected":"")+'>'+escHtml(m.b)+'</option>'].join("");
      return '<div class="match-edit-row" style="grid-template-columns:1fr auto auto auto;">'
        + '<span>'+escHtml(m.a)+' vs '+escHtml(m.b)+'</span>'
        + '<input id="bm-resultado-'+m.id+'" class="marcador-input" type="text" placeholder="Resultado" value="'+escHtml(m.resultado)+'">'
        + '<select id="bm-ganador-'+m.id+'">'+options+'</select>'
        + '<span style="display:flex;gap:.35rem;">'
        +   '<button class="btn btn-primary btn-sm" data-action="save-bracket-match" data-round="'+r.id+'" data-id="'+m.id+'" type="button">Guardar</button>'
        +   '<button class="btn btn-danger btn-sm" data-action="delete-bracket-match" data-round="'+r.id+'" data-id="'+m.id+'" type="button">✕</button>'
        + '</span></div>';
    }).join("");
    return '<div class="round-block"><div class="round-block-head"><h4>'+escHtml(r.name)+'</h4><button class="btn btn-danger btn-sm" data-action="delete-round" data-id="'+r.id+'" type="button">Eliminar ronda</button></div>'
      + matches
      + '<div class="org-inline-form">'
      +   '<div class="field"><span>Pareja A</span><input id="new-bm-a-'+r.id+'" type="text"></div>'
      +   '<div class="field"><span>Pareja B</span><input id="new-bm-b-'+r.id+'" type="text"></div>'
      +   '<button class="btn btn-outline btn-sm" data-action="add-bracket-match" data-id="'+r.id+'" type="button">Añadir partido</button>'
      + '</div></div>';
  }).join("");
  return '<div>' + rounds
    + '<div class="org-inline-form">'
    +   '<div class="field"><span>Nueva ronda</span><input id="new-round-name" type="text" placeholder="Ej. Cuartos de final"></div>'
    +   '<button class="btn btn-primary btn-sm" data-action="add-round" type="button">Añadir ronda</button>'
    + '</div></div>';
}

function wireInscripcionForm(){
  var form = document.getElementById("inscripcion-form");
  if (!form) return;
  form.addEventListener("submit", function(e){
    e.preventDefault();
    var j1 = valOf("insc-j1"), j2 = valOf("insc-j2"), contacto = valOf("insc-contacto");
    var errEl = document.getElementById("insc-error");
    if (!j1 || !j2 || !contacto){
      errEl.style.display = "block";
      errEl.textContent = "Rellena los dos jugadores y un contacto.";
      return;
    }
    errEl.style.display = "none";
    var btn = document.getElementById("insc-submit-btn");
    btn.disabled = true; btn.textContent = "Enviando…";
    addDoc(collection(db, "inscripciones"), {
      j1: j1, j2: j2, contacto: contacto, status: "pending", submittedAt: serverTimestamp()
    }).then(function(){
      ui.inscripcionSent = true;
      mount();
    }).catch(function(err){
      btn.disabled = false; btn.textContent = "Enviar solicitud de inscripción";
      errEl.style.display = "block";
      errEl.textContent = "No se pudo enviar. Comprueba tu conexión e inténtalo de nuevo, o escríbenos a " + CONTACT_EMAIL + ".";
    });
  });
}

/* ---------- actions ---------- */
function openOrganizer(){ ui.modalOpen = true; ui.loginError = false; mount(); }
function closeOrganizer(){ ui.modalOpen = false; mount(); }
function relock(){ signOut(auth); ui.modalOpen = false; mount(); }
function tryLogin(){
  var val = valOf("login-password-input");
  var btn = document.querySelector('[data-action="try-login"]');
  if (btn){ btn.disabled = true; btn.textContent = "Entrando…"; }
  signInWithEmailAndPassword(auth, ADMIN_EMAIL, val).then(function(){
    ui.loginError = false; ui.tab = "info";
  }).catch(function(){
    ui.loginError = true;
  }).finally(function(){ mount(); });
}
function setTab(tab){ ui.tab = tab; mount(); }
function toggleMobileMenu(){ ui.mobileMenuOpen = !ui.mobileMenuOpen; mount(); }
function closeMobileMenu(){ ui.mobileMenuOpen = false; mount(); }

function setSaving(msg){ ui.saving = true; ui.saveType = ""; ui.saveMsg = msg; mount(); }
function setSaveResult(ok, msg){ ui.saving = false; ui.saveType = ok ? "ok" : "err"; ui.saveMsg = msg; mount(); }

function saveStateDoc(name, data){
  setSaving("Guardando…");
  return setDoc(doc(db, "state", name), data).then(function(){
    setSaveResult(true, "Guardado ✓ — ya visible para todos.");
  }).catch(function(err){
    setSaveResult(false, "No se pudo guardar (" + (err && err.code || "error") + "). Comprueba tu conexión.");
  });
}

function addPair(){
  var j1 = valOf("new-pair-j1"), j2 = valOf("new-pair-j2"), contacto = valOf("new-pair-contacto");
  if (!j1 || !j2){ alert("Escribe los nombres de los dos jugadores."); return; }
  STATE.pairs.push({ id: uid("p"), j1:j1, j2:j2, contacto:contacto, confirmed:true });
  saveStateDoc("pairs", { list: STATE.pairs });
}
function deletePair(id){
  if (!confirm("¿Eliminar esta pareja?")) return;
  STATE.pairs = STATE.pairs.filter(function(p){ return p.id!==id; });
  saveStateDoc("pairs", { list: STATE.pairs });
}
function toggleConfirmed(id){
  var p = pairById(id); if (p) p.confirmed = !p.confirmed;
  saveStateDoc("pairs", { list: STATE.pairs });
}
function generateFixture(){
  var confirmedPairs = STATE.pairs.filter(function(p){ return p.confirmed; });
  if (confirmedPairs.length < 2){ alert("Necesitas al menos 2 parejas confirmadas."); return; }
  if (STATE.matches.length && !confirm("Ya existe un calendario. Si lo regeneras se perderán los resultados introducidos. ¿Continuar?")) return;
  var rounds = generateRoundRobin(confirmedPairs);
  var matches = [];
  rounds.forEach(function(roundPairs, idx){
    roundPairs.forEach(function(pair){
      matches.push({ id: uid("m"), jornada: idx+1, pairA: pair[0], pairB: pair[1], setsA:null, setsB:null, marcador:"", played:false });
    });
  });
  STATE.matches = matches;
  saveStateDoc("matches", { list: STATE.matches });
}
function saveMatch(id){
  var m = STATE.matches.filter(function(x){ return x.id===id; })[0];
  if (!m) return;
  var rawA = valOf("match-setsA-"+id), rawB = valOf("match-setsB-"+id), marcador = valOf("match-marcador-"+id);
  if (rawA==="" && rawB===""){ m.setsA=null; m.setsB=null; m.played=false; m.marcador=marcador; }
  else {
    var sa = parseInt(rawA,10), sb = parseInt(rawB,10);
    if (isNaN(sa) || isNaN(sb)){ alert("Introduce los sets ganados por cada pareja (números)."); return; }
    m.setsA=sa; m.setsB=sb; m.played=true; m.marcador=marcador;
  }
  saveStateDoc("matches", { list: STATE.matches });
}
function saveInfo(){
  STATE.info.fechas = valOf("info-fechas"); STATE.info.precio = valOf("info-precio");
  STATE.info.plazo = valOf("info-plazo"); STATE.info.contacto = valOf("info-contacto") || CONTACT_EMAIL;
  saveStateDoc("info", STATE.info);
}
function addRound(){
  var name = valOf("new-round-name");
  if (!name){ alert("Ponle un nombre a la ronda (ej. Cuartos de final)."); return; }
  STATE.bracket.push({ id: uid("r"), name:name, matches:[] });
  saveStateDoc("bracket", { rounds: STATE.bracket });
}
function deleteRound(id){
  if (!confirm("¿Eliminar esta ronda y sus partidos?")) return;
  STATE.bracket = STATE.bracket.filter(function(r){ return r.id!==id; });
  saveStateDoc("bracket", { rounds: STATE.bracket });
}
function addBracketMatch(roundId){
  var round = STATE.bracket.filter(function(r){ return r.id===roundId; })[0];
  if (!round) return;
  var a = valOf("new-bm-a-"+roundId), b = valOf("new-bm-b-"+roundId);
  if (!a || !b){ alert("Escribe las dos parejas del partido."); return; }
  round.matches.push({ id: uid("bm"), a:a, b:b, resultado:"", ganador:"" });
  saveStateDoc("bracket", { rounds: STATE.bracket });
}
function deleteBracketMatch(roundId, matchId){
  var round = STATE.bracket.filter(function(r){ return r.id===roundId; })[0];
  if (!round) return;
  round.matches = round.matches.filter(function(m){ return m.id!==matchId; });
  saveStateDoc("bracket", { rounds: STATE.bracket });
}
function saveBracketMatch(roundId, matchId){
  var round = STATE.bracket.filter(function(r){ return r.id===roundId; })[0];
  if (!round) return;
  var m = round.matches.filter(function(x){ return x.id===matchId; })[0];
  if (!m) return;
  m.resultado = valOf("bm-resultado-"+matchId);
  var sel = document.getElementById("bm-ganador-"+matchId);
  m.ganador = sel ? sel.value : "";
  saveStateDoc("bracket", { rounds: STATE.bracket });
}
function acceptRequest(id){
  var r = STATE.inscripciones.filter(function(x){ return x.id===id; })[0];
  if (!r) return;
  STATE.pairs.push({ id: uid("p"), j1:r.j1, j2:r.j2, contacto:r.contacto, confirmed:true });
  setSaving("Guardando…");
  Promise.all([
    setDoc(doc(db,"state","pairs"), { list: STATE.pairs }),
    updateDoc(doc(db,"inscripciones", id), { status: "accepted" })
  ]).then(function(){
    setSaveResult(true, "Pareja añadida y solicitud aceptada ✓");
  }).catch(function(){
    setSaveResult(false, "No se pudo aceptar la solicitud. Inténtalo de nuevo.");
  });
}
function rejectRequest(id){
  if (!confirm("¿Rechazar esta solicitud?")) return;
  setSaving("Guardando…");
  updateDoc(doc(db,"inscripciones", id), { status: "rejected" }).then(function(){
    setSaveResult(true, "Solicitud rechazada.");
  }).catch(function(){
    setSaveResult(false, "No se pudo actualizar. Inténtalo de nuevo.");
  });
}

/* ---------- events ---------- */
document.addEventListener("click", function(e){
  if (e.target.classList && e.target.classList.contains("modal-overlay")){ closeOrganizer(); return; }
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var action = el.getAttribute("data-action");
  var id = el.getAttribute("data-id");
  switch(action){
    case "open-organizer": openOrganizer(); break;
    case "close-organizer": closeOrganizer(); break;
    case "try-login": tryLogin(); break;
    case "relock": relock(); break;
    case "set-tab": setTab(el.getAttribute("data-tab")); break;
    case "toggle-mobile-menu": toggleMobileMenu(); break;
    case "close-mobile-menu":
      e.preventDefault();
      var targetHref = el.getAttribute("href");
      closeMobileMenu();
      if (targetHref && targetHref.charAt(0)==="#"){
        setTimeout(function(){ var t=document.getElementById(targetHref.slice(1)); if (t) t.scrollIntoView({behavior:"smooth",block:"start"}); }, 60);
      }
      break;
    case "add-pair": addPair(); break;
    case "delete-pair": deletePair(id); break;
    case "toggle-confirmed": toggleConfirmed(id); break;
    case "generate-fixture": generateFixture(); break;
    case "save-match": saveMatch(id); break;
    case "save-info": saveInfo(); break;
    case "add-round": addRound(); break;
    case "delete-round": deleteRound(id); break;
    case "add-bracket-match": addBracketMatch(id); break;
    case "delete-bracket-match": deleteBracketMatch(el.getAttribute("data-round"), id); break;
    case "save-bracket-match": saveBracketMatch(el.getAttribute("data-round"), id); break;
    case "accept-request": acceptRequest(id); break;
    case "reject-request": rejectRequest(id); break;
  }
});
document.addEventListener("keydown", function(e){
  if (e.key === "Enter" && e.target && e.target.id === "login-password-input") tryLogin();
});

/* ---------- realtime subscriptions ---------- */
onSnapshot(doc(db,"state","info"), function(snap){
  if (snap.exists()) STATE.info = Object.assign({}, STATE.info, snap.data());
  STATE.loaded.info = true; mount();
}, function(){ STATE.loaded.info = true; mount(); });

onSnapshot(doc(db,"state","pairs"), function(snap){
  STATE.pairs = (snap.exists() && snap.data().list) || [];
  STATE.loaded.pairs = true; mount();
}, function(){ STATE.loaded.pairs = true; mount(); });

onSnapshot(doc(db,"state","matches"), function(snap){
  STATE.matches = (snap.exists() && snap.data().list) || [];
  STATE.loaded.matches = true; mount();
}, function(){ STATE.loaded.matches = true; mount(); });

onSnapshot(doc(db,"state","bracket"), function(snap){
  STATE.bracket = (snap.exists() && snap.data().rounds) || [];
  STATE.loaded.bracket = true; mount();
}, function(){ STATE.loaded.bracket = true; mount(); });

onAuthStateChanged(auth, function(user){
  ui.unlocked = !!(user && user.email === ADMIN_EMAIL);
  if (ui.unlocked && !inscripcionesUnsub){
    inscripcionesUnsub = onSnapshot(collection(db, "inscripciones"), function(qs){
      STATE.inscripciones = qs.docs.map(function(d){
        var data = d.data();
        return { id: d.id, j1: data.j1, j2: data.j2, contacto: data.contacto, status: data.status || "pending",
          submittedAtMs: data.submittedAt && data.submittedAt.toMillis ? data.submittedAt.toMillis() : 0 };
      });
      STATE.loaded.inscripciones = true; mount();
    });
  } else if (!ui.unlocked && inscripcionesUnsub){
    inscripcionesUnsub(); inscripcionesUnsub = null;
    STATE.inscripciones = []; STATE.loaded.inscripciones = false;
  }
  mount();
});

mount();
</script>
</body>
</html>
