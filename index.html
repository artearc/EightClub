/* Rounds display in bracket-logical order (earliest stage → final) no matter what order
   the organizer created them in — ranked by keyword in the round's name, most-specific
   stage names checked first since e.g. "semifinal"/"cuartos de final" both contain the
   substring "final" too. Unrecognized names rank first (0) and keep their relative
   creation order via the index tiebreak, so a stable custom name like "Grupo A" doesn't
   get shuffled around by the sort. */
function bracketRoundRank(name){
  var n = String(name || "").toLowerCase();
  if (n.indexOf("semifinal") !== -1) return 90;
  if (n.indexOf("cuartos") !== -1) return 80;
  if (n.indexOf("octavos") !== -1) return 70;
  if (n.indexOf("dieciseisavos") !== -1) return 60;
  if (n.indexOf("treintaidosavos") !== -1) return 50;
  if (n.indexOf("final") !== -1) return 100;
  return 0;
}
function sortedRounds(){
  return STATE.bracket.map(function(r, i){ return { r:r, i:i }; })
    .sort(function(x, y){
      var d = bracketRoundRank(x.r.name) - bracketRoundRank(y.r.name);
      return d !== 0 ? d : x.i - y.i;
    })
    .map(function(o){ return o.r; });
}

function generateRoundRobin(pairs){
  var ids = pairs.map(function(p){ return p.id; });
  if (ids.length % 2 !== 0) ids.push(null);
  var n = ids.length;
  if (n < 2) return [];
  var rounds = []; var arr = ids.slice();
  for (var r=0;r<n-1;r++){
    var roundPairs = [];
    for (var i=0;i<n/2;i++){
      var a = arr[i], b = arr[n-1-i];
      if (a!==null && b!==null) roundPairs.push([a,b]);
    }
    rounds.push(roundPairs);
    var fixed = arr[0]; var rest = arr.slice(1); rest.unshift(rest.pop());
    arr = [fixed].concat(rest);
  }
  return rounds;
}
function matchPoints(setsA, setsB){
  var diff = Math.abs(setsA - setsB);
  var winPts = diff >= 2 ? 3 : 2;
  var losePts = diff >= 2 ? 0 : 1;
  return setsA > setsB ? [winPts, losePts] : [losePts, winPts];
}
function parseGamesFromMarcador(marcador){
  if (!marcador) return null;
  var gA = 0, gB = 0, found = false;
  String(marcador).split(",").forEach(function(part){
    var m = part.trim().match(/(\d+)\s*-\s*(\d+)/);
    if (m){ gA += parseInt(m[1],10); gB += parseInt(m[2],10); found = true; }
  });
  return found ? { gA:gA, gB:gB } : null;
}
function headToHeadResult(aId, bId){
  var m = STATE.matches.filter(function(x){
    return x.played && ((x.pairA===aId && x.pairB===bId) || (x.pairA===bId && x.pairB===aId));
  })[0];
  if (!m) return 0;
  var aIsA = m.pairA === aId;
  var aSets = aIsA ? m.setsA : m.setsB;
  var bSets = aIsA ? m.setsB : m.setsA;
  if (aSets > bSets) return 1;
  if (bSets > aSets) return -1;
  return 0;
}
function computeStandings(){
  var table = {};
  STATE.pairs.filter(function(p){ return p.confirmed; }).forEach(function(p){
    table[p.id] = { id:p.id, label:p.j1+" / "+p.j2, pj:0, pg:0, pp:0, sf:0, sc:0, gf:0, gc:0, pts:0 };
  });
  STATE.matches.forEach(function(m){
    if (!m.played) return;
    var a = table[m.pairA], b = table[m.pairB];
    if (!a || !b) return;
    a.pj++; b.pj++; a.sf+=m.setsA; a.sc+=m.setsB; b.sf+=m.setsB; b.sc+=m.setsA;
    if (m.setsA > m.setsB){ a.pg++; b.pp++; } else { b.pg++; a.pp++; }
    var pts = matchPoints(m.setsA, m.setsB);
    a.pts += pts[0]; b.pts += pts[1];
    var games = parseGamesFromMarcador(m.marcador);
    if (games){ a.gf += games.gA; a.gc += games.gB; b.gf += games.gB; b.gc += games.gA; }
  });
  var rows = Object.keys(table).map(function(k){ var r=table[k]; r.dif=r.sf-r.sc; r.gdif=r.gf-r.gc; return r; });
  rows.sort(function(x,y){
    if (y.pts!==x.pts) return y.pts-x.pts;
    var h2h = headToHeadResult(x.id, y.id);
    if (h2h !== 0) return -h2h;
    if (y.dif!==x.dif) return y.dif-x.dif;
    if (y.gdif!==x.gdif) return y.gdif-x.gdif;
    return x.label.localeCompare(y.label);
  });
  return rows;
}

function renderHeader(){
  var navLinks = NAV_LINKS.map(function(l){ return '<a href="'+l[0]+'">'+l[1]+'</a>'; }).join("");

    + '<a href="#inicio" class="header-logo">'+isotipoSvg()+'<span class="brand-mark">EIGHT<span class="dot">.</span></span><span class="brand-sub">Club</span></a>'
    + '<nav class="header-nav">' + navLinks + '</nav>'
    + '<button class="header-lock header-lock--player" data-action="open-player" type="button"><span class="dot"></span> <span class="lock-label">'+(ui.playerPairId ? "Mis partidos" : "Jugador")+'</span><span class="lock-label-short">Jugador</span></button>'

    + (ui.mobileMenuOpen ? '<nav class="mobile-nav-panel open">' + NAV_LINKS.map(function(l){ return '<a href="'+l[0]+'" data-action="close-mobile-menu">'+l[1]+'</a>'; }).join("") + '</nav>' : '')
    + '</header>';
}
function renderHero(){
  var animCls = heroAnimatedOnce ? "" : " hero-animate";
  heroAnimatedOnce = true;
  var court = '<svg class="hero-court" viewBox="0 0 800 500" aria-hidden="true" focusable="false">'
    + '<rect x="40" y="40" width="720" height="420" fill="none" stroke="currentColor" stroke-width="3"/>'
    + '<line x1="40" y1="250" x2="760" y2="250" stroke="currentColor" stroke-width="5"/>'
    + '<line x1="400" y1="40" x2="400" y2="460" stroke="currentColor" stroke-width="2"/>'
    + '<line x1="40" y1="145" x2="760" y2="145" stroke="currentColor" stroke-width="2"/>'
    + '<line x1="40" y1="355" x2="760" y2="355" stroke="currentColor" stroke-width="2"/>'
    + '</svg>';
  return '<section class="hero'+animCls+'" id="inicio"><canvas class="hero-dots-canvas" aria-hidden="true"></canvas><span class="hero-num" aria-hidden="true">8</span>'

    + '<div class="hero-inner">'
    + '<p class="hero-eyebrow">Equipo 8 · Padel Club Alicante Indoor</p>'

    + '<p class="hero-brand-sub">Club</p>'
    + '<p class="hero-subtitle">Quinta Masculina</p>'
    + '<p class="hero-text">El circuito de pádel nacido del Equipo 8 en Padel Club Alicante Indoor. Fase de liga todos contra todos y después cuadros eliminatorios: sigue cada resultado en directo, en esta misma página.</p>'

    + '</div></section>';
}
function renderStats(){
  var i = STATE.info;
  return '<div class="section-inner"><div class="stats">'
    + statTile("Categoría", i.categoria, 14) + statTile("Sede", i.sede, 26)
    + statTile("Fechas", i.fechas || "Próximamente", 14) + statTile("Inscripción", i.plazo || "Próximamente", 26)
    + '</div></div>';
}
function statTile(label, value, speed){
  return '<div class="stat-tile fx-parallax" data-speed="'+speed+'"><div class="label">'+escHtml(label)+'</div><div class="value">'+escHtml(value)+'</div></div>';
}

function renderFormato(){
  return '<section id="formato" class="section"><div class="section-inner">'
    + '<span class="section-mark" aria-hidden="true">01</span>'
    + '<p class="eyebrow">Formato</p>'
    + '<div class="formato-steps">'
    +   '<div class="formato-card fx-reveal"><div class="step-num">FASE 1</div><h3>Liga</h3><p>Todas las parejas confirmadas se enfrentan entre sí una vez. Los puntos de cada partido dependen del resultado — mira la tabla de puntuación aquí abajo.</p></div>'
    +   '<div class="formato-card fx-reveal"><div class="step-num">FASE 2</div><h3>Cuadros</h3><p>Eliminación directa hasta la final. La composición del cuadro se publicará en cuanto termine la liga.</p></div>'
    + '</div>'
    + '<div class="rules-grid">'
    +   '<div class="rule-card fx-reveal"><h3>Puntuación por partido</h3><ul class="rule-list">'
    +     '<li><span>Ganas 2-0</span><strong>3 puntos</strong></li>'
    +     '<li><span>Ganas 2-1</span><strong>2 puntos</strong></li>'
    +     '<li><span>Pierdes 1-2</span><strong>1 punto</strong></li>'
    +     '<li><span>Pierdes 0-2</span><strong>0 puntos</strong></li>'
    +   '</ul></div>'
    +   '<div class="rule-card fx-reveal"><h3>Desempate a puntos</h3><ol class="rule-list rule-list--ordered">'
    +     '<li>Enfrentamiento directo entre las parejas empatadas</li>'
    +     '<li>Diferencia de sets (a favor menos en contra)</li>'
    +     '<li>Diferencia de juegos (a favor menos en contra)</li>'
    +   '</ol></div>'
    +   '<div class="rule-card fx-reveal"><h3>Reglas del partido</h3><ul class="rule-list rule-list--bullets">'
    +     '<li>Partidos al mejor de 3 sets</li>'
    +     '<li>Star Point: máximo dos ventajas seguidas; al tercer 40 iguales se decide con un único punto, y elige el lado de saque la pareja que resta</li>'
    +     '<li>Empate a 6 juegos (6-6) en un set: se decide con tie-break</li>'
    +   '</ul></div>'
    + '</div>'
    + '</div></section>'
    + renderCtaBand();
}
function renderCtaBand(){
  return '<div class="cta-band"><div class="cta-band-inner">'

}
function renderFAQ(){

      + (open ? '<div class="faq-a"><p>'+escHtml(f.a)+'</p></div>' : "")
      + '</div>';

/* ---------- player panel ---------- */
/* real accounts, one per pair (Firebase email/password) — created by claiming a pair
   with the one-time PIN the organizer hands out (see tryPlayerSignup). From inside the
   account the owner can generate a separate "companion PIN" (state/pairAccounts,
   owner-only field, rule-enforced) so their partner can get in on their own device
   without ever knowing the shared password — via anonymous auth, see tryCompanionLogin.
   Either way, submitting a result never writes straight into state/matches or
   state/bracket: it goes into the public "revisiones" collection as its own doc with
   estado:"pendiente" (plus a rate-limit stamp, see submitPlayerResult), and only an
   organizer's accept-revision/reject-revision action ever touches the real match data —
   mirroring exactly how the public inscripción form already works. */
function renderPlayerModal(){

    + '</div>';

  } else if (mode === "companion"){
    body = '<p>Si tu compañero/a ya tiene la cuenta creada, que te dé el PIN de acompañante desde su panel — entras con él, sin necesidad de su contraseña.</p>'
      + '<div class="field"><span>PIN de acompañante</span><input id="player-companion-pin" type="text" inputmode="numeric" maxlength="6" autocomplete="off"></div>'
      + errHtml
      + '<button class="btn btn-primary" style="margin-top:1rem;width:100%;justify-content:center;" data-action="try-companion-login" type="button"'+(ui.playerAuthBusy?" disabled":"")+'>'+(ui.playerAuthBusy?"Entrando…":"Entrar")+'</button>';
  } else if (mode === "reset"){
    body = '<button class="inline-link-btn" style="margin-bottom:1rem;" data-action="set-player-auth-mode" data-mode="login" type="button">← Volver a iniciar sesión</button>'
      + '<p>Escribe el email de la cuenta de vuestra pareja y os mandamos un enlace para elegir una contraseña nueva.</p>'
      + '<div class="field"><span>Email</span><input id="player-reset-email" type="email" autocomplete="off"></div>'
      + errHtml
      + (ui.playerResetMsg ? '<div class="status-banner">'+escHtml(ui.playerResetMsg)+'</div>' : "")
      + '<button class="btn btn-primary" style="margin-top:1rem;width:100%;justify-content:center;" data-action="try-player-reset" type="button"'+(ui.playerAuthBusy?" disabled":"")+'>'+(ui.playerAuthBusy?"Enviando…":"Enviar enlace")+'</button>';
  } else {
    body = '<p>Inicia sesión con la cuenta de vuestra pareja.</p>'
      + '<div class="field"><span>Email</span><input id="player-login-email" type="email" autocomplete="off"></div>'
      + passwordField("player-login-password", "Contraseña", "", "current-password")
      + errHtml
      + '<button class="btn btn-primary" style="margin-top:1rem;width:100%;justify-content:center;" data-action="try-player-login" type="button"'+(ui.playerAuthBusy?" disabled":"")+'>'+(ui.playerAuthBusy?"Entrando…":"Entrar")+'</button>'
      + '<button class="inline-link-btn" style="margin-top:.9rem;" data-action="set-player-auth-mode" data-mode="reset" type="button">¿Olvidaste la contraseña?</button>';
  }
  return '<div class="modal-overlay" data-modal="player"><div class="modal-panel modal-panel--login">'

function renderCompanionPinSection(pair){
  if (!ui.playerIsOwner) return "";

  var pin = acc && acc.companionPin;
  return '<div class="card" style="padding:1.2rem;margin-top:1.4rem;">'

    + (pin ? '<p style="font-family:var(--font-display);font-size:1.6rem;color:var(--signal);margin-bottom:.7rem;">'+escHtml(pin)+'</p>' : '<p style="color:var(--ink-faint);font-size:.85rem;margin-bottom:.7rem;">Todavía no has generado ninguno.</p>')
    + (ui.playerAuthError ? '<p class="login-error" style="margin-bottom:.7rem;">'+escHtml(ui.playerAuthError)+'</p>' : "")
    + '<button class="btn btn-outline btn-sm" data-action="generate-companion-pin" type="button">'+(pin?"Generar uno nuevo":"Generar PIN")+'</button>'
    + '</div>';

function renderPlayerDashboard(pair){
  var label = pair.j1 + " / " + pair.j2;
  var myLigaMatches = STATE.matches.filter(function(m){ return m.pairA===pair.id || m.pairB===pair.id; });
  var myBracketMatches = [];
  sortedRounds().forEach(function(r){
    (r.matches||[]).forEach(function(m){
      if (m.a === label || m.b === label) myBracketMatches.push({ round:r, match:m });
    });
  });
  function revisionFor(tipo, matchId){
    return STATE.revisiones.filter(function(rv){ return rv.pairId===pair.id && rv.tipo===tipo && rv.matchId===matchId; })
      .sort(function(a,b){ return (b.creadoEnMs||0) - (a.creadoEnMs||0); })[0] || null;
  }
  var ligaHtml = myLigaMatches.length
    ? myLigaMatches.map(function(m){
        var mySide = m.pairA===pair.id ? "a" : "b";
        var rival = pairLabel(mySide==="a" ? m.pairB : m.pairA);
        return renderPlayerMatchRow(mySide, "liga", m.id, null, "Jornada "+m.jornada, rival, m.sets, revisionFor("liga", m.id));
      }).join("")
    : '<p class="loading-note">Todavía no tenéis partidos de liga.</p>';
  var bracketHtml = myBracketMatches.map(function(o){
    var mySide = o.match.a === label ? "a" : "b";
    var rival = mySide==="a" ? o.match.b : o.match.a;
    return renderPlayerMatchRow(mySide, "cuadro", o.match.id, o.round.id, o.round.name, rival, o.match.sets, revisionFor("cuadro", o.match.id));
  }).join("");
  return '<div class="modal-overlay" data-modal="player"><div class="modal-panel">'
    + '<div class="modal-header"><h2>Hola, '+escHtml(pair.j1)+'</h2><button class="modal-close" data-action="close-player" type="button">✕</button></div>'
    + '<div class="modal-body">'
    + '<p style="color:var(--ink-soft);font-size:.9rem;">Pareja: <strong>'+escHtml(label)+'</strong>'+(ui.playerIsOwner?"":' <span class="badge" style="background:var(--signal-tint);color:var(--signal);">Acompañante</span>')+'</p>'
    + (ui.playerSubmitMsg ? '<div class="status-banner">'+escHtml(ui.playerSubmitMsg)+'</div>' : "")
    + '<h4 style="margin-top:1.2rem;">Liga</h4>' + ligaHtml
    + (myBracketMatches.length ? '<h4 style="margin-top:1.4rem;">Cuadros</h4>' + bracketHtml : "")
    + renderCompanionPinSection(pair)
    + '<button class="btn btn-ghost" style="margin-top:1.4rem;border-color:var(--border);color:var(--ink-faint);" data-action="player-logout" type="button">Cerrar sesión</button>'
    + '</div></div></div>';
}
function renderPlayerMatchRow(mySide, tipo, matchId, roundId, etiqueta, rival, sets, rev){
  sets = sets || [];
  var idBase = "pr-"+tipo+"-"+matchId;
  if (rev && rev.estado === "pendiente"){
    return '<div class="bracket-edit-row"><div class="bracket-edit-teams">'+escHtml(etiqueta)+' · vs '+escHtml(rival)+'</div>'
      + '<span class="badge badge--pending">Enviado, pendiente de revisión</span></div>';
  }
  var setsHtml = [1,2,3].map(function(n){
    var s = sets[n-1] || {};
    var meVal = s.a==null ? "" : (mySide==="a" ? s.a : s.b);
    var rivVal = s.a==null ? "" : (mySide==="a" ? s.b : s.a);
    return '<span class="bm-set-label">Set '+n+'</span>'
      + '<input class="bm-set-input" type="text" inputmode="numeric" maxlength="2" id="'+idBase+'-s'+n+'me" placeholder="Vos." value="'+meVal+'">'
      + '<span class="bm-set-sep">–</span>'
      + '<input class="bm-set-input" type="text" inputmode="numeric" maxlength="2" id="'+idBase+'-s'+n+'riv" placeholder="Riv." value="'+rivVal+'">';
  }).join("");
  return '<div class="bracket-edit-row">'
    + '<div class="bracket-edit-teams">'+escHtml(etiqueta)+' <span class="vs">vs</span> '+escHtml(rival)+'</div>'
    + (rev && rev.estado==="rechazada" ? '<p style="color:var(--danger);font-size:.8rem;margin-bottom:.5rem;">Vuestro envío anterior fue rechazado por el organizador — revisad el resultado y volved a enviarlo.</p>' : "")
    + '<div class="bracket-edit-sets">'+setsHtml+'</div>'
    + '<div class="bracket-edit-actions"><button class="btn btn-primary btn-sm" data-action="submit-player-result" data-tipo="'+tipo+'" data-id="'+matchId+'" data-round="'+(roundId||"")+'" type="button">Enviar resultado</button></div>'
    + '</div>';
}

function renderRequestRows(list, withActions){

/* ============================================================
   Scroll-driven fx engine
   Everything here is a pure function of the CURRENT scroll position,
   recomputed every frame while scrolling (rAF-throttled) — nothing is
   triggered once and left alone. Scroll up and every effect runs in
   reverse, exactly in step. Two kinds of elements are handled:
     .fx-reveal    — fades/rises/settles into place as it enters the
                     lower part of the viewport (optionally combined
                     with a per-element drift via data-speed)
     .fx-parallax  — pure differential drift, no fade, keyed off how
                     far the element's center sits from the viewport's
                     center (data-speed sets amplitude + direction)
     .hero         — scale/fade/drift as the user scrolls past it,
                     applied via the --hero-p custom property
   None of this checks prefers-reduced-motion: it's deliberately kept
   subtle (small amplitudes, no autoplay, nothing that moves without
   the visitor's own scroll input) so it plays the same for everyone. */
var fx = { hero:null, reveals:[], parallax:[], navLinks:[], navSections:[] };
var fxTicking = false;

function fxClamp01(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }

/* elements later in the same list/grid need a touch more scroll before they
   settle, so groups cascade in rather than popping in as one flat block —
   computed once per collectFx() call, not on every scroll frame */
function fxSiblingDelay(el){
  var group = el.parentElement;
  if (!group) return 0;
  var i = 0;
  for (var c = group.firstElementChild; c; c = c.nextElementSibling){
    if (c === el) return Math.min(i * 0.04, 0.16);
    if (c.classList && c.classList.contains("fx-reveal")) i++;
  }
  return 0;
}

function collectFx(){
  fx.hero = document.querySelector(".hero");
  fx.reveals = Array.prototype.slice.call(document.querySelectorAll(".fx-reveal"));
  fx.parallax = Array.prototype.slice.call(document.querySelectorAll(".fx-parallax"));
  fx.reveals.forEach(function(el){
    el.dataset.fxDelay = fxSiblingDelay(el);
  });
  fx.navLinks = Array.prototype.slice.call(document.querySelectorAll(".header-nav a"));
  fx.navSections = NAV_LINKS.map(function(l){ return { id:l[0], el:document.querySelector(l[0]) }; });
  heroDotsSetup();
  applyHeroNumHot();
  bracketDotsSetup();
  applyFx();
}

function applyFx(){
  var vh = window.innerHeight;
  /* mobile: same transformations, turned down — not a different, cut-down experience,
     just gentler amplitude so nothing feels janky on a small, often-scrolled-fast screen */
  var amp = window.innerWidth < 640 ? 0.55 : 1;
  document.documentElement.style.setProperty("--hero-amp", amp);

  var hp = 0;
  if (fx.hero){
    var heroTop = fx.hero.getBoundingClientRect().top;
    var heroH = fx.hero.offsetHeight || 1;
    hp = fxClamp01(-heroTop / (heroH * 0.9));
    document.documentElement.style.setProperty("--hero-p", hp.toFixed(4));
  }

  var revealStart = vh * 0.88, revealEnd = vh * 0.72;
  fx.reveals.forEach(function(el){
    var r = el.getBoundingClientRect();
    var delay = parseFloat(el.dataset.fxDelay) || 0;
    var p = fxClamp01((revealStart - r.top) / (revealStart - revealEnd) - delay);
    var speed = parseFloat(el.getAttribute("data-speed")) || 0;
    var drift = 0;
    if (speed){
      var center = r.top + r.height / 2;
      drift = ((vh / 2 - center) / vh) * speed * amp;
    }
    var tiltX = parseFloat(el.dataset.tiltX) || 0;
    var tiltY = parseFloat(el.dataset.tiltY) || 0;
    el.style.opacity = p;
    el.style.transform = "perspective(900px) translateY(" + ((1 - p) * 26 * amp + drift).toFixed(1) + "px) scale(" + (0.97 + p * 0.03).toFixed(3) + ")"
      + (tiltX || tiltY ? " rotateX(" + tiltX + "deg) rotateY(" + tiltY + "deg)" : "");
  });

  fx.parallax.forEach(function(el){
    var r = el.getBoundingClientRect();
    var speed = parseFloat(el.getAttribute("data-speed")) || 20;
    var d = ((vh / 2 - (r.top + r.height / 2)) / vh) * speed * amp;
    el.style.transform = "translateY(" + d.toFixed(1) + "px)";
  });

  var activeHref = null;
  fx.navSections.forEach(function(s){
    if (s.el && s.el.getBoundingClientRect().top <= 140) activeHref = s.id;
  });
  fx.navLinks.forEach(function(a){
    a.classList.toggle("active", a.getAttribute("href") === activeHref);
  });

  updateBackToTop();
  updateHeaderScrolled();
}

/* subtle cursor-reactive tilt on formato/rule cards — delegated on document so it
   keeps working after every mount() re-render without rebinding per card. The tilt
   angle is stashed on the element's dataset and folded into the same inline transform
   applyFx() already drives for every .fx-reveal element (that transform is set on
   every scroll frame and would otherwise stomp any transform set here separately).
   pointerleave doesn't bubble, but a capture-phase listener still sees it on the way
   down to the target, which is the standard trick for delegating enter/leave events. */
var tiltTicking = false;
function fxTiltApply(){ applyFx(); tiltTicking = false; }
function fxTiltMove(e){
  var card = e.target.closest && e.target.closest(".formato-card, .rule-card");
  if (!card) return;
  var r = card.getBoundingClientRect();
  var px = (e.clientX - r.left) / r.width - 0.5;
  var py = (e.clientY - r.top) / r.height - 0.5;
  card.dataset.tiltX = (py * -6).toFixed(2);
  card.dataset.tiltY = (px * 6).toFixed(2);
  if (!tiltTicking){ tiltTicking = true; requestAnimationFrame(fxTiltApply); }
}
function fxTiltLeave(e){
  var card = e.target.closest && e.target.closest(".formato-card, .rule-card");
  if (!card) return;
  card.dataset.tiltX = "0";
  card.dataset.tiltY = "0";
  if (!tiltTicking){ tiltTicking = true; requestAnimationFrame(fxTiltApply); }
}
document.addEventListener("pointermove", fxTiltMove);
document.addEventListener("pointerleave", fxTiltLeave, true);

/* custom cursor — the dot tracks the real pointer 1:1 (no rAF throttle: any lag here is
   immediately obvious, unlike the scroll effects), while the "clickable" state is
   delegated so it keeps working after every mount() re-render without rebinding. */
var cursorDotEl = document.getElementById("cursor-dot");
var CURSOR_CLICKABLE = "a, button, input, select, textarea, label";
if (cursorDotEl){
  document.addEventListener("pointermove", function(e){
    if (e.pointerType && e.pointerType !== "mouse") return;
    cursorDotEl.style.transform = "translate(" + e.clientX + "px," + e.clientY + "px)";
  });
  document.addEventListener("pointerover", function(e){
    if (e.target.closest && e.target.closest(CURSOR_CLICKABLE)) cursorDotEl.classList.add("is-active");
  });
  document.addEventListener("pointerout", function(e){
    var leavingClickable = e.target.closest && e.target.closest(CURSOR_CLICKABLE);
    var enteringClickable = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest(CURSOR_CLICKABLE);
    if (leavingClickable && !enteringClickable) cursorDotEl.classList.remove("is-active");
  });
}

/* ============================================================
   Hero halftone dots — a single canvas-drawn grid, not a CSS background layer plus a
   reactive overlay: the exact same dots that auto-drift also swell near the cursor, so
   nothing "new" appears, the existing ones just grow. Drift speed matches the old CSS
   haloDrift (160px every 16s, diagonally) and never stops; the swell is a large, very
   gently-falling-off radius on top of that, and the whole interactive effect itself
   fades in/out smoothly as the cursor enters/leaves the hero (heroDots.activeT) so nothing
   pops at the boundary either. The hero/canvas nodes are recreated on every mount() (they
   live inside #app), so heroDotsSetup() re-grabs them each time; only the rAF loop itself
   is started once, and its own timestamp drives the drift (frame-rate independent). */
var heroDots = { canvas:null, ctx:null, heroEl:null, w:0, h:0, dpr:1, mouseX:-9999, mouseY:-9999, smoothX:-9999, smoothY:-9999, inHero:false, activeT:0, driftX:0, driftY:0, lastT:null, raf:null };
var HERO_DOT_SPACING = 16;
var HERO_DOT_DRIFT_SPEED = 0.01; /* px/ms, each axis — 160px every 16000ms, same as the old CSS animation */
var HERO_DOT_HOVER_R = 260;

function heroDotsSetup(){
  var hero = document.querySelector(".hero");
  if (!hero) return;
  var canvas = hero.querySelector(".hero-dots-canvas");
  if (!canvas) return;
  var isNewCanvas = canvas !== heroDots.canvas;
  heroDots.heroEl = hero;
  heroDots.canvas = canvas;
  heroDots.ctx = canvas.getContext("2d");
  /* mount() replaces the hero/canvas DOM nodes on every re-render; a brand-new canvas
     always needs its backing buffer (re)sized even if its CSS dimensions happen to
     match the previous one's — a fresh <canvas> starts at the browser's 300x150
     default until we set .width/.height ourselves, regardless of how big it looks. */
  heroDotsResize(isNewCanvas);
  if (!heroDots.raf) heroDots.raf = requestAnimationFrame(heroDotsLoop);
}

function heroDotsResize(force){
  var hero = heroDots.heroEl, canvas = heroDots.canvas;
  if (!hero || !canvas) return;
  var r = hero.getBoundingClientRect();
  var w = Math.round(r.width), h = Math.round(r.height);
  if (!force && w === heroDots.w && h === heroDots.h) return;
  heroDots.w = w;
  heroDots.h = h;
  heroDots.dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = w * heroDots.dpr;
  canvas.height = h * heroDots.dpr;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  heroDots.ctx.setTransform(heroDots.dpr, 0, 0, heroDots.dpr, 0, 0);
}

function heroDotsDraw(now){
  var ctx = heroDots.ctx;
  if (!ctx) return;

  if (heroDots.lastT == null) heroDots.lastT = now;
  var dt = Math.min(now - heroDots.lastT, 100); /* clamp so a dropped/backgrounded frame can't jump the drift */
  heroDots.lastT = now;
  heroDots.driftX += dt * HERO_DOT_DRIFT_SPEED;
  heroDots.driftY += dt * HERO_DOT_DRIFT_SPEED;

  heroDots.activeT += ((heroDots.inHero ? 1 : 0) - heroDots.activeT) * 0.045;
  if (heroDots.activeT > 0.01){
    if (heroDots.smoothX < -900){ heroDots.smoothX = heroDots.mouseX; heroDots.smoothY = heroDots.mouseY; }
    heroDots.smoothX += (heroDots.mouseX - heroDots.smoothX) * 0.08;
    heroDots.smoothY += (heroDots.mouseY - heroDots.smoothY) * 0.08;
  }

  ctx.clearRect(0, 0, heroDots.w, heroDots.h);
  var phaseX = ((heroDots.driftX % HERO_DOT_SPACING) + HERO_DOT_SPACING) % HERO_DOT_SPACING;
  var phaseY = ((heroDots.driftY % HERO_DOT_SPACING) + HERO_DOT_SPACING) % HERO_DOT_SPACING;
  var active = heroDots.activeT > 0.01;
  var mx = heroDots.smoothX, my = heroDots.smoothY;
  ctx.fillStyle = "rgba(188,189,139,.55)";
  for (var y = phaseY - HERO_DOT_SPACING; y < heroDots.h + HERO_DOT_SPACING; y += HERO_DOT_SPACING){
    for (var x = phaseX - HERO_DOT_SPACING; x < heroDots.w + HERO_DOT_SPACING; x += HERO_DOT_SPACING){
      var r = 1.6;
      if (active){
        var d = Math.hypot(x - mx, y - my);
        if (d < HERO_DOT_HOVER_R){
          /* smoothstep — a soft, gradual rise with no hard edge at the boundary, spread
             across a wide radius so growth between neighbouring dots is barely
             distinguishable frame to frame */
          var t = 1 - d / HERO_DOT_HOVER_R;
          t = t * t * (3 - 2 * t);
          r = 1.6 + t * 5.2 * heroDots.activeT;
        }
      }
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function heroDotsLoop(now){
  /* no document.hidden gate here on purpose: the browser's own rAF scheduler already
     throttles background tabs for us, and gating on it ourselves risks the dots never
     drawing at all in a context where hidden reads true for reasons that have nothing to
     do with battery saving — since there's no CSS fallback layer any more, that would
     mean an empty hero background, which is worse than the CPU this loop actually costs. */
  heroDotsResize();
  heroDotsDraw(now);
  heroDots.raf = requestAnimationFrame(heroDotsLoop);
}
document.addEventListener("pointermove", function(e){
  if (e.pointerType && e.pointerType !== "mouse") return;
  if (!heroDots.heroEl) return;
  var r = heroDots.heroEl.getBoundingClientRect();
  heroDots.inHero = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  heroDots.mouseX = e.clientX - r.left;
  heroDots.mouseY = e.clientY - r.top;
});
window.addEventListener("resize", heroDotsResize);

/* the ghost "8" itself: no dots, just the same big translucent numeral as before,
   scaling up smoothly (CSS transition, not a per-frame loop) while the cursor sits over
   it. mount() replaces the element on every re-render (e.g. a Firestore snapshot while
   the visitor is mid-hover), which would silently drop the "is-hot" class along with the
   old node — lastPointerX/Y + applyHeroNumHot() re-derive and reapply it right after
   every mount, in collectFx(), so a background data refresh never resets the hover. */
var lastPointerX = -9999, lastPointerY = -9999;
function applyHeroNumHot(){
  var el = document.querySelector(".hero-num");
  if (!el) return;
  var r = el.getBoundingClientRect();
  var margin = 24;
  var hot = lastPointerX >= r.left - margin && lastPointerX <= r.right + margin && lastPointerY >= r.top - margin && lastPointerY <= r.bottom + margin;
  el.classList.toggle("is-hot", hot);
}
document.addEventListener("pointermove", function(e){
  if (e.pointerType && e.pointerType !== "mouse") return;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;
  applyHeroNumHot();
});

/* mobile swipe affordances for Cuadros: one dot per round tracking which "page" the
   bracket is scrolled to, and a hint line that fades out the moment the visitor actually
   swipes (no need to keep telling them once they've discovered it). Re-attached every
   mount() since .bracket is recreated along with the rest of #app each time. */
function bracketDotsSetup(){
  var bracket = document.querySelector(".bracket");
  var dotsWrap = document.querySelector(".bracket-dots");
  if (!bracket || !dotsWrap) return;
  var dots = Array.prototype.slice.call(dotsWrap.querySelectorAll(".bracket-dot"));
  var hint = document.querySelector(".bracket-swipe-hint");
  bracket.addEventListener("scroll", function(){
    var idx = Math.round(bracket.scrollLeft / (bracket.clientWidth || 1));
    dots.forEach(function(d, i){ d.classList.toggle("active", i === idx); });
    if (hint && bracket.scrollLeft > 8) hint.classList.add("seen");
  }, { passive:true });
}

function onScrollFx(){
  if (fxTicking) return;
  fxTicking = true;
  requestAnimationFrame(function(){ applyFx(); fxTicking = false; });
}
window.addEventListener("scroll", onScrollFx, { passive:true });
window.addEventListener("resize", onScrollFx);

function isValidContact(v){
  var emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  var phoneRe = /^(\+?\d{1,3}[\s-]?)?\d{9}$/;
  var digitsOnly = v.replace(/[\s-]/g, "");
  return emailRe.test(v.trim()) || phoneRe.test(digitsOnly);
}

function submitPlayerResult(tipo, matchId, roundId){
  var pair = ui.playerPairId ? pairById(ui.playerPairId) : null;
  if (!pair) return;
  if (!currentPlayerAuthUser){ alert("Tu sesión ha caducado. Vuelve a entrar."); playerLogout(); return; }
  var msSinceLast = Date.now() - ui.lastRevisionSubmitAt;
  if (ui.lastRevisionSubmitAt && msSinceLast < RATE_LIMIT_SECONDS * 1000){
    alert("Espera " + Math.ceil((RATE_LIMIT_SECONDS * 1000 - msSinceLast) / 1000) + " segundos antes de enviar otro resultado.");
    return;
  }
  var label = pair.j1 + " / " + pair.j2;
  var mySide, rivalLabel, jornada = null, m;
  if (tipo === "liga"){
    m = STATE.matches.filter(function(x){ return x.id===matchId; })[0];
    if (!m){ alert("No se encontró el partido."); return; }
    mySide = m.pairA === pair.id ? "a" : "b";
    rivalLabel = pairLabel(mySide==="a" ? m.pairB : m.pairA);
    jornada = m.jornada;
  } else {
    var round = STATE.bracket.filter(function(r){ return r.id===roundId; })[0];
    m = round ? round.matches.filter(function(x){ return x.id===matchId; })[0] : null;
    if (!m){ alert("No se encontró el partido."); return; }
    mySide = m.a === label ? "a" : "b";
    rivalLabel = mySide==="a" ? m.b : m.a;
  }
  var idBase = "pr-"+tipo+"-"+matchId;
  var sets = [];
  for (var n = 1; n <= 3; n++){
    var meVal = valOf(idBase+"-s"+n+"me"), rivVal = valOf(idBase+"-s"+n+"riv");
    if (meVal === "" && rivVal === "") break;
    var gm = parseInt(meVal, 10), gr = parseInt(rivVal, 10);
    if (meVal === "" || rivVal === "" || isNaN(gm) || isNaN(gr)){ alert("Revisa el set "+n+": falta algún marcador."); return; }
    sets.push(mySide==="a" ? { a:gm, b:gr } : { a:gr, b:gm });
  }
  if (!sets.length){ alert("Introduce al menos el resultado de un set."); return; }
  var btn = document.querySelector('[data-action="submit-player-result"][data-id="'+matchId+'"]');
  if (btn){ btn.disabled = true; btn.textContent = "Enviando…"; }
  /* the revisión and the rate-limit stamp are written in one batch: Firestore rules
     validate each write against the state as of the START of the batch, so the rule can
     check "was the *previous* rateLimits/{uid} write old enough" while this same batch
     both creates the revisión and refreshes that timestamp for next time. */
  var revRef = doc(collection(db, "revisiones"));
  var batch = writeBatch(db);
  batch.set(revRef, {
    tipo: tipo, matchId: matchId, roundId: roundId || null, jornada: jornada,
    pairId: pair.id, pairLabel: label, rivalLabel: rivalLabel,
    sets: sets, estado: "pendiente", uid: currentPlayerAuthUser.uid, creadoEn: serverTimestamp()
  });
  batch.set(doc(db, "rateLimits", currentPlayerAuthUser.uid), { lastAt: serverTimestamp() });
  batch.commit().then(function(){
    ui.lastRevisionSubmitAt = Date.now();
    ui.playerSubmitMsg = "Resultado enviado. El organizador lo revisará pronto.";
    mount();
  }).catch(function(err){
    alert(err && err.code === "permission-denied"
      ? "Estás enviando resultados demasiado rápido. Espera un momento e inténtalo de nuevo."
      : "No se pudo enviar. Comprueba tu conexión e inténtalo de nuevo.");
    if (btn){ btn.disabled = false; btn.textContent = "Enviar resultado"; }
  });
}
function acceptRevision(id){
  var r = STATE.revisiones.filter(function(x){ return x.id===id; })[0];
  if (!r) return;
  if (r.tipo === "liga"){
    var m = STATE.matches.filter(function(x){ return x.id===r.matchId; })[0];
    if (!m){ alert("No se encontró el partido de liga (puede que se haya eliminado)."); return; }
    m.sets = r.sets;
    m.marcador = r.sets.map(function(s){ return s.a + "-" + s.b; }).join(", ");
    m.setsA = r.sets.filter(function(s){ return s.a > s.b; }).length;
    m.setsB = r.sets.filter(function(s){ return s.b > s.a; }).length;
    m.played = true;
    saveStateDoc("matches", { list: STATE.matches });
  } else {
    var round = STATE.bracket.filter(function(x){ return x.id===r.roundId; })[0];
    var bm = round ? round.matches.filter(function(x){ return x.id===r.matchId; })[0] : null;
    if (!bm){ alert("No se encontró el partido del cuadro (puede que se haya eliminado)."); return; }
    bm.sets = r.sets;
    bm.resultado = r.sets.map(function(s){ return s.a + "-" + s.b; }).join(" / ");
    var winsA = r.sets.filter(function(s){ return s.a > s.b; }).length;
    var winsB = r.sets.filter(function(s){ return s.b > s.a; }).length;
    bm.ganador = winsA > winsB ? bm.a : winsB > winsA ? bm.b : "";
    saveStateDoc("bracket", { rounds: STATE.bracket });
  }
  updateDoc(doc(db, "revisiones", id), { estado: "aceptada" });
}

function generateFixture(){
  var confirmedPairs = STATE.pairs.filter(function(p){ return p.confirmed; });
  if (confirmedPairs.length < 2){ alert("Necesitas al menos 2 parejas confirmadas."); return; }
  if (STATE.matches.length && !confirm("Ya existe un calendario. Si lo regeneras se perderán los resultados introducidos. ¿Continuar?")) return;
  var rounds = generateRoundRobin(confirmedPairs);
  var matches = [];
  rounds.forEach(function(roundPairs, idx){
    roundPairs.forEach(function(pair){
      matches.push({ id: uid("m"), jornada: idx+1, pairA: pair[0], pairB: pair[1], setsA:null, setsB:null, marcador:"", played:false });
    });
  });
  STATE.matches = matches;
  saveStateDoc("matches", { list: STATE.matches });
}
function saveMatch(id){
  var m = STATE.matches.filter(function(x){ return x.id===id; })[0];
  if (!m) return;
  var sets = [];
  for (var n = 1; n <= 3; n++){
    var a = valOf("match-s"+n+"a-"+id), b = valOf("match-s"+n+"b-"+id);
    if (a === "" && b === "") break;
    var ga = parseInt(a, 10), gb = parseInt(b, 10);
    if (a === "" || b === "" || isNaN(ga) || isNaN(gb)){ alert("Revisa el set "+n+": falta el marcador de una de las parejas."); return; }
    sets.push({ a: ga, b: gb });
  }
  m.sets = sets;
  m.marcador = sets.map(function(s){ return s.a + "-" + s.b; }).join(", ");
  if (sets.length){
    m.setsA = sets.filter(function(s){ return s.a > s.b; }).length;
    m.setsB = sets.filter(function(s){ return s.b > s.a; }).length;
    m.played = true;
  } else {
    m.setsA = null; m.setsB = null; m.played = false;
  }
  saveStateDoc("matches", { list: STATE.matches });
}
function saveInfo(){
  STATE.info.fechas = valOf("info-fechas"); STATE.info.precio = valOf("info-precio");
  STATE.info.plazo = valOf("info-plazo"); STATE.info.contacto = valOf("info-contacto") || CONTACT_EMAIL;
  saveStateDoc("info", STATE.info);
}
function addRound(){
  var name = valOf("new-round-name");
  if (!name){ alert("Ponle un nombre a la ronda (ej. Cuartos de final)."); return; }
  STATE.bracket.push({ id: uid("r"), name:name, matches:[] });
  saveStateDoc("bracket", { rounds: STATE.bracket });
}
function deleteRound(id){
  if (!confirm("¿Eliminar esta ronda y sus partidos?")) return;
  STATE.bracket = STATE.bracket.filter(function(r){ return r.id!==id; });
  saveStateDoc("bracket", { rounds: STATE.bracket });
}
function bracketSideLabel(roundId, side){
  var tbd = document.getElementById("new-bm-"+side+"-tbd-"+roundId);
  if (tbd && tbd.checked) return "Por definir";
  var j1 = valOf("new-bm-"+side+"1-"+roundId), j2 = valOf("new-bm-"+side+"2-"+roundId);
  if (!j1 || !j2) return null;
  return j1 + " / " + j2;
}
/* splits a stored "Nombre1 / Nombre2" (or "Por definir") label back into its two
   player fields, so an existing match can be edited the same jugador-by-jugador way
   it was created, instead of as one free-text string */
function splitPairLabel(label){
  if (label === "Por definir") return { j1:"", j2:"", tbd:true };
  var parts = String(label || "").split(" / ");
  return { j1: parts[0] || "", j2: parts[1] || "", tbd:false };
}
function bracketEditSideFields(m, side, label){
  var parts = splitPairLabel(side === "a" ? m.a : m.b);
  var idBase = "bm-edit-"+side+"-"+m.id;
  return '<div class="field"><span>'+escHtml(label)+' · Jugador 1</span><input id="'+idBase+'-j1" type="text" value="'+escHtml(parts.j1)+'"></div>'
    + '<div class="field"><span>'+escHtml(label)+' · Jugador 2</span><input id="'+idBase+'-j2" type="text" value="'+escHtml(parts.j2)+'"></div>'
    + '<label class="bm-tbd-check"><input type="checkbox" id="'+idBase+'-tbd"'+(parts.tbd ? " checked" : "")+'>Por definir</label>';
}
function bracketEditSideLabel(matchId, side){
  var idBase = "bm-edit-"+side+"-"+matchId;
  var tbd = document.getElementById(idBase+"-tbd");
  if (tbd && tbd.checked) return "Por definir";
  var j1 = valOf(idBase+"-j1"), j2 = valOf(idBase+"-j2");
  if (!j1 || !j2) return null;
  return j1 + " / " + j2;
}
function addBracketMatch(roundId){
  var round = STATE.bracket.filter(function(r){ return r.id===roundId; })[0];
  if (!round) return;
  var a = bracketSideLabel(roundId, "a"), b = bracketSideLabel(roundId, "b");
  if (!a || !b){ alert("Escribe los dos jugadores de cada pareja, o marca \"Por definir\" en la que todavía no se sepa."); return; }
  round.matches.push({ id: uid("bm"), a:a, b:b, resultado:"", ganador:"" });
  saveStateDoc("bracket", { rounds: STATE.bracket });
}
function deleteBracketMatch(roundId, matchId){
  var round = STATE.bracket.filter(function(r){ return r.id===roundId; })[0];
  if (!round) return;
  round.matches = round.matches.filter(function(m){ return m.id!==matchId; });
  saveStateDoc("bracket", { rounds: STATE.bracket });
}
function saveBracketMatch(roundId, matchId){
  var round = STATE.bracket.filter(function(r){ return r.id===roundId; })[0];
  if (!round) return;
  var m = round.matches.filter(function(x){ return x.id===matchId; })[0];
  if (!m) return;
  var newA = bracketEditSideLabel(matchId, "a"), newB = bracketEditSideLabel(matchId, "b");
  if (!newA || !newB){ alert("Escribe los dos jugadores de cada pareja, o marca \"Por definir\" en la que todavía no se sepa."); return; }
  var sets = [];
  for (var n = 1; n <= 3; n++){
    var a = valOf("bm-"+matchId+"-s"+n+"a"), b = valOf("bm-"+matchId+"-s"+n+"b");
    if (a === "" && b === "") break;
    var ga = parseInt(a, 10), gb = parseInt(b, 10);
    if (a === "" || b === "" || isNaN(ga) || isNaN(gb)){ alert("Revisa el set "+n+": falta el marcador de una de las parejas."); return; }
    sets.push({ a: ga, b: gb });
  }
  /* the winner <select>'s value is still the OLD label text (options are rendered from
     the match as it was before this edit) — re-map it onto the new label so renaming a
     pair doesn't silently clear or misattribute an already-recorded win */
  var sel = document.getElementById("bm-ganador-"+matchId);
  var selVal = sel ? sel.value : "";
  var ganador = selVal === "" ? "" : selVal === m.a ? newA : selVal === m.b ? newB : "";
  m.a = newA;
  m.b = newB;
  m.sets = sets;
  m.resultado = sets.map(function(s){ return s.a + "-" + s.b; }).join(" / ");
  m.ganador = ganador;
  saveStateDoc("bracket", { rounds: STATE.bracket });
}
function addFaq(){
  var q = valOf("new-faq-q"), a = valOf("new-faq-a");
  if (!q || !a){ alert("Escribe la pregunta y la respuesta."); return; }
  STATE.faqs.push({ id: uid("f"), q:q, a:a });
  saveStateDoc("faqs", { list: STATE.faqs });
}
function saveFaq(id){
  var f = STATE.faqs.filter(function(x){ return x.id===id; })[0];
  if (!f) return;
  var q = valOf("faq-q-"+id), a = valOf("faq-a-"+id);
  if (!q || !a){ alert("La pregunta y la respuesta no pueden quedar vacías."); return; }
  f.q = q; f.a = a;
  saveStateDoc("faqs", { list: STATE.faqs });
}
function askDeleteFaq(id){ ui.faqDeleteConfirm = id; mount(); }
function cancelDeleteFaq(){ ui.faqDeleteConfirm = null; mount(); }
function deleteFaq(id){
  ui.faqDeleteConfirm = null;
  STATE.faqs = STATE.faqs.filter(function(f){ return f.id!==id; });
  saveStateDoc("faqs", { list: STATE.faqs });
}
function acceptRequest(id){
  var r = STATE.inscripciones.filter(function(x){ return x.id===id; })[0];
  if (!r) return;
  STATE.pairs.push({ id: uid("p"), j1:r.j1, j2:r.j2, contacto:r.contacto, confirmed:true });
  setSaving("Guardando…");
  Promise.all([
    setDoc(doc(db,"state","pairs"), { list: STATE.pairs }),
    updateDoc(doc(db,"inscripciones", id), { status: "accepted" })
  ]).then(function(){
    setSaveResult(true, "Pareja añadida y solicitud aceptada ✓");
  }).catch(function(){
    setSaveResult(false, "No se pudo aceptar la solicitud. Inténtalo de nuevo.");
  });
}
function askClearHistory(){ ui.clearHistoryConfirm = true; mount(); }
function cancelClearHistory(){ ui.clearHistoryConfirm = false; mount(); }
function clearHistory(){
  var historial = STATE.inscripciones.filter(function(r){ return r.status!=="pending"; });
  ui.clearHistoryConfirm = false;
  if (!historial.length) return;
  setSaving("Vaciando historial…");
  Promise.all(historial.map(function(r){ return deleteDoc(doc(db,"inscripciones", r.id)); }))
    .then(function(){ setSaveResult(true, "Historial vaciado ✓"); })
    .catch(function(err){ setSaveResult(false, "No se pudo vaciar el historial (" + (err && err.code || "error") + "). Inténtalo de nuevo."); });
}
function rejectRequest(id){
  if (!confirm("¿Rechazar esta solicitud?")) return;
  setSaving("Guardando…");
  updateDoc(doc(db,"inscripciones", id), { status: "rejected" }).then(function(){
    setSaveResult(true, "Solicitud rechazada.");
  }).catch(function(){
    setSaveResult(false, "No se pudo actualizar. Inténtalo de nuevo.");
  });
}

/* ---------- events ---------- */
document.addEventListener("click", function(e){
  if (e.target.classList && e.target.classList.contains("modal-overlay")){
    if (e.target.getAttribute("data-modal") === "player") closePlayerModal(); else closeOrganizer();
    return;
  }
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var action = el.getAttribute("data-action");
  var id = el.getAttribute("data-id");
  switch(action){
    case "open-organizer": openOrganizer(); break;
    case "close-organizer": closeOrganizer(); break;
    case "try-login": tryLogin(); break;
    case "relock": relock(); break;
    case "set-tab": setTab(el.getAttribute("data-tab")); break;
    case "set-solicitudes-subtab": setSolicitudesSubtab(el.getAttribute("data-subtab")); break;
    case "ask-clear-history": askClearHistory(); break;
    case "confirm-clear-history": clearHistory(); break;
    case "cancel-clear-history": cancelClearHistory(); break;
    case "toggle-mobile-menu": toggleMobileMenu(); break;
    case "close-mobile-menu":
      e.preventDefault();
      var targetHref = el.getAttribute("href");
      closeMobileMenu();
      if (targetHref && targetHref.charAt(0)==="#"){
        setTimeout(function(){ var t=document.getElementById(targetHref.slice(1)); if (t) t.scrollIntoView({behavior:"smooth",block:"start"}); }, 60);
      }
      break;
    case "add-pair": addPair(); break;
    case "delete-pair": deletePair(id); break;
    case "toggle-confirmed": toggleConfirmed(id); break;
    case "generate-fixture": generateFixture(); break;
    case "save-match": saveMatch(id); break;
    case "save-info": saveInfo(); break;
    case "add-round": addRound(); break;
    case "delete-round": deleteRound(id); break;
    case "add-bracket-match": addBracketMatch(id); break;
    case "delete-bracket-match": deleteBracketMatch(el.getAttribute("data-round"), id); break;
    case "save-bracket-match": saveBracketMatch(el.getAttribute("data-round"), id); break;
    case "accept-request": acceptRequest(id); break;
    case "reject-request": rejectRequest(id); break;
    case "toggle-faq": toggleFaq(id); break;
    case "add-faq": addFaq(); break;
    case "save-faq": saveFaq(id); break;
    case "delete-faq": askDeleteFaq(id); break;
    case "confirm-delete-faq": deleteFaq(id); break;
    case "cancel-delete-faq": cancelDeleteFaq(); break;
    case "open-player": openPlayerModal(); break;
    case "close-player": closePlayerModal(); break;
    case "set-player-auth-mode": setPlayerAuthMode(el.getAttribute("data-mode")); break;
    case "try-player-login": tryPlayerLogin(); break;
    case "try-player-signup": tryPlayerSignup(); break;
    case "try-player-reset": tryPlayerResetPassword(); break;
    case "try-companion-login": tryCompanionLogin(); break;
    case "generate-companion-pin": generateCompanionPin(); break;
    case "player-logout": playerLogout(); break;
    case "submit-player-result": submitPlayerResult(el.getAttribute("data-tipo"), id, el.getAttribute("data-round") || null); break;
    case "accept-revision": acceptRevision(id); break;
    case "reject-revision": rejectRevision(id); break;
    case "regenerate-pin": regeneratePin(id); break;
    case "org-generate-companion-pin": orgGenerateCompanionPin(id); break;
  }
});
document.addEventListener("keydown", function(e){
  if (e.key !== "Enter" || !e.target || !e.target.id) return;
  switch (e.target.id){
    case "login-password-input": tryLogin(); break;
    case "player-login-password": tryPlayerLogin(); break;
    case "player-signup-password": tryPlayerSignup(); break;
    case "player-companion-pin": tryCompanionLogin(); break;
    case "player-reset-email": tryPlayerResetPassword(); break;
  }
});
document.addEventListener("click", function(e){
  var toggle = e.target.closest(".password-toggle");
  if (!toggle) return;
  var input = document.getElementById(toggle.getAttribute("data-target"));
  if (!input) return;
  var nowShowing = input.type === "password";
  input.type = nowShowing ? "text" : "password";
  toggle.textContent = nowShowing ? "Ocultar" : "Ver";
});

/* ---------- realtime subscriptions ---------- */
onSnapshot(doc(db,"state","info"), function(snap){
  if (snap.exists()) STATE.info = Object.assign({}, STATE.info, snap.data());
  STATE.loaded.info = true; mount();
}, function(){ STATE.loaded.info = true; mount(); });

onSnapshot(doc(db,"state","pairs"), function(snap){
  STATE.pairs = (snap.exists() && snap.data().list) || [];
  STATE.loaded.pairs = true; mount();
}, function(){ STATE.loaded.pairs = true; mount(); });

onSnapshot(doc(db,"state","matches"), function(snap){
  STATE.matches = (snap.exists() && snap.data().list) || [];
  STATE.loaded.matches = true; mount();
}, function(){ STATE.loaded.matches = true; mount(); });

onSnapshot(doc(db,"state","bracket"), function(snap){
  STATE.bracket = (snap.exists() && snap.data().rounds) || [];
  STATE.loaded.bracket = true; mount();
}, function(){ STATE.loaded.bracket = true; mount(); });

onSnapshot(doc(db,"state","faqs"), function(snap){
  if (snap.exists() && snap.data().list && snap.data().list.length) STATE.faqs = snap.data().list;
  STATE.loaded.faqs = true; mount();
}, function(){ STATE.loaded.faqs = true; mount(); });

/* public collection (like inscripciones' writes): anyone can create a revisión, but only
   the organizer can accept/reject one — see acceptRevision/rejectRevision. Read publicly
   (unlike inscripciones) so a logged-in player can see their own submission's status
   without needing organizer auth; a revisión never holds anything more sensitive than a
   set score, so that's a safe trade. */
onSnapshot(collection(db, "revisiones"), function(qs){
  STATE.revisiones = qs.docs.map(function(d){
    var data = d.data();
    return Object.assign({ id: d.id }, data, { creadoEnMs: data.creadoEn && data.creadoEn.toMillis ? data.creadoEn.toMillis() : 0 });
  });
  STATE.loaded.revisiones = true; mount();
}, function(){ STATE.loaded.revisiones = true; mount(); });

/* pairId -> {ownerUid, companionPin} — public read (companion login needs to look up a
   pair by its companionPin without being signed in yet), but write is rule-restricted to
   the pair's own ownerUid (see the Firestore rules handed over separately). This is what
   lets resolveOwnerPair() figure out "which pair does this logged-in account belong to"
   on every load, independent of the state/pairs document itself. */
onSnapshot(collection(db, "pairAccounts"), function(qs){
  STATE.pairAccounts = qs.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
  STATE.loaded.pairAccounts = true;
  resolveOwnerPair();
  mount();
}, function(){ STATE.loaded.pairAccounts = true; mount(); });

onAuthStateChanged(auth, function(user){
  ui.unlocked = !!(user && user.email === ADMIN_EMAIL);
  currentPlayerAuthUser = (user && user.email !== ADMIN_EMAIL) ? user : null;
  resolveOwnerPair();
  if (ui.unlocked && !inscripcionesUnsub){
    inscripcionesUnsub = onSnapshot(collection(db, "inscripciones"), function(qs){
      STATE.inscripciones = qs.docs.map(function(d){
        var data = d.data();
        return { id: d.id, j1: data.j1, j2: data.j2, contacto: data.contacto, status: data.status || "pending",
          submittedAtMs: data.submittedAt && data.submittedAt.toMillis ? data.submittedAt.toMillis() : 0 };
      });
      STATE.loaded.inscripciones = true; mount();
    });
  } else if (!ui.unlocked && inscripcionesUnsub){
    inscripcionesUnsub(); inscripcionesUnsub = null;
    STATE.inscripciones = []; STATE.loaded.inscripciones = false;
  }
  mount();
});

/* ---------- back to top ---------- */
var backToTopBtn = document.getElementById("back-to-top");
function updateBackToTop(){
  if (!backToTopBtn) return;
  backToTopBtn.classList.toggle("visible", window.scrollY > 600 && !ui.modalOpen);
}
/* header starts transparent over the hero and becomes a floating pill once scrolled,
   matching caldera.xyz's own nav behavior */
function updateHeaderScrolled(){
  var header = document.querySelector(".site-header");
  if (header) header.classList.toggle("is-scrolled", window.scrollY > 40);
}
if (backToTopBtn){
  backToTopBtn.addEventListener("click", function(){
    window.scrollTo({ top:0, behavior:"smooth" });
  });
}

mount();
</script>
