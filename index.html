/* ---------- player identity ----------
   Each player slot of a pair carries a stable id (pair.j1Id / pair.j2Id, added by
   planIdMigration — never changed afterwards). The name a pair was created with
   (pair.j1/j2 in state/pairs) is never rewritten either; a pair can choose a new display
   name from its own panel, stored in pairContacts/{pairId}.j1/j2 (see savePlayerContact),
   and that's what every screen shows. The ranking groups by id, so a rename keeps the
   whole history under the new name. The SAME person can appear in several pairs (another
   torneo, another partner): the migration gives every slot with the same slugified name
   the same id, which is exactly how the ranking already merged them by name — so
   assigning ids changes nobody's numbers. */
function pairOriginalLabel(p){ return p.j1 + " / " + p.j2; }
function overrideMs(o){ return (o && o.actualizadoEnMs) || 0; }
/* the newest name chosen for this player id from any pair that contains it */
function playerOverrideName(playerId){
  if (!playerId) return null;
  var best = null, bestMs = -1;
  STATE.pairs.forEach(function(p){
    var o = STATE.pairContacts[p.id];
    if (!o) return;
    [1,2].forEach(function(n){
      var v = o["j"+n];
      if (p["j"+n+"Id"] === playerId && typeof v === "string" && v.trim() && overrideMs(o) > bestMs){ best = v.trim(); bestMs = overrideMs(o); }
    });
  });
  return best;
}
/* display name of a pair's player n (1|2) */
function pairPlayerName(p, n){
  var id = p["j"+n+"Id"];
  if (id){ var o = playerOverrideName(id); if (o) return o; }
  else {
    var own = STATE.pairContacts[p.id];
    if (own && typeof own["j"+n] === "string" && own["j"+n].trim()) return own["j"+n].trim();
  }
  return p["j"+n];
}
function pairDisplayLabel(p){ return pairPlayerName(p, 1) + " / " + pairPlayerName(p, 2); }
/* a cuadros side as it should be shown: the stored text exactly as it was played, unless
   that side carries player ids and one of those players has since chosen a new name */
function bracketSideDisplay(m, side){
  var text = m[side], ids = m[side+"Ids"];
  if (!Array.isArray(ids) || ids.length !== 2) return text;
  var o1 = playerOverrideName(ids[0]), o2 = playerOverrideName(ids[1]);
  if (!o1 && !o2) return text;
  var parts = splitPairLabel(text);
  return (o1 || parts.j1) + " / " + (o2 || parts.j2);
}
/* which side of a cuadros match this pair is on: by player ids when the side has them,
   otherwise by the label text (the way it always worked) */
function bracketSideOfPair(bm, pair){
  function sameIds(ids){
    return Array.isArray(ids) && ids.length === 2 && pair.j1Id && pair.j2Id
      && ((ids[0] === pair.j1Id && ids[1] === pair.j2Id) || (ids[0] === pair.j2Id && ids[1] === pair.j1Id));
  }
  if (sameIds(bm.aIds)) return "a";
  if (sameIds(bm.bIds)) return "b";
  var labels = [pairOriginalLabel(pair), pairDisplayLabel(pair)];
  if (!Array.isArray(bm.aIds) && labels.indexOf(bm.a) !== -1) return "a";
  if (!Array.isArray(bm.bIds) && labels.indexOf(bm.b) !== -1) return "b";
  return null;
}
/* slug of a pair's ORIGINAL name → player id. Used for cuadros sides that couldn't be
   tied to a pair (a partnership that never existed as a liga pair, say): their names
   still resolve to the same player the ranking merged them with before ids existed. */
function playerIdsBySlug(){
  var map = {};
  STATE.pairs.forEach(function(p){
    [1,2].forEach(function(n){
      var id = p["j"+n+"Id"], s = slugifyName(p["j"+n]);
      if (id && s && !map[s]) map[s] = id;
    });
  });
  return map;
}
/* ranking participants of one result side: [{key, name}] — key is the player id when
   known, else the slugified name (exactly the pre-id behaviour) */
function ligaSidePlayers(p){
  return [1,2].map(function(n){
    return { key: p["j"+n+"Id"] || slugifyName(p["j"+n]), name: pairPlayerName(p, n), alias: slugifyName(p["j"+n]) };
  });
}
function ligaMatchPlayerKeys(m){
  return ligaSidePlayers(pairById(m.pairA)).concat(ligaSidePlayers(pairById(m.pairB))).map(function(p){ return p.key; });
}
function bracketSidePlayers(m, side, idsBySlug){
  var parts = splitPairLabel(m[side]), ids = m[side+"Ids"];
  return [parts.j1, parts.j2].map(function(raw, i){
    var key = (Array.isArray(ids) && ids.length === 2 && ids[i]) || idsBySlug[slugifyName(raw)] || slugifyName(raw);
    return { key: key, name: playerOverrideName(key) || raw, alias: slugifyName(raw) };
  });
}
/* id for a brand-new pair's player: reuse the id of a player already known under that
   name (current display name first, then original), same merging rule as the migration */
function playerIdForNewName(name){
  var s = slugifyName(name);
  if (!s) return uid("pl");
  for (var i = 0; i < STATE.pairs.length; i++){
    var p = STATE.pairs[i];
    for (var n = 1; n <= 2; n++){ if (p["j"+n+"Id"] && slugifyName(pairPlayerName(p, n)) === s) return p["j"+n+"Id"]; }
  }
  return playerIdsBySlug()[s] || uid("pl");
}
/* the cuadros ids for a typed "Nombre1 / Nombre2" label: only when exactly one pair has
   that label (current or original) and that pair already has its ids — never a guess */
function resolveLabelIds(label){
  if (!label || label === "Por definir") return null;
  return uniqueIdsOf(STATE.pairs.filter(function(p){ return pairOriginalLabel(p) === label || pairDisplayLabel(p) === label; }));
}
/* the [j1Id, j2Id] shared by every pair in `hits`, or null when there are none, one of
   them has no ids yet, or they're genuinely different players. Two pairs with the very
   same two names (the same couple signed up again for another torneo) carry the same
   ids — see planIdMigration — so they don't count as ambiguous. */
function uniqueIdsOf(hits){
  if (!hits.length) return null;
  var sigs = {};
  for (var i = 0; i < hits.length; i++){
    if (!hits[i].j1Id || !hits[i].j2Id) return null;
    sigs[hits[i].j1Id + "|" + hits[i].j2Id] = [hits[i].j1Id, hits[i].j2Id];
  }
  var keys = Object.keys(sigs);
  return keys.length === 1 ? sigs[keys[0]] : null;
}
/* additive id migration, pure (reads STATE, returns what to write): j1Id/j2Id for pairs
   missing them, aIds/bIds for cuadros sides that match exactly one pair by its exact
   original label. Nothing existing is changed — new objects only gain the new fields,
   untouched ones are returned as the very same objects. */
function planIdMigration(){
  var bySlug = playerIdsBySlug();
  var pairsChanged = 0;
  var pairs = STATE.pairs.map(function(p){
    if (p.j1Id && p.j2Id) return p;
    var add = {};
    [1,2].forEach(function(n){
      var f = "j"+n+"Id";
      if (p[f]) return;
      var s = slugifyName(p["j"+n]);
      var id = (s && bySlug[s]) || uid("pl");
      if (s && !bySlug[s]) bySlug[s] = id;
      add[f] = id;
    });
    pairsChanged++;
    return Object.assign({}, p, add);
  });
  var byLabel = {};
  pairs.forEach(function(p){ var l = pairOriginalLabel(p); (byLabel[l] = byLabel[l] || []).push(p); });
  var sidesResolved = 0, unresolved = [];
  var rounds = STATE.bracket.map(function(r){
    var changed = false;
    var matches = (r.matches || []).map(function(m){
      var add = {};
      ["a","b"].forEach(function(side){
        if (Array.isArray(m[side+"Ids"])) return;
        if (m[side] === "Por definir") return;
        var ids = uniqueIdsOf(byLabel[m[side]] || []);
        if (ids){ add[side+"Ids"] = ids; sidesResolved++; }
        else unresolved.push({ torneo: roundTorneo(r), ronda: r.name, texto: m[side], motivo: (byLabel[m[side]] || []).length ? "varias parejas distintas con ese nombre" : "ninguna pareja actual se llama así" });
      });
      if (!Object.keys(add).length) return m;
      changed = true;
      return Object.assign({}, m, add);
    });
    return changed ? Object.assign({}, r, { matches: matches }) : r;
  });
  return { pairs: pairs, pairsChanged: pairsChanged, rounds: rounds, sidesResolved: sidesResolved, unresolved: unresolved };
}

/* Rounds display in bracket-logical order (earliest stage → final) no matter what order
   the organizer created them in — ranked by keyword in the round's name, most-specific
   stage names checked first since e.g. "semifinal"/"cuartos de final" both contain the
   substring "final" too. Unrecognized names rank first (0) and keep their relative
   creation order via the index tiebreak, so a stable custom name like "Grupo A" doesn't
   get shuffled around by the sort. */
function bracketRoundRank(name){
  var n = String(name || "").toLowerCase();
  if (n.indexOf("semifinal") !== -1) return 90;
  if (n.indexOf("cuartos") !== -1) return 80;
  if (n.indexOf("octavos") !== -1) return 70;
  if (n.indexOf("dieciseisavos") !== -1) return 60;
  if (n.indexOf("treintaidosavos") !== -1) return 50;
  if (n.indexOf("final") !== -1) return 100;
  return 0;
}
function sortedRounds(){
  return STATE.bracket.map(function(r, i){ return { r:r, i:i }; })
    .sort(function(x, y){
      var d = bracketRoundRank(x.r.name) - bracketRoundRank(y.r.name);
      return d !== 0 ? d : x.i - y.i;
    })
    .map(function(o){ return o.r; });
}
/* rounds created before this feature existed have no torneo field at all — rather than
   a data migration, they just read as "Summer Series" (the one the organizer actually
   said this history belongs to) everywhere a torneo name is needed. Anything created
   from here on always gets an explicit one (see addRound/generateBracketFromStandings),
   so this fallback only ever applies to that pre-existing data. */
function roundTorneo(r){ return (r && r.torneo) || "Summer Series"; }
/* distinct torneo names across the whole bracket, most-recently-used first (rounds are
   appended over time, so scanning from the end and keeping first-seen order surfaces
   "whatever tournament is being played right now" before older, finished ones) — this
   is what picks the default selection in both the public Cuadros section and the admin
   tab's grouping. */
function distinctTorneos(){
  var seen = [];
  for (var i = STATE.bracket.length - 1; i >= 0; i--){
    var t = roundTorneo(STATE.bracket[i]);
    if (seen.indexOf(t) === -1) seen.push(t);
  }
  return seen;
}

function generateRoundRobin(pairs){
  var ids = pairs.map(function(p){ return p.id; });
  if (ids.length % 2 !== 0) ids.push(null);
  var n = ids.length;
  if (n < 2) return [];
  var rounds = []; var arr = ids.slice();
  for (var r=0;r<n-1;r++){
    var roundPairs = [];
    for (var i=0;i<n/2;i++){
      var a = arr[i], b = arr[n-1-i];
      if (a!==null && b!==null) roundPairs.push([a,b]);
    }
    rounds.push(roundPairs);
    var fixed = arr[0]; var rest = arr.slice(1); rest.unshift(rest.pop());
    arr = [fixed].concat(rest);
  }
  return rounds;
}
function matchPoints(setsA, setsB){
  var diff = Math.abs(setsA - setsB);
  var winPts = diff >= 2 ? 3 : 2;
  var losePts = diff >= 2 ? 0 : 1;
  return setsA > setsB ? [winPts, losePts] : [losePts, winPts];
}
function parseGamesFromMarcador(marcador){
  if (!marcador) return null;
  var gA = 0, gB = 0, found = false;
  String(marcador).split(",").forEach(function(part){
    var m = part.trim().match(/(\d+)\s*-\s*(\d+)/);
    if (m){ gA += parseInt(m[1],10); gB += parseInt(m[2],10); found = true; }
  });
  return found ? { gA:gA, gB:gB } : null;
}
function headToHeadResult(aId, bId){
  var m = STATE.matches.filter(function(x){
    return x.played && ((x.pairA===aId && x.pairB===bId) || (x.pairA===bId && x.pairB===aId));
  })[0];
  if (!m) return 0;
  var aIsA = m.pairA === aId;
  var aSets = aIsA ? m.setsA : m.setsB;
  var bSets = aIsA ? m.setsB : m.setsA;
  if (aSets > bSets) return 1;
  if (bSets > aSets) return -1;
  return 0;
}
function computeStandings(){
  var table = {};
  STATE.pairs.filter(function(p){ return p.confirmed; }).forEach(function(p){
    table[p.id] = { id:p.id, label:pairDisplayLabel(p), pj:0, pg:0, pp:0, sf:0, sc:0, gf:0, gc:0, pts:0 };
  });
  STATE.matches.forEach(function(m){
    if (!m.played) return;
    var a = table[m.pairA], b = table[m.pairB];
    if (!a || !b) return;
    a.pj++; b.pj++; a.sf+=m.setsA; a.sc+=m.setsB; b.sf+=m.setsB; b.sc+=m.setsA;
    if (m.setsA > m.setsB){ a.pg++; b.pp++; } else { b.pg++; a.pp++; }
    var pts = matchPoints(m.setsA, m.setsB);
    a.pts += pts[0]; b.pts += pts[1];
    var games = parseGamesFromMarcador(m.marcador);
    if (games){ a.gf += games.gA; a.gc += games.gB; b.gf += games.gB; b.gc += games.gA; }
  });
  var rows = Object.keys(table).map(function(k){ var r=table[k]; r.dif=r.sf-r.sc; r.gdif=r.gf-r.gc; return r; });
  rows.sort(function(x,y){
    if (y.pts!==x.pts) return y.pts-x.pts;
    var h2h = headToHeadResult(x.id, y.id);
    if (h2h !== 0) return -h2h;
    if (y.dif!==x.dif) return y.dif-x.dif;
    if (y.gdif!==x.gdif) return y.gdif-x.gdif;
    return x.label.localeCompare(y.label);
  });
  return rows;
}

/* ---------- EIGHT Ranking (individual, derived from liga results) ----------
   Players aren't stored as their own entities — only as j1/j2 strings on a pair (liga) or
   a "Nombre1 / Nombre2" label (cuadros, see splitPairLabel) — so a "player" here is
   identified by a slugified name. That means a typo or a rename across pairs/rounds
   silently splits or merges identities; acceptable for now since there's no stable player
   id in the data model. Both liga and cuadros results feed the ranking (see
   collectRankedResults). */
function slugifyName(name){
  return String(name || "").normalize("NFD").replace(/[̀-ͯ]/g, "")
    .toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}
/* every played liga jornada and every cuadros round with at least one decided match, in
   the order they actually happened — liga first (by jornada number), then cuadros (in
   bracket order via sortedRounds, since a round has no jornada number of its own).
   Cuadros matches only store "Nombre1 / Nombre2" label strings rather than pair ids (see
   splitPairLabel), and a still-open "Por definir" side obviously can't be scored, so
   those get filtered out here rather than in every caller. Shared by computePlayerRanking
   (which needs the chronology to run Elo step-by-step) and computeHeadToHead (which just
   wants every decided result, order aside). */
function collectRankedResults(){
  var byJornada = {};
  STATE.matches.filter(function(m){ return m.played; }).filter(matchPairsExist).forEach(function(m){
    (byJornada[m.jornada] = byJornada[m.jornada] || []).push(m);
  });
  var steps = Object.keys(byJornada).map(Number).sort(function(a,b){ return a-b; }).map(function(j){
    return { label:"Jornada "+j, results: byJornada[j].map(function(m){
      var pa = ligaSidePlayers(pairById(m.pairA)), pb = ligaSidePlayers(pairById(m.pairB));
      return { aPlayers:pa, bPlayers:pb, winA:m.setsA > m.setsB, setsA:m.setsA, setsB:m.setsB };
    }) };
  });
  var idsBySlug = playerIdsBySlug();
  sortedRounds().forEach(function(r){
    var results = (r.matches || []).filter(function(m){
      if (!m.ganador) return false;
      var pa = splitPairLabel(m.a), pb = splitPairLabel(m.b);
      return !pa.tbd && !pb.tbd && pa.j1 && pa.j2 && pb.j1 && pb.j2;
    }).map(function(m){
      var sets = m.sets || [];
      return { aPlayers:bracketSidePlayers(m, "a", idsBySlug), bPlayers:bracketSidePlayers(m, "b", idsBySlug), winA:m.ganador === m.a,
        setsA: sets.filter(function(s){ return s.a > s.b; }).length,
        setsB: sets.filter(function(s){ return s.b > s.a; }).length };
    });
    if (results.length) steps.push({ label:r.name, results:results });
  });
  return steps;
}
/* Elo, applied per step (a liga jornada or a cuadros round) rather than per match: every
   result in a step is scored against ratings as they stood at the START of that step, and
   all the resulting deltas land at once. That keeps the outcome independent of the
   arbitrary order matches happen to sit in within a jornada (there's no real timestamp to
   order them by), while still giving a clean "ranking as of the previous step" snapshot
   to diff the arrows against. */
function computePlayerRanking(){
  var RATING_START = 1500, K = 32;
  var players = {};
  /* keyed by player id when the result knows it, else by slugified name (see
     ligaSidePlayers/bracketSidePlayers) — row.slug is that key. aliases = every name the
     player has appeared under, so an old #jugador/<nombre> link still finds them. */
  function ensure(pl){
    var slug = pl.key;
    if (!slug) return null;
    if (!players[slug]) players[slug] = { slug:slug, name:pl.name, rating:RATING_START, pj:0, pg:0, pp:0, sf:0, sc:0, form:[], history:[], aliases:{} };
    players[slug].name = pl.name;
    players[slug].aliases[slugifyName(pl.name)] = true;
    if (pl.alias) players[slug].aliases[pl.alias] = true;
    return players[slug];
  }
  var steps = collectRankedResults();
  var prevSnapshot = null;
  steps.forEach(function(step, si){
    if (si === steps.length - 1){
      prevSnapshot = {};
      Object.keys(players).forEach(function(s){ prevSnapshot[s] = players[s].rating; });
    }
    var deltas = {};
    step.results.forEach(function(res){
      var pa1 = ensure(res.aPlayers[0]), pa2 = ensure(res.aPlayers[1]), pb1 = ensure(res.bPlayers[0]), pb2 = ensure(res.bPlayers[1]);
      var ratingA = (pa1.rating + pa2.rating) / 2, ratingB = (pb1.rating + pb2.rating) / 2;
      var expA = 1 / (1 + Math.pow(10, (ratingB - ratingA) / 400));
      var delta = K * ((res.winA ? 1 : 0) - expA);
      [pa1,pa2].forEach(function(p){ deltas[p.slug] = (deltas[p.slug] || 0) + delta; p.pj++; p.sf+=res.setsA; p.sc+=res.setsB; if (res.winA) p.pg++; else p.pp++; p.form.push({ label:step.label, win:res.winA }); });
      [pb1,pb2].forEach(function(p){ deltas[p.slug] = (deltas[p.slug] || 0) - delta; p.pj++; p.sf+=res.setsB; p.sc+=res.setsA; if (!res.winA) p.pg++; else p.pp++; p.form.push({ label:step.label, win:!res.winA }); });
    });
    Object.keys(deltas).forEach(function(slug){ players[slug].rating += deltas[slug]; });
    Object.keys(players).forEach(function(slug){ players[slug].history.push({ rating:Math.round(players[slug].rating) }); });
  });
  var rows = Object.keys(players).map(function(s){
    var p = players[s];
    var prevRating = prevSnapshot && (s in prevSnapshot) ? prevSnapshot[s] : p.rating;
    return { slug:p.slug, name:p.name, nameSlug:slugifyName(p.name), aliases:Object.keys(p.aliases), rating:Math.round(p.rating), prevRating:Math.round(prevRating),
      pj:p.pj, pg:p.pg, pp:p.pp, sf:p.sf, sc:p.sc,
      winRate: p.pj ? Math.round(p.pg / p.pj * 100) : 0, form: p.form.slice(-5), history: p.history };
  });
  rows.sort(function(a,b){ return b.rating - a.rating; });
  var prevOrder = rows.slice().sort(function(a,b){ return b.prevRating - a.prevRating; });
  var prevPos = {};
  prevOrder.forEach(function(r, i){ prevPos[r.slug] = i + 1; });
  rows.forEach(function(r, i){ r.pos = i + 1; r.prevPos = prevPos[r.slug] || r.pos; r.delta = r.prevPos - r.pos; });
  return rows;
}
function computeHeadToHead(slug){
  var results = {};
  collectRankedResults().forEach(function(step){
    step.results.forEach(function(res){
      function keys(ps){ return ps.map(function(p){ return p.key; }); }
      var inA = keys(res.aPlayers).indexOf(slug) !== -1;
      var inB = keys(res.bPlayers).indexOf(slug) !== -1;
      if (!inA && !inB) return;
      var opps = inA ? res.bPlayers : res.aPlayers;
      var won = inA ? res.winA : !res.winA;
      opps.forEach(function(o){
        var oslug = o.key;
        if (!oslug || oslug === slug) return;
        if (!results[oslug]) results[oslug] = { slug:oslug, name:o.name, wins:0, losses:0 };
        results[oslug].name = o.name;
        if (won) results[oslug].wins++; else results[oslug].losses++;
      });
    });
  });
  return Object.keys(results).map(function(k){ return results[k]; })
    .sort(function(a,b){ return (b.wins+b.losses) - (a.wins+a.losses); });
}
/* the "clasificación viva" toast: diffs a ranking snapshot taken right before a liga or
   cuadros result was saved against the ranking right after, for just the players in that
   match, and shows whichever of them actually moved. Callers take the "before" snapshot
   themselves (see saveMatch/acceptRevision/saveBracketMatch) since it has to happen
   before they mutate STATE — computePlayerRanking() always reads the CURRENT STATE. */
var rankingToastTimer = null;
function announceRankingChange(beforeRows, keys){
  var afterRows = computePlayerRanking();
  var updates = keys.map(function(slug){
    var before = beforeRows.filter(function(r){ return r.slug === slug; })[0];
    var after = afterRows.filter(function(r){ return r.slug === slug; })[0];
    if (!after) return null;
    var beforePos = before ? before.pos : after.pos;
    if (beforePos === after.pos) return null;
    return { slug:slug, name:after.name, before:beforePos, after:after.pos };
  }).filter(Boolean);
  if (!updates.length) return;
  ui.rankingUpdates = updates;
  if (rankingToastTimer) clearTimeout(rankingToastTimer);
  rankingToastTimer = setTimeout(function(){ ui.rankingUpdates = []; rankingToastTimer = null; mount(); }, 5200);
}
/* same idea as announceRankingChange, but for a cuadros match — bm.a/bm.b are still
   "Nombre1 / Nombre2" labels at the point a caller has this, so this resolves them (and
   skips a still-"Por definir" side, or a match with no winner yet) before diffing. */
function announceBracketRankingChange(beforeRows, bm){
  if (!beforeRows || !bm.ganador) return;
  var pa = splitPairLabel(bm.a), pb = splitPairLabel(bm.b);
  if (pa.tbd || pb.tbd || !pa.j1 || !pa.j2 || !pb.j1 || !pb.j2) return;
  var bySlug = playerIdsBySlug();
  announceRankingChange(beforeRows, bracketSidePlayers(bm, "a", bySlug).concat(bracketSidePlayers(bm, "b", bySlug)).map(function(p){ return p.key; }));
}

function matchPairsExist(m){ return !!pairById(m.pairA) && !!pairById(m.pairB); }
/* "¿cuándo y dónde juego?" shouldn't require asking the organizer on WhatsApp — fecha/
   hora/pista are optional per-match fields the organizer fills in from the Liga tab (see
   renderOrgLigaTab/saveMatch) and this renders them the same way everywhere a match shows
   up: the public Liga list, the organizer's own editor, and a player's own dashboard. */
function matchScheduleText(m){
  var parts = [];
  if (m.fecha){
    var d = new Date(m.fecha + "T00:00:00");
    parts.push(isNaN(d.getTime()) ? m.fecha : d.toLocaleDateString("es-ES", { day:"numeric", month:"short" }));
  }
  if (m.hora) parts.push(m.hora);
  if (m.pista) parts.push(m.pista);
  return parts.join(" · ");
}
function icsPad2(n){ return n < 10 ? "0"+n : String(n); }

/* ---------- jornada recompaction / fecha límite ----------
   A match counts as played if it's flagged so OR already carries set scores — the
   recompaction must never touch either kind, so it errs on the side of "played". */
function isMatchPlayed(m){ return m.played === true || (Array.isArray(m.sets) && m.sets.length > 0); }
/* local YYYY-MM-DD — toISOString() would roll the day over for anyone east of UTC late
   at night, which for a deadline is exactly the wrong day to be off by one. */
function ymdLocal(d){ return d.getFullYear() + "-" + icsPad2(d.getMonth()+1) + "-" + icsPad2(d.getDate()); }
function proximoDomingo(desde){
  var d = new Date(desde); d.setHours(0,0,0,0);
  var add = (7 - d.getDay()) % 7 || 7;
  d.setDate(d.getDate() + add);
  return d;
}
function defaultFechaLimite(){
  var d = proximoDomingo(new Date());
  d.setDate(d.getDate() + 14);
  return ymdLocal(d);
}
function formatFechaLimite(ymd){
  var p = String(ymd || "").split("-");
  return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : String(ymd || "");
}
function matchDeadlineText(m){
  return (!isMatchPlayed(m) && m.fechaLimite) ? "Fecha límite: " + formatFechaLimite(m.fechaLimite) : "";
}
/* the new jornada for every unplayed liga match, without touching who plays whom: each
   pair resumes right after the last jornada it actually played, and a match lands on
   the later of its two pairs' next free jornadas so neither pair gets two matches in the
   same new jornada. Walks pending matches in their original jornada order (then id, so
   the result is deterministic). Pure — returns the plan, mutates nothing. Matches whose
   pairs no longer exist are left out entirely (they're hidden everywhere else too). */
function planRecompact(){
  var siguienteLibre = {};
  STATE.matches.forEach(function(m){
    if (!isMatchPlayed(m)) return;
    var j = Number(m.jornada) || 0;
    siguienteLibre[m.pairA] = Math.max(siguienteLibre[m.pairA] || 1, j + 1);
    siguienteLibre[m.pairB] = Math.max(siguienteLibre[m.pairB] || 1, j + 1);
  });
  function libreDe(pid){ return siguienteLibre[pid] || 1; }
  return STATE.matches
    .filter(function(m){ return !isMatchPlayed(m) && matchPairsExist(m); })
    .sort(function(a, b){ return (Number(a.jornada) - Number(b.jornada)) || String(a.id).localeCompare(String(b.id)); })
    .map(function(m){
      var nueva = Math.max(libreDe(m.pairA), libreDe(m.pairB));
      siguienteLibre[m.pairA] = nueva + 1;
      siguienteLibre[m.pairB] = nueva + 1;
      return { match:m, from:Number(m.jornada), to:nueva };
    });
}

/* a pair can update its own contact email from the player panel, but state/pairs is
   organizer-write-only (and rewriting the whole shared list from a player's browser is
   exactly what those rules exist to prevent) — so the player's edit lives in its own
   pairContacts/{pairId} doc and wins over the original here. state/pairs itself is
   never touched by it. */
function pairContacto(p){
  var o = p && STATE.pairContacts[p.id];
  return (o && o.contacto) || (p && p.contacto) || "";
}

/* set-by-set score entry (or read-only display) laid out as a small scoreboard: one row
   per pair with its real name always visible next to its own three boxes, so once a
   number is typed in there's still no doubt whose column is whose — a placeholder
   ("A", "Vos.") vanishes the moment you type. rows: [{label, sub, vals:[..3], ids:[..3]
   (editable only), winner}] */
function renderScoreGrid(rows, opts){
  opts = opts || {};
  var head = '<div class="score-grid-row score-grid-head"><span></span><span>Set 1</span><span>Set 2</span><span>Set 3</span></div>';
  return '<div class="score-grid'+(opts.readonly ? " score-grid--readonly" : "")+'">' + head + rows.map(function(r){
    var cells = [0,1,2].map(function(i){
      var v = r.vals ? r.vals[i] : "";
      var shown = (v === null || v === undefined) ? "" : String(v);
      if (opts.readonly) return '<span class="score-grid-cell">'+(shown === "" ? "–" : escHtml(shown))+'</span>';
      return '<input class="bm-set-input" type="text" inputmode="numeric" maxlength="2" id="'+r.ids[i]+'" value="'+escHtml(shown)+'" aria-label="'+escHtml(r.label+" · set "+(i+1))+'">';
    }).join("");
    return '<div class="score-grid-row'+(r.winner ? " score-grid-row--winner" : "")+'">'
      + '<span class="score-grid-name">'+escHtml(r.label)+(r.sub ? '<small>'+escHtml(r.sub)+'</small>' : "")+'</span>'
      + cells + '</div>';
  }).join("") + '</div>';
}
function setsSideVals(sets, side){
  return [0,1,2].map(function(i){ var s = (sets || [])[i]; return s ? (side === "a" ? s.a : s.b) : ""; });
}
function setsWonBy(sets, side){
  return (sets || []).filter(function(s){ return side === "a" ? s.a > s.b : s.b > s.a; }).length;
}
function icsEscape(text){
  return String(text || "").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
}
/* a liga match's fecha/hora/pista as a downloadable .ics — no library, just the handful
   of lines a calendar app actually needs. Times are written "floating" (no Z, no TZID):
   every player here is in the same timezone, so the simplest correct thing is to let
   each device read it as its own local time instead of building out a VTIMEZONE block. A
   match with a date but no time yet becomes an all-day event rather than being skipped. */
function buildMatchIcs(m, summary, location){
  var datePart = m.fecha.replace(/-/g, "");
  var now = new Date();
  var dtstamp = now.toISOString().replace(/[-:]/g,"").split(".")[0] + "Z";
  var lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//EIGHT Club//ES","CALSCALE:GREGORIAN","BEGIN:VEVENT","UID:eight-"+m.id+"@eightclub","DTSTAMP:"+dtstamp];
  if (m.hora){
    var start = new Date(m.fecha + "T" + m.hora + ":00");
    var end = new Date(start.getTime() + 90 * 60000);
    var fmt = function(d){ return d.getFullYear() + icsPad2(d.getMonth()+1) + icsPad2(d.getDate()) + "T" + icsPad2(d.getHours()) + icsPad2(d.getMinutes()) + "00"; };
    lines.push("DTSTART:"+fmt(start), "DTEND:"+fmt(end));
  } else {
    var endD = new Date(m.fecha + "T00:00:00");
    endD.setDate(endD.getDate() + 1);
    var endDate = endD.getFullYear() + icsPad2(endD.getMonth()+1) + icsPad2(endD.getDate());
    lines.push("DTSTART;VALUE=DATE:"+datePart, "DTEND;VALUE=DATE:"+endDate);
  }
  lines.push("SUMMARY:"+icsEscape(summary));
  if (location) lines.push("LOCATION:"+icsEscape(location));
  lines.push("DESCRIPTION:"+icsEscape("EIGHT. Club — "+summary), "END:VEVENT", "END:VCALENDAR");
  return lines.join("\r\n");
}
function addMatchToCalendar(id){
  var m = STATE.matches.filter(function(x){ return x.id === id; })[0];
  if (!m || !m.fecha) return;
  var summary = "EIGHT. Club: " + pairLabel(m.pairA) + " vs " + pairLabel(m.pairB);
  var ics = buildMatchIcs(m, summary, m.pista);
  var blob = new Blob([ics], { type:"text/calendar;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "eight-club-jornada-"+m.jornada+".ics";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

function renderSparkline(history){
  if (!history || history.length < 2) return "";
  var W = 280, H = 56, pad = 4;
  var values = history.map(function(h){ return h.rating; });
  var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
  var range = (max - min) || 1;
  var stepX = (W - pad * 2) / (values.length - 1);
  var pts = values.map(function(v, i){
    var x = pad + i * stepX;
    var y = H - pad - ((v - min) / range) * (H - pad * 2);
    return x.toFixed(1) + "," + y.toFixed(1);
  });
  var lastX = pad + (values.length - 1) * stepX;
  var lastY = H - pad - ((values[values.length-1] - min) / range) * (H - pad * 2);
  var up = values[values.length - 1] >= values[0];
  var color = "var(--" + (up ? "signal" : "danger") + ")";
  return '<div class="profile-sparkline">'
    + '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'
    +   '<polyline points="'+pts.join(" ")+'" fill="none" style="stroke:'+color+';stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"/>'
    +   '<circle cx="'+lastX.toFixed(1)+'" cy="'+lastY.toFixed(1)+'" r="3.5" style="fill:'+color+';"/>'
    + '</svg>'
    + '<div class="profile-sparkline-label">Evolución del rating · '+history.length+' jornada'+(history.length===1?"":"s")+'</div>'
    + '</div>';
}
/* a profile is addressed by its ranking key (player id, or slug for players without
   one); a #jugador/<nombre> link — including one shared before ids existed or before a
   rename — still lands on the right row via the current name or any former one */
function findRankingRow(rows, v){
  if (!v) return null;
  return rows.filter(function(x){ return x.slug === v; })[0]

/* every liga and cuadros match this pair is in, flattened into one shape so the panel can
   group them by "what do I need to do with it" (por jugar / jugados) instead of by
   competition. Orphaned liga matches (rival pair deleted) are hidden, same as the public
   Liga list. */
function playerMatchItems(pair){
  var label = pairDisplayLabel(pair);
  function latestRevision(tipo, matchId){
    return STATE.revisiones.filter(function(rv){ return rv.pairId===pair.id && rv.tipo===tipo && rv.matchId===matchId; })
      .sort(function(a,b){ return (b.creadoEnMs||0) - (a.creadoEnMs||0); })[0] || null;
  }
  var items = [];
  STATE.matches.forEach(function(m){
    if (m.pairA !== pair.id && m.pairB !== pair.id) return;
    if (!matchPairsExist(m)) return;
    var mySide = m.pairA === pair.id ? "a" : "b";
    var mine = mySide === "a" ? m.setsA : m.setsB, theirs = mySide === "a" ? m.setsB : m.setsA;
    items.push({ key:"liga-"+m.id, tipo:"liga", id:m.id, roundId:null, order:Number(m.jornada) || 0,
      etiqueta:"Liga · Jornada "+m.jornada, mySide:mySide, myLabel:label,
      rival:pairLabel(mySide==="a" ? m.pairB : m.pairA), rivalTbd:false,
      sets:m.sets || [], played:!!m.played, decided:!!m.played && mine !== theirs, won:!!m.played && mine > theirs,
      schedule:matchScheduleText(m), fecha:m.fecha || "", hora:m.hora || "",
      fechaLimite:m.played ? "" : (m.fechaLimite || ""), rev:latestRevision("liga", m.id) });
  });
  sortedRounds().forEach(function(r, ri){
    (r.matches || []).forEach(function(bm){
      var mySide = bracketSideOfPair(bm, pair);
      if (!mySide) return;
      var myText = mySide === "a" ? bm.a : bm.b;
      var rivalText = mySide === "a" ? bm.b : bm.a;
      var rival = bracketSideDisplay(bm, mySide === "a" ? "b" : "a");
      var played = !!(bm.resultado || bm.ganador);
      items.push({ key:"cuadro-"+bm.id, tipo:"cuadro", id:bm.id, roundId:r.id, order:10000 + ri,
        etiqueta:roundTorneo(r)+" · "+r.name, mySide:mySide, myLabel:label,
        rival:rival, rivalTbd:rivalText === "Por definir",
        sets:bm.sets || [], played:played, decided:!!bm.ganador, won:!!bm.ganador && bm.ganador === myText,
        schedule:"", fecha:"", hora:"", fechaLimite:"", rev:latestRevision("cuadro", bm.id) });
    });
  });
  return items;
}
/* soonest first: matches with a concrete date go first (by date+time), then the rest by
   jornada / bracket order — there's nothing else to sort an undated match by. */
function comparePlayerItems(a, b){
  if (a.fecha && b.fecha) return (a.fecha + a.hora).localeCompare(b.fecha + b.hora);
  if (a.fecha) return -1;
  if (b.fecha) return 1;
  return a.order - b.order;
}

function renderPlayerDashboard(pair, rankingRows){
  var label = pairDisplayLabel(pair);
  var items = playerMatchItems(pair);
  var pending = items.filter(function(i){ return !i.played; }).sort(comparePlayerItems);
  var played = items.filter(function(i){ return i.played; }).sort(function(a, b){ return a.order - b.order; });
  var awaiting = items.filter(function(i){ return i.rev && i.rev.estado === "pendiente"; });

    + (next ? renderNextMatchCard(next) : (pending.length ? "" : '<div class="player-empty">No tenéis partidos pendientes ahora mismo.</div>'))
    + playerSection("Por jugar", pending.length, pending.length
        ? pending.map(function(i){ return renderPlayerMatchRow(i); }).join("")

/* one match card in the player panel. Unplayed: result entry (or why it can't be sent
   yet). Played: the result as a read-only scoreboard, the share button, and a
   "send a correction" toggle that reveals the same entry form prefilled. The input ids
   (pr-<tipo>-<id>-s<n>me / riv) are what submitPlayerResult reads — only one form per
   match is ever on screen, so reusing them between the two cases is safe. */
function renderPlayerMatchRow(item){
  var idBase = "pr-"+item.tipo+"-"+item.id;
  var myVals = setsSideVals(item.sets, item.mySide);
  var rivVals = setsSideVals(item.sets, item.mySide === "a" ? "b" : "a");
  var rev = item.rev;
  var pendingRev = !!(rev && rev.estado === "pendiente");
  var rejected = !!(rev && rev.estado === "rechazada");
  function entryForm(buttonLabel, withCancel){
    return renderScoreGrid([
        { label:"Vosotros", sub:item.myLabel, vals:myVals, ids:[1,2,3].map(function(n){ return idBase+"-s"+n+"me"; }) },
        { label:"Rival", sub:item.rival, vals:rivVals, ids:[1,2,3].map(function(n){ return idBase+"-s"+n+"riv"; }) }
      ])
      + '<div class="bracket-edit-actions">'
      +   '<button class="btn btn-primary btn-sm" data-action="submit-player-result" data-tipo="'+item.tipo+'" data-id="'+item.id+'" data-round="'+(item.roundId||"")+'" type="button">'+buttonLabel+'</button>'
      +   (withCancel ? '<button class="btn btn-ghost btn-sm" data-action="player-correct-cancel" type="button">Cancelar</button>' : "")
      + '</div>';
  }
  var metaParts = [];
  if (item.schedule) metaParts.push(escHtml(item.schedule));
  if (!item.played && item.fechaLimite) metaParts.push('<span class="deadline-tag">Fecha límite: '+escHtml(formatFechaLimite(item.fechaLimite))+'</span>');
  var ics = (item.tipo === "liga" && item.fecha && !item.played) ? ' <button class="ics-btn" data-action="add-to-calendar" data-id="'+item.id+'" type="button">'+calendarIconSvg()+' Calendario</button>' : "";
  var meta = (metaParts.length || ics) ? '<div class="match-meta">'+metaParts.join(" · ")+ics+'</div>' : "";
  var share = item.played
    ? '<button class="share-btn" data-action="share-result" data-tipo="'+item.tipo+'" data-id="'+item.id+'"'+(item.roundId ? ' data-round="'+item.roundId+'"' : "")+' type="button" aria-label="Compartir resultado" title="Compartir resultado">'+shareIconSvg()+'</button>'
    : "";
  var resultTag = item.played && item.decided ? '<span class="pm-result pm-result--'+(item.won ? "win" : "loss")+'">'+(item.won ? "Victoria" : "Derrota")+'</span>' : "";
  var head = '<div class="pm-head"><div><div class="pm-etiqueta">'+escHtml(item.etiqueta)+'</div><div class="pm-vs">vs '+escHtml(item.rival)+'</div></div>'
    + '<div class="pm-head-side">'+resultTag+share+'</div></div>';
  var body;
  if (!item.played){
    if (pendingRev) body = '<span class="badge badge--pending">Resultado enviado · pendiente de revisión</span>';
    else if (item.rivalTbd) body = '<p class="pm-note">El rival todavía está por definir: podréis enviar el resultado cuando se conozca.</p>';
    else body = (rejected ? '<p class="pm-rejected">Vuestro envío anterior fue rechazado por el organizador — revisad el resultado y volved a enviarlo.</p>' : "")
      + entryForm("Enviar resultado", false);
  } else {
    body = renderScoreGrid([
        { label:"Vosotros", sub:item.myLabel, vals:myVals, winner:item.decided && item.won },
        { label:"Rival", sub:item.rival, vals:rivVals, winner:item.decided && !item.won }
      ], { readonly:true });
    if (pendingRev) body += '<span class="badge badge--pending">Corrección enviada · pendiente de revisión</span>';
    else if (ui.playerCorrecting === item.key) body += '<p class="pm-note">Corregid el resultado set a set; el organizador lo revisará antes de que cambie.</p>' + entryForm("Enviar corrección", true);
    else body += (rejected ? '<p class="pm-rejected">Vuestra última corrección fue rechazada por el organizador.</p>' : "")
      + '<button class="inline-link-btn" data-action="player-correct" data-key="'+item.key+'" type="button">¿Algún error en el resultado? Enviar corrección</button>';
  }
  return '<div class="pm-card'+(item.played ? " pm-card--played" : "")+'">' + head + meta + body + '</div>';
}

/* which side of the real match ("a"/"b") the pair that sent this revisión played on.
   sets[] in a revisión are stored against the match's own pairA/pairB order (so
   acceptRevision can copy them straight across), so displaying them in the
   "pairLabel vs rivalLabel" order needs this. Revisiones sent before mySide was stored
   get it inferred from the match itself; null only if that match no longer exists. */
function revisionSide(r){
  if (r.mySide === "a" || r.mySide === "b") return r.mySide;
  if (r.tipo === "liga"){
    var m = STATE.matches.filter(function(x){ return x.id===r.matchId; })[0];
    return m ? (m.pairA === r.pairId ? "a" : m.pairB === r.pairId ? "b" : null) : null;
  }
  var round = STATE.bracket.filter(function(x){ return x.id===r.roundId; })[0];
  var bm = round ? round.matches.filter(function(x){ return x.id===r.matchId; })[0] : null;
  if (!bm) return null;
  var rp = pairById(r.pairId), byPair = rp ? bracketSideOfPair(bm, rp) : null;
  return byPair || (bm.a === r.pairLabel ? "a" : bm.b === r.pairLabel ? "b" : null);
}
function renderOrgRevisionesTab(){
  if (!STATE.loaded.revisiones) return '<p class="loading-note">Cargando revisiones…</p>';

    .sort(function(a,b){ return (a.creadoEnMs||0) - (b.creadoEnMs||0); });
  if (!pending.length) return '<p style="color:var(--ink-faint);font-size:.9rem;">No hay resultados enviados por jugadores pendientes de revisar.</p>';
  return '<div>' + pending.map(function(r){
    var sets = r.sets || [];
    var side = revisionSide(r);
    var m = r.tipo === "liga" ? STATE.matches.filter(function(x){ return x.id===r.matchId; })[0] : null;
    var etiqueta = r.tipo === "liga" ? ("Liga · Jornada " + (m ? m.jornada : r.jornada)) : "Cuadros";
    var scoreHtml;
    if (side){
      var other = side === "a" ? "b" : "a";
      var wonMine = setsWonBy(sets, side), wonTheirs = setsWonBy(sets, other);
      scoreHtml = renderScoreGrid([
          { label:r.pairLabel, sub:"envía el resultado", vals:setsSideVals(sets, side), winner:wonMine > wonTheirs },
          { label:r.rivalLabel, vals:setsSideVals(sets, other), winner:wonTheirs > wonMine }
        ], { readonly:true });
      if (m && m.played && m.sets && m.sets.length){
        scoreHtml += '<p class="pm-note">Ahora mismo figura: '+escHtml(m.sets.map(function(s){ return side === "a" ? s.a+"-"+s.b : s.b+"-"+s.a; }).join(", "))+' (mismo orden: '+escHtml(r.pairLabel)+' primero) — esto es una corrección.</p>';
      }
    } else {
      scoreHtml = '<div style="font-family:var(--font-display);font-size:1.1rem;color:var(--signal);margin:.4rem 0;">'+escHtml(sets.map(function(s){ return s.a + "-" + s.b; }).join(", "))+'</div>'
        + '<p class="pm-note">No se ha encontrado el partido original, así que este marcador va en el orden interno del partido (pareja A – pareja B), que puede no coincidir con el orden del texto de arriba.</p>';

      +   '<span><strong>'+escHtml(r.pairLabel)+'</strong> vs '+escHtml(r.rivalLabel)+'</span>'
      +   '<span class="badge badge--pending">'+escHtml(etiqueta)+'</span>'
      + '</div>'
      + scoreHtml
      + '<div style="display:flex;gap:.5rem;flex-wrap:wrap;">'
      +   '<button class="btn btn-outline btn-sm" data-action="accept-revision" data-id="'+r.id+'" type="button">Aceptar</button>'
      +   '<button class="btn btn-danger btn-sm" data-action="reject-revision" data-id="'+r.id+'" type="button">Rechazar</button>'
      + '</div></div>';
  }).join("") + '</div>';
}

/* "dar más margen" without re-drawing the round robin: see planRecompact. Two steps —
   pick a deadline, then an in-page confirmation listing exactly what changes — and
   nothing is written until "Sí, recompactar". */
function renderRecompactCard(){
  var plan = planRecompact();
  var playedCount = STATE.matches.filter(isMatchPlayed).length;
  if (!ui.recompactConfirm){
    return '<div class="recompact-card"><h4>Recompactar jornadas pendientes</h4>'
      + '<p class="pm-note">Pasa cada partido sin jugar a la jornada siguiente a la última que jugó cada pareja (sin cambiar quién juega contra quién) y les pone una fecha límite. Los '+playedCount+' partido'+(playedCount===1?"":"s")+' ya jugado'+(playedCount===1?"":"s")+' no se tocan.</p>'
      + (plan.length
          ? '<div class="recompact-controls"><label class="field"><span>Fecha límite</span><input type="date" id="recompact-fecha" value="'+escHtml(ui.recompactFecha || defaultFechaLimite())+'"></label>'
            + '<button class="btn btn-outline btn-sm" data-action="ask-recompact" type="button">Revisar cambios ('+plan.length+' partido'+(plan.length===1?"":"s")+')</button></div>'
            + (ui.recompactError ? '<p class="login-error">'+escHtml(ui.recompactError)+'</p>' : "")
          : '<p class="pm-note">No hay partidos sin jugar.</p>')
      + '</div>';
  }
  var changed = plan.filter(function(p){ return p.to !== p.from; });
  var rows = plan.map(function(p){
    var m = p.match;
    var hadSchedule = !!(m.fecha || m.hora || m.pista);
    return '<li><strong>'+escHtml(pairLabel(m.pairA))+'</strong> vs <strong>'+escHtml(pairLabel(m.pairB))+'</strong>: '
      + (p.to !== p.from
          ? 'Jornada '+p.from+' → <strong>Jornada '+p.to+'</strong>'+(hadSchedule ? ' <span class="deadline-tag">(se quita su cita: '+escHtml(matchScheduleText(m))+')</span>' : "")
          : 'se queda en la Jornada '+p.from)
      + '</li>';

  var maxVotes = Math.max.apply(null, [0].concat(STATE.camisetas.map(function(d){ return counts[d.id] || 0; })));

/* browsing between designs (prev/next, grid<->single) used to go through the global
   mount(), which rebuilds the ENTIRE page — header, liga tables, the embedded Google
   Maps iframe, everything — just to swap which shirt image is showing. Scoping that
   down to just #camiseta-modal-root (see renderApp above) still wasn't enough: it
   replaced the whole modal-panel node, and .modal-panel has a CSS entrance animation
   (modalIn) that plays on any element newly inserted into the DOM — so the modal was
   visibly "popping in" fresh on every single click, which read exactly like a reload.
   This only touches #camiseta-body (renderCamisetaBody), leaving the modal-panel node
   that carries that animation untouched — the grid/carousel width classes are the one
   thing that lived on that outer node, so those get toggled directly instead. */
function mountCamisetaBody(){
  var body = document.getElementById("camiseta-body");
  if (body) body.innerHTML = renderCamisetaBody();
  var panel = document.getElementById("camiseta-panel");
  if (panel) panel.classList.toggle("modal-panel--camiseta-grid", STATE.camisetas.length > 1 && ui.camisetaView === "grid");
}
/* the venue-screen view (see the "Abrir pantalla del club" link in the organizer's Info
   tab) — a TV or tablet propped up at Padel Club Alicante Indoor on torneo day, showing
   cuadros + ranking live with no header, no buttons, and text sized to read from across
   the room. It's a plain #pantalla hash rather than a real route (see the hashchange
   listener near the bottom of the file), and reuses the exact same bracket/ranking-table
   markup and CSS as the normal page so a result posted mid-match shows up here the
   instant onSnapshot re-mounts it, same as everywhere else on the site. */
function renderKioskView(){
  /* #pantalla/<torneo> (see the per-torneo links in the organizer's Info tab) pins the
     screen to a specific tournament; plain #pantalla falls back to whichever one is
     currently most active (see distinctTorneos) — either way there's no selector to
     click, this is a passive screen propped up at the venue. */
  var hashTorneo = decodeURIComponent(location.hash.replace(/^#pantalla\/?/, ""));
  var torneos = distinctTorneos();
  var kioskTorneo = (hashTorneo && torneos.indexOf(hashTorneo) !== -1) ? hashTorneo : torneos[0];
  var visibleRounds = sortedRounds().filter(function(r){ return r.matches && r.matches.length && roundTorneo(r) === kioskTorneo; });
  var bracketBody = visibleRounds.length
    ? '<div class="bracket'+(visibleRounds.length>1?" bracket--tree":"")+'">' + visibleRounds.map(function(r){
        return '<div class="bracket-round"><h3>'+escHtml(r.name)+'</h3>' + r.matches.map(function(m){
          return '<div class="bracket-match fx-reveal">'
            + '<div class="'+(m.ganador && m.ganador===m.a ? "winner":"")+'">'+escHtml(bracketSideDisplay(m, "a"))+'</div>'
            + '<div class="'+(m.ganador && m.ganador===m.b ? "winner":"")+'">'+escHtml(bracketSideDisplay(m, "b"))+'</div>'
            + (m.resultado ? '<div class="bracket-score">'+escHtml(m.resultado)+'</div>' : "")
            + '</div>';
        }).join("") + '</div>';
      }).join("") + '</div>'
    : emptyState("Cuadros pendientes", "Todavía no se han publicado los cuadros eliminatorios.");
  var rankingRows = (STATE.loaded.pairs && STATE.loaded.matches) ? computePlayerRanking() : [];
  var top = rankingRows.slice(0, 8);
  var rankBody = top.length
    ? renderRankingTable(top)
    : emptyState("Ranking pendiente", "En cuanto se jueguen partidos de liga aparecerá aquí.");
  return '<div class="kiosk-view">'
    + '<div class="kiosk-brand">'+isotipoSvg()+'<span class="brand-mark">EIGHT<span class="dot">.</span></span></div>'
    + '<div class="kiosk-grid">'
    +   '<section class="kiosk-panel"><h2>Cuadros'+(kioskTorneo?' · '+escHtml(kioskTorneo):'')+'</h2>'+bracketBody+'</section>'
    +   '<section class="kiosk-panel"><h2>Ranking</h2>'+rankBody+'</section>'
    + '</div>'
    + '</div>';
}
/* ============================================================
   Scroll-driven fx engine
   Everything here is a pure function of the CURRENT scroll position,
   recomputed every frame while scrolling (rAF-throttled) — nothing is
   triggered once and left alone. Scroll up and every effect runs in
   reverse, exactly in step. Two kinds of elements are handled:
     .fx-reveal    — fades/rises/settles into place as it enters the
                     lower part of the viewport (optionally combined
                     with a per-element drift via data-speed)
     .fx-parallax  — pure differential drift, no fade, keyed off how
                     far the element's center sits from the viewport's
                     center (data-speed sets amplitude + direction)
     .hero         — scale/fade/drift as the user scrolls past it,
                     applied via the --hero-p custom property
   None of this checks prefers-reduced-motion: it's deliberately kept
   subtle (small amplitudes, no autoplay, nothing that moves without
   the visitor's own scroll input) so it plays the same for everyone. */
var fx = { hero:null, reveals:[], parallax:[], navLinks:[], navSections:[] };
var fxTicking = false;

function fxClamp01(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }

/* elements later in the same list/grid need a touch more scroll before they
   settle, so groups cascade in rather than popping in as one flat block —
   computed once per collectFx() call, not on every scroll frame */
function fxSiblingDelay(el){
  var group = el.parentElement;
  if (!group) return 0;
  var i = 0;
  for (var c = group.firstElementChild; c; c = c.nextElementSibling){
    if (c === el) return Math.min(i * 0.04, 0.16);
    if (c.classList && c.classList.contains("fx-reveal")) i++;
  }
  return 0;
}

function collectFx(){
  fx.hero = document.querySelector(".hero");
  fx.reveals = Array.prototype.slice.call(document.querySelectorAll(".fx-reveal"));
  fx.parallax = Array.prototype.slice.call(document.querySelectorAll(".fx-parallax"));
  fx.reveals.forEach(function(el){
    el.dataset.fxDelay = fxSiblingDelay(el);
  });
  fx.navLinks = Array.prototype.slice.call(document.querySelectorAll(".header-nav a"));
  fx.navSections = NAV_LINKS.map(function(l){ return { id:l[0], el:document.querySelector(l[0]) }; });
  heroDotsSetup();
  applyHeroNumHot();
  bracketDotsSetup();
  layoutBracketConnectors();
  applyFx();
}

function applyFx(){
  var vh = window.innerHeight;
  /* mobile: same transformations, turned down — not a different, cut-down experience,
     just gentler amplitude so nothing feels janky on a small, often-scrolled-fast screen */
  var amp = window.innerWidth < 640 ? 0.55 : 1;
  document.documentElement.style.setProperty("--hero-amp", amp);

  var hp = 0;
  if (fx.hero){
    var heroTop = fx.hero.getBoundingClientRect().top;
    var heroH = fx.hero.offsetHeight || 1;
    hp = fxClamp01(-heroTop / (heroH * 0.9));
    document.documentElement.style.setProperty("--hero-p", hp.toFixed(4));
  }

  var revealStart = vh * 0.88, revealEnd = vh * 0.72;
  fx.reveals.forEach(function(el){
    var r = el.getBoundingClientRect();
    var delay = parseFloat(el.dataset.fxDelay) || 0;
    var p = fxClamp01((revealStart - r.top) / (revealStart - revealEnd) - delay);
    var speed = parseFloat(el.getAttribute("data-speed")) || 0;
    var drift = 0;
    if (speed){
      var center = r.top + r.height / 2;
      drift = ((vh / 2 - center) / vh) * speed * amp;
    }
    var tiltX = parseFloat(el.dataset.tiltX) || 0;
    var tiltY = parseFloat(el.dataset.tiltY) || 0;
    var tiltZ = parseFloat(el.dataset.tiltZ) || 0;
    var treeY = parseFloat(el.dataset.treeY) || 0;
    el.style.opacity = p;
    el.style.transform = "perspective(900px) translateY(" + ((1 - p) * 26 * amp + drift + treeY).toFixed(1) + "px) scale(" + (0.97 + p * 0.03).toFixed(3) + ")"
      + (tiltX || tiltY ? " rotateX(" + tiltX + "deg) rotateY(" + tiltY + "deg)" : "")
      + (tiltZ ? " rotate(" + tiltZ + "deg)" : "");
  });

  fx.parallax.forEach(function(el){
    var r = el.getBoundingClientRect();
    var speed = parseFloat(el.getAttribute("data-speed")) || 20;
    var d = ((vh / 2 - (r.top + r.height / 2)) / vh) * speed * amp;
    el.style.transform = "translateY(" + d.toFixed(1) + "px)";
  });

  var activeHref = null;
  fx.navSections.forEach(function(s){
    if (s.el && s.el.getBoundingClientRect().top <= 140) activeHref = s.id;
  });
  fx.navLinks.forEach(function(a){
    a.classList.toggle("active", a.getAttribute("href") === activeHref);
  });

  updateBackToTop();
  updateHeaderScrolled();
}

/* subtle cursor-reactive tilt on formato/rule cards — delegated on document so it
   keeps working after every mount() re-render without rebinding per card. The tilt
   angle is stashed on the element's dataset and folded into the same inline transform
   applyFx() already drives for every .fx-reveal element (that transform is set on
   every scroll frame and would otherwise stomp any transform set here separately).
   pointerleave doesn't bubble, but a capture-phase listener still sees it on the way
   down to the target, which is the standard trick for delegating enter/leave events. */
var tiltTicking = false;
function fxTiltApply(){ applyFx(); tiltTicking = false; }
function fxTiltMove(e){
  var card = e.target.closest && e.target.closest(".formato-card, .rule-card");
  if (!card) return;
  var r = card.getBoundingClientRect();
  var px = (e.clientX - r.left) / r.width - 0.5;
  var py = (e.clientY - r.top) / r.height - 0.5;
  card.dataset.tiltX = (py * -6).toFixed(2);
  card.dataset.tiltY = (px * 6).toFixed(2);
  if (!tiltTicking){ tiltTicking = true; requestAnimationFrame(fxTiltApply); }
}
function fxTiltLeave(e){
  var card = e.target.closest && e.target.closest(".formato-card, .rule-card");
  if (!card) return;
  card.dataset.tiltX = "0";
  card.dataset.tiltY = "0";
  if (!tiltTicking){ tiltTicking = true; requestAnimationFrame(fxTiltApply); }
}
document.addEventListener("pointermove", fxTiltMove);
document.addEventListener("pointerleave", fxTiltLeave, true);

/* custom cursor — the dot tracks the real pointer 1:1 (no rAF throttle: any lag here is
   immediately obvious, unlike the scroll effects), while the "clickable" state is
   delegated so it keeps working after every mount() re-render without rebinding. */
var cursorDotEl = document.getElementById("cursor-dot");
var CURSOR_CLICKABLE = "a, button, input, select, textarea, label";
if (cursorDotEl){
  document.addEventListener("pointermove", function(e){
    if (e.pointerType && e.pointerType !== "mouse") return;
    cursorDotEl.style.transform = "translate(" + e.clientX + "px," + e.clientY + "px)";
  });
  document.addEventListener("pointerover", function(e){
    if (e.target.closest && e.target.closest(CURSOR_CLICKABLE)) cursorDotEl.classList.add("is-active");
  });
  document.addEventListener("pointerout", function(e){
    var leavingClickable = e.target.closest && e.target.closest(CURSOR_CLICKABLE);
    var enteringClickable = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest(CURSOR_CLICKABLE);
    if (leavingClickable && !enteringClickable) cursorDotEl.classList.remove("is-active");
  });
}

/* ============================================================
   Hero halftone dots — a single canvas-drawn grid, not a CSS background layer plus a
   reactive overlay: the exact same dots that auto-drift also swell near the cursor, so
   nothing "new" appears, the existing ones just grow. Drift speed matches the old CSS
   haloDrift (160px every 16s, diagonally) and never stops; the swell is a large, very
   gently-falling-off radius on top of that, and the whole interactive effect itself
   fades in/out smoothly as the cursor enters/leaves the hero (heroDots.activeT) so nothing
   pops at the boundary either. The hero/canvas nodes are recreated on every mount() (they
   live inside #app), so heroDotsSetup() re-grabs them each time; only the rAF loop itself
   is started once, and its own timestamp drives the drift (frame-rate independent). */
var heroDots = { canvas:null, ctx:null, heroEl:null, w:0, h:0, dpr:1, mouseX:-9999, mouseY:-9999, smoothX:-9999, smoothY:-9999, inHero:false, activeT:0, driftX:0, driftY:0, lastT:null, raf:null };
var HERO_DOT_SPACING = 16;
var HERO_DOT_DRIFT_SPEED = 0.01; /* px/ms, each axis — 160px every 16000ms, same as the old CSS animation */
var HERO_DOT_HOVER_R = 260;

function heroDotsSetup(){
  var hero = document.querySelector(".hero");
  if (!hero) return;
  var canvas = hero.querySelector(".hero-dots-canvas");
  if (!canvas) return;
  var isNewCanvas = canvas !== heroDots.canvas;
  heroDots.heroEl = hero;
  heroDots.canvas = canvas;
  heroDots.ctx = canvas.getContext("2d");
  /* mount() replaces the hero/canvas DOM nodes on every re-render; a brand-new canvas
     always needs its backing buffer (re)sized even if its CSS dimensions happen to
     match the previous one's — a fresh <canvas> starts at the browser's 300x150
     default until we set .width/.height ourselves, regardless of how big it looks. */
  heroDotsResize(isNewCanvas);
  if (!heroDots.raf) heroDots.raf = requestAnimationFrame(heroDotsLoop);
}

function heroDotsResize(force){
  var hero = heroDots.heroEl, canvas = heroDots.canvas;
  if (!hero || !canvas) return;
  var r = hero.getBoundingClientRect();
  var w = Math.round(r.width), h = Math.round(r.height);
  if (!force && w === heroDots.w && h === heroDots.h) return;
  heroDots.w = w;
  heroDots.h = h;
  heroDots.dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = w * heroDots.dpr;
  canvas.height = h * heroDots.dpr;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  heroDots.ctx.setTransform(heroDots.dpr, 0, 0, heroDots.dpr, 0, 0);
}

function heroDotsDraw(now){
  var ctx = heroDots.ctx;
  if (!ctx) return;

  if (heroDots.lastT == null) heroDots.lastT = now;
  var dt = Math.min(now - heroDots.lastT, 100); /* clamp so a dropped/backgrounded frame can't jump the drift */
  heroDots.lastT = now;
  heroDots.driftX += dt * HERO_DOT_DRIFT_SPEED;
  heroDots.driftY += dt * HERO_DOT_DRIFT_SPEED;

  heroDots.activeT += ((heroDots.inHero ? 1 : 0) - heroDots.activeT) * 0.045;
  if (heroDots.activeT > 0.01){
    if (heroDots.smoothX < -900){ heroDots.smoothX = heroDots.mouseX; heroDots.smoothY = heroDots.mouseY; }
    heroDots.smoothX += (heroDots.mouseX - heroDots.smoothX) * 0.08;
    heroDots.smoothY += (heroDots.mouseY - heroDots.smoothY) * 0.08;
  }

  ctx.clearRect(0, 0, heroDots.w, heroDots.h);
  var phaseX = ((heroDots.driftX % HERO_DOT_SPACING) + HERO_DOT_SPACING) % HERO_DOT_SPACING;
  var phaseY = ((heroDots.driftY % HERO_DOT_SPACING) + HERO_DOT_SPACING) % HERO_DOT_SPACING;
  var active = heroDots.activeT > 0.01;
  var mx = heroDots.smoothX, my = heroDots.smoothY;
  ctx.fillStyle = "rgba(188,189,139,.55)";
  for (var y = phaseY - HERO_DOT_SPACING; y < heroDots.h + HERO_DOT_SPACING; y += HERO_DOT_SPACING){
    for (var x = phaseX - HERO_DOT_SPACING; x < heroDots.w + HERO_DOT_SPACING; x += HERO_DOT_SPACING){
      var r = 1.6;
      if (active){
        var d = Math.hypot(x - mx, y - my);
        if (d < HERO_DOT_HOVER_R){
          /* smoothstep — a soft, gradual rise with no hard edge at the boundary, spread
             across a wide radius so growth between neighbouring dots is barely
             distinguishable frame to frame */
          var t = 1 - d / HERO_DOT_HOVER_R;
          t = t * t * (3 - 2 * t);
          r = 1.6 + t * 5.2 * heroDots.activeT;
        }
      }
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function heroDotsLoop(now){
  /* no document.hidden gate here on purpose: the browser's own rAF scheduler already
     throttles background tabs for us, and gating on it ourselves risks the dots never
     drawing at all in a context where hidden reads true for reasons that have nothing to
     do with battery saving — since there's no CSS fallback layer any more, that would
     mean an empty hero background, which is worse than the CPU this loop actually costs. */
  heroDotsResize();
  heroDotsDraw(now);
  heroDots.raf = requestAnimationFrame(heroDotsLoop);
}
document.addEventListener("pointermove", function(e){
  if (e.pointerType && e.pointerType !== "mouse") return;
  if (!heroDots.heroEl) return;
  var r = heroDots.heroEl.getBoundingClientRect();
  heroDots.inHero = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  heroDots.mouseX = e.clientX - r.left;
  heroDots.mouseY = e.clientY - r.top;
});
window.addEventListener("resize", heroDotsResize);

/* the ghost "8" itself: no dots, just the same big translucent numeral as before,
   scaling up smoothly (CSS transition, not a per-frame loop) while the cursor sits over
   it. mount() replaces the element on every re-render (e.g. a Firestore snapshot while
   the visitor is mid-hover), which would silently drop the "is-hot" class along with the
   old node — lastPointerX/Y + applyHeroNumHot() re-derive and reapply it right after
   every mount, in collectFx(), so a background data refresh never resets the hover. */
var lastPointerX = -9999, lastPointerY = -9999;
function applyHeroNumHot(){
  var el = document.querySelector(".hero-num");
  if (!el) return;
  var r = el.getBoundingClientRect();
  var margin = 24;
  var hot = lastPointerX >= r.left - margin && lastPointerX <= r.right + margin && lastPointerY >= r.top - margin && lastPointerY <= r.bottom + margin;
  el.classList.toggle("is-hot", hot);
}
document.addEventListener("pointermove", function(e){
  if (e.pointerType && e.pointerType !== "mouse") return;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;
  applyHeroNumHot();
});

/* mobile swipe affordances for Cuadros: one dot per round tracking which "page" the
   bracket is scrolled to, and a hint line that fades out the moment the visitor actually
   swipes (no need to keep telling them once they've discovered it). Re-attached every
   mount() since .bracket is recreated along with the rest of #app each time. */
function bracketDotsSetup(){
  var bracket = document.querySelector(".bracket");
  var dotsWrap = document.querySelector(".bracket-dots");
  if (!bracket || !dotsWrap) return;
  var dots = Array.prototype.slice.call(dotsWrap.querySelectorAll(".bracket-dot"));
  var hint = document.querySelector(".bracket-swipe-hint");
  bracket.addEventListener("scroll", function(){
    var idx = Math.round(bracket.scrollLeft / (bracket.clientWidth || 1));
    dots.forEach(function(d, i){ d.classList.toggle("active", i === idx); });
    if (hint && bracket.scrollLeft > 8) hint.classList.add("seen");
  }, { passive:true });
}

/* tournament-tree connector lines for Cuadros (bracket--tree, 2+ rounds) — plain
   absolutely-positioned divs rather than svg, so this is just getBoundingClientRect
   arithmetic. Assumes match i,i+1 of round r feed match floor(i/2) of round r+1, which
   is how the organizer naturally enters rounds top-to-bottom. Recomputed on scroll/resize
   (not inside applyFx itself, which also fires on unrelated card-tilt mousemoves) since
   the fx-reveal entrance transform shifts card positions while it settles in. */
function layoutBracketConnectors(){
  var bracket = document.querySelector(".bracket.bracket--tree");
  var old = document.querySelector(".bracket-connectors");
  if (!bracket || window.innerWidth < 641){
    if (old) old.innerHTML = "";
    return;
  }
  var wrap = old;
  if (!wrap){
    wrap = document.createElement("div");
    wrap.className = "bracket-connectors";
    wrap.setAttribute("aria-hidden", "true");
    bracket.insertBefore(wrap, bracket.firstChild);
  }
  var rounds = Array.prototype.slice.call(bracket.querySelectorAll(".bracket-round"));
  if (rounds.length < 2){ wrap.innerHTML = ""; return; }
  wrap.style.width = bracket.scrollWidth + "px";
  wrap.style.height = bracket.scrollHeight + "px";
  var bracketRect = bracket.getBoundingClientRect();
  var originX = bracketRect.left - bracket.scrollLeft;
  var originY = bracketRect.top - bracket.scrollTop;
  var html = [];
  function addH(x, y, w){ if (w <= 0) return; html.push('<span class="bconn-h" style="left:'+x.toFixed(1)+'px;top:'+(y-1).toFixed(1)+'px;width:'+w.toFixed(1)+'px;"></span>'); }
  function addV(x, y, h){ if (h <= 0) return; html.push('<span class="bconn-v" style="left:'+(x-1).toFixed(1)+'px;top:'+y.toFixed(1)+'px;height:'+h.toFixed(1)+'px;"></span>'); }
  for (var r = 0; r < rounds.length - 1; r++){
    var matches = Array.prototype.slice.call(rounds[r].querySelectorAll(".bracket-match"));
    var nextMatches = Array.prototype.slice.call(rounds[r+1].querySelectorAll(".bracket-match"));
    var roundGap = rounds[r+1].getBoundingClientRect().left - rounds[r].getBoundingClientRect().right;
    for (var i = 0; i < nextMatches.length; i++){
      var a = matches[i*2], b = matches[i*2+1], next = nextMatches[i];
      if (!next || (!a && !b)) continue;
      var nextRect = next.getBoundingClientRect();
      var prevTreeY = parseFloat(next.dataset.treeY) || 0;
      var nextY = nextRect.top + nextRect.height/2 - originY - prevTreeY;
      var nextX = nextRect.left - originX;
      var midX = null, ys = [];
      [a,b].forEach(function(m){
        if (!m) return;
        var mr = m.getBoundingClientRect();
        var mY = mr.top + mr.height/2 - originY;
        var mRightX = mr.right - originX;
        midX = mRightX + roundGap/2;
        ys.push(mY);
        addH(mRightX, mY, midX - mRightX);
      });
      if (midX == null) continue;
      if (ys.length === 2){
        var targetY = (ys[0]+ys[1])/2;
        next.dataset.treeY = (targetY - nextY).toFixed(1);
        addV(midX, Math.min(ys[0], ys[1]), Math.abs(ys[1]-ys[0]));
        addH(midX, targetY, nextX - midX);
      } else {
        addH(midX, ys[0], nextX - midX);
      }
    }
  }
  wrap.innerHTML = html.join("");
}

function onScrollFx(){
  if (fxTicking) return;
  fxTicking = true;
  requestAnimationFrame(function(){ layoutBracketConnectors(); applyFx(); fxTicking = false; });
}
window.addEventListener("scroll", onScrollFx, { passive:true });
window.addEventListener("resize", onScrollFx);

function mount(){
  /* every re-render replaces #app's innerHTML wholesale, which would otherwise steal
     focus (and cursor position) out from under anyone mid-keystroke in a live-filtered
     input like the ranking search — save it here and restore it onto whatever element
     shares that id in the freshly rendered markup. */
  var activeId = document.activeElement && document.activeElement.id;
  var selStart, selEnd;
  if (activeId && typeof document.activeElement.selectionStart === "number"){
    selStart = document.activeElement.selectionStart;
    selEnd = document.activeElement.selectionEnd;
  }
  var isKiosk = location.hash.indexOf("#pantalla") === 0;
  document.documentElement.classList.toggle("kiosk-mode", isKiosk);
  document.getElementById("app").innerHTML = isKiosk ? renderKioskView() : renderApp();
  wireInscripcionForm();
  if (ui.modalOpen && !ui.unlocked){
    var input = document.getElementById("login-password-input");
    if (input) input.focus();
  }
  if (activeId){
    var restored = document.getElementById(activeId);
    if (restored){
      restored.focus();
      if (selStart != null && typeof restored.setSelectionRange === "function"){
        try { restored.setSelectionRange(selStart, selEnd); } catch(e){}
      }
    }
  }
  collectFx();
}

function isEmailContact(v){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v || "").trim());
}
/* auto-emails a pair's PIN via EmailJS (see the EMAILJS_* config at the top) instead of
   the organizer having to copy it into a WhatsApp/email themselves. Resolves to false
   (never rejects) whenever it can't send — EmailJS isn't configured, the contact isn't
   an email, or the request itself fails — so a caller can just show a fallback message
   ("compártelo a mano") rather than needing its own try/catch. */
function sendPinEmail(pair, pin){
  if (!window.emailjs || !EMAILJS_SERVICE_ID || !EMAILJS_TEMPLATE_ID || !isEmailContact(pairContacto(pair)) || !pin){
    return Promise.resolve(false);
  }
  return emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
    to_email: pairContacto(pair).trim(),
    pair_name: pairDisplayLabel(pair),
    pin: pin
  }).then(function(){ trackEmailSend(); return true; }).catch(function(){ return false; });
}
/* see the state/emailUsage onSnapshot listener for why this only ever sees admin-
   triggered sends. Not transactional — two admin tabs sending at the exact same moment
   could under-count by one — which is fine for a rough "you're getting close" nudge. */
function trackEmailSend(){
  var now = new Date();
  var monthKey = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0");
  var count = (STATE.emailUsage.monthKey === monthKey ? STATE.emailUsage.count : 0) + 1;
  STATE.emailUsage = { count: count, monthKey: monthKey };
  setDoc(doc(db, "state", "emailUsage"), STATE.emailUsage).catch(function(){});
}
/* best-effort "someone just registered" heads-up to the organizer's own inbox — never
   blocks or fails the actual inscripción, which is why nothing here awaits it or
   surfaces its result to the visitor filling in the public form. */
function notifyNewInscripcion(j1, j2, contacto){
  if (!window.emailjs || !EMAILJS_SERVICE_ID || !EMAILJS_NOTIFY_TEMPLATE_ID) return;
  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_NOTIFY_TEMPLATE_ID, { j1: j1, j2: j2, contacto: contacto }).catch(function(){});
}
/* letters (any language), spaces, and the couple of marks real names actually use
   ("Jean-Pierre", "O'Connor") — no digits, no symbols, no emoji. Rejects the kind of
   junk someone can paste into a public no-login form (see the inscripciones rules,
   which only require *some* create-time validation, not this specific shape). */
function isValidPersonName(v){
  return /^[\p{L}][\p{L} .'-]{1,59}$/u.test(String(v || "").trim());
}
function wireInscripcionForm(){
  var form = document.getElementById("inscripcion-form");
  if (!form) return;

/* resizes+re-encodes an uploaded photo client-side before it ever reaches Firestore —
   a document there is capped at 1MB, and a phone photo straight off a camera roll can
   clear that on its own before base64 even inflates it by another third. 900px on the
   long edge is still plenty sharp for a carousel someone's voting in, not for print. */
function resizeImageFile(file, maxDim, quality){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = function(){ reject(new Error("No se pudo leer la imagen")); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ reject(new Error("No se pudo leer el archivo")); };
    reader.readAsDataURL(file);
  });
}
/* keeps shrinking/re-compressing until the result actually fits Firestore's 1MiB-per-
   document ceiling with real margin to spare (400KB budget, base64 already counted in),
   instead of gambling on one fixed size/quality and finding out it was still too big
   only from the write failing. A busy, textured mockup image compresses far worse than a
   flat-color one at the same pixel size, so a single fixed setting either wastes quality
   on simple images or isn't enough for detailed ones — this adapts to whichever it is. */
function resizeImageFileUnderLimit(file, maxBytes){
  var attempts = [[900,.82],[820,.7],[720,.6],[620,.5],[520,.42],[420,.35]];
  function tryAt(i){
    if (i >= attempts.length) return Promise.reject(new Error("La imagen sigue pesando demasiado incluso muy reducida — prueba con otro archivo."));
    return resizeImageFile(file, attempts[i][0], attempts[i][1]).then(function(dataUrl){
      if (dataUrl.length * 0.75 <= maxBytes) return dataUrl;
      return tryAt(i + 1);
    });
  }
  return tryAt(0);
}

function submitPlayerResult(tipo, matchId, roundId){
  var pair = ui.playerPairId ? pairById(ui.playerPairId) : null;
  if (!pair) return;
  if (!currentPlayerAuthUser){ alert("Tu sesión ha caducado. Vuelve a entrar."); playerLogout(); return; }
  var msSinceLast = Date.now() - ui.lastRevisionSubmitAt;
  if (ui.lastRevisionSubmitAt && msSinceLast < RATE_LIMIT_SECONDS * 1000){
    alert("Espera " + Math.ceil((RATE_LIMIT_SECONDS * 1000 - msSinceLast) / 1000) + " segundos antes de enviar otro resultado.");
    return;
  }
  var label = pairDisplayLabel(pair);
  var mySide, rivalLabel, jornada = null, m;
  if (tipo === "liga"){
    m = STATE.matches.filter(function(x){ return x.id===matchId; })[0];
    if (!m){ alert("No se encontró el partido."); return; }
    mySide = m.pairA === pair.id ? "a" : "b";
    rivalLabel = pairLabel(mySide==="a" ? m.pairB : m.pairA);
    jornada = m.jornada;
  } else {
    var round = STATE.bracket.filter(function(r){ return r.id===roundId; })[0];
    m = round ? round.matches.filter(function(x){ return x.id===matchId; })[0] : null;
    if (!m){ alert("No se encontró el partido."); return; }
    mySide = bracketSideOfPair(m, pair) || "a";
    rivalLabel = bracketSideDisplay(m, mySide === "a" ? "b" : "a");
  }
  var idBase = "pr-"+tipo+"-"+matchId;
  var sets = [];
  for (var n = 1; n <= 3; n++){
    var meVal = valOf(idBase+"-s"+n+"me"), rivVal = valOf(idBase+"-s"+n+"riv");
    if (meVal === "" && rivVal === "") break;
    var gm = parseInt(meVal, 10), gr = parseInt(rivVal, 10);
    if (meVal === "" || rivVal === "" || isNaN(gm) || isNaN(gr)){ alert("Revisa el set "+n+": falta algún marcador."); return; }
    sets.push(mySide==="a" ? { a:gm, b:gr } : { a:gr, b:gm });
  }
  if (!sets.length){ alert("Introduce al menos el resultado de un set."); return; }
  var btn = document.querySelector('[data-action="submit-player-result"][data-id="'+matchId+'"]');
  if (btn){ btn.disabled = true; btn.textContent = "Enviando…"; }
  /* the revisión and the rate-limit stamp are written in one batch: Firestore rules
     validate each write against the state as of the START of the batch, so the rule can
     check "was the *previous* rateLimits/{uid} write old enough" while this same batch
     both creates the revisión and refreshes that timestamp for next time. */
  var revRef = doc(collection(db, "revisiones"));
  var batch = writeBatch(db);
  batch.set(revRef, {
    tipo: tipo, matchId: matchId, roundId: roundId || null, jornada: jornada,
    pairId: pair.id, pairLabel: label, rivalLabel: rivalLabel, mySide: mySide,
    sets: sets, estado: "pendiente", uid: currentPlayerAuthUser.uid, creadoEn: serverTimestamp()
  });
  batch.set(doc(db, "rateLimits", currentPlayerAuthUser.uid), { lastAt: serverTimestamp() });
  batch.commit().then(function(){
    ui.lastRevisionSubmitAt = Date.now();
    ui.playerCorrecting = null;
    ui.playerSubmitMsg = "Resultado enviado. El organizador lo revisará pronto.";
    mount();
  }).catch(function(err){
    alert(err && err.code === "permission-denied"
      ? "No se pudo enviar: o estás enviando resultados demasiado rápido (espera unos segundos), o vuestra sesión ya no es válida (si el organizador ha cambiado vuestro PIN, sal y vuelve a entrar)."
      : "No se pudo enviar. Comprueba tu conexión e inténtalo de nuevo.");
    if (btn){ btn.disabled = false; btn.textContent = "Enviar resultado"; }
  });
}

/* Renders a branded 1080x1080 PNG for one played match (liga or cuadro) client-side —
   no server round-trip, just canvas — then hands it to the Web Share API on phones
   (straight into WhatsApp/Instagram) or falls back to a plain download on desktop. */
function getShareInfo(tipo, id, roundId){
  if (tipo === "liga"){
    var m = STATE.matches.filter(function(x){ return x.id === id; })[0];
    if (!m || !m.played) return null;
    return {
      context: "Jornada " + m.jornada,
      labelA: pairLabel(m.pairA), labelB: pairLabel(m.pairB),
      scoreText: m.marcador || (m.setsA + "-" + m.setsB),
      winner: m.setsA > m.setsB ? pairLabel(m.pairA) : pairLabel(m.pairB)
    };
  }
  if (tipo === "cuadro"){
    var round = STATE.bracket.filter(function(r){ return r.id === roundId; })[0];
    var m2 = round && round.matches.filter(function(x){ return x.id === id; })[0];
    if (!m2 || !m2.resultado) return null;
    return { context: roundTorneo(round) + " · " + round.name, labelA: bracketSideDisplay(m2, "a"), labelB: bracketSideDisplay(m2, "b"), scoreText: m2.resultado,
      winner: m2.ganador ? bracketSideDisplay(m2, m2.ganador === m2.a ? "a" : "b") : null };
  }
  return null;
}
function fitCanvasText(ctx, text, maxWidth, startSize, weight, family){
  var size = startSize;
  do {
    ctx.font = weight + " " + size + "px " + family;
    size -= 2;
  } while (ctx.measureText(text).width > maxWidth && size > 26);
  return ctx.font;
}
/* shared background for every branded share card (result or ranking): the terracotta→
   olive gradient, dot texture, ghost "8", and isotipo+wordmark header — drawn identically
   so a result card and a ranking card read as the same product. eyebrow is the small
   label under the header ("JORNADA 3", "RANKING"); pass "" to skip it. */
function drawCardChrome(ctx, W, H, eyebrow){
  var grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, "#c1592c");
  grad.addColorStop(1, "#373d20");

  ctx.fillStyle = "rgba(255,255,255,.08)";
  for (var y = 40; y < H - 20; y += 36){

      ctx.beginPath(); ctx.arc(x, y, 2.2, 0, Math.PI * 2); ctx.fill();
    }
  }
